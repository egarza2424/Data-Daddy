name: Audit Model Confidence Calibration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Audit confidence bands against frozen PPR errors
        run: python scripts/audit_model_confidence_calibration.py
