name: Update Market Consensus

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-consensus:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build weekly market consensus
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: |
          python scripts/build_weekly_market_consensus.py

      - name: Show generated consensus file
        run: |
          echo "Generated market consensus files:"
          ls -lh projection-model/*market-consensus.csv

          echo ""
          echo "First 10 rows:"
          head -n 11 projection-model/2026-week4-market-consensus.csv

      - name: Commit market consensus snapshot
        run: |
          git add projection-model/

          if git diff --cached --quiet; then
            echo "No market consensus changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Week 4 market consensus"
          git push
