
name: Test NFL Inactives Pipeline

on:
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season"
        required: true
        default: "2026"
        type: string
      week:
        description: "NFL week"
        required: true
        default: "6"
        type: string

permissions:
  contents: read

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover NFL inactive reports
        env:
          NFL_SEASON: ${{ inputs.season }}
          NFL_WEEK: ${{ inputs.week }}
        run: |
          python3 scripts/discover_nfl_inactives.py \
            --season "$NFL_SEASON" \
            --week "$NFL_WEEK"

      - name: Extract discovered report
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path(
              "data/nfl_inactive_report_candidates.json"
          )
          data = json.loads(path.read_text())

          candidates = data["candidates"]

          if not candidates:
              raise SystemExit(
                  "No reports discovered. Extraction stopped."
              )

          if len(candidates) != 1:
              raise SystemExit(
                  "Multiple reports found. Manual review required."
              )

          report = candidates[0]

          if report["verification_status"] != (
              "candidate_listing_date_checked"
          ):
              raise SystemExit(
                  "Report has not passed listing-date check."
              )

          url = report["url"]

          print("Extracting:", url)

          subprocess.run(
              [
                  "python3",
                  "scripts/extract_nfl_inactives.py",
                  "--url",
                  url,
              ],
              check=True,
          )

          extracted = json.loads(
              Path(
                  "data/nfl_inactives_extracted.json"
              ).read_text()
          )

          assert extracted["source_url"] == url
          assert extracted["verification_status"] == (
              "extracted_unverified"
          )

          print(
              "Pipeline completed:",
              extracted["player_count"],
              "unverified player records"
          )
          PY

      - name: Validate inactive teams against NFL schedule
        env:
          NFL_SEASON: ${{ inputs.season }}
          NFL_WEEK: ${{ inputs.week }}
        run: |
          python3 scripts/fetch_nfl_schedule.py

          python3 - <<'PY'
          import json
          import os
          from datetime import date, datetime, timezone
          from zoneinfo import ZoneInfo
          from pathlib import Path

          season = int(os.environ["NFL_SEASON"])
          week = int(os.environ["NFL_WEEK"])

          extracted = json.loads(
              Path("data/nfl_inactives_extracted.json").read_text()
          )
          schedule = json.loads(
              Path("data/nfl_schedule_2026.json").read_text()
          )

          team_codes = {
              "ARI": "CARDINALS", "ATL": "FALCONS",
              "BAL": "RAVENS", "BUF": "BILLS",
              "CAR": "PANTHERS", "CHI": "BEARS",
              "CIN": "BENGALS", "CLE": "BROWNS",
              "DAL": "COWBOYS", "DEN": "BRONCOS",
              "DET": "LIONS", "GB": "PACKERS",
              "HOU": "TEXANS", "IND": "COLTS",
              "JAX": "JAGUARS", "KC": "CHIEFS",
              "LA": "RAMS", "LAC": "CHARGERS",
              "LV": "RAIDERS", "MIA": "DOLPHINS",
              "MIN": "VIKINGS", "NE": "PATRIOTS",
              "NO": "SAINTS", "NYG": "GIANTS",
              "NYJ": "JETS", "PHI": "EAGLES",
              "PIT": "STEELERS", "SEA": "SEAHAWKS",
              "SF": "49ERS", "TB": "BUCCANEERS",
              "TEN": "TITANS", "WAS": "COMMANDERS",
          }

          if schedule["season"] != season:
              raise SystemExit("Schedule season mismatch")

          games = [
              game for game in schedule["games"]
              if int(game["week"]) == week
              and int(game["season"]) == season
              and date.fromisoformat(
                  game["gameday"]
              ).weekday() == 6
          ]

          expected = set()

          for game in games:
              for field in ("home_team", "away_team"):
                  code = game[field]
                  if code not in team_codes:
                      raise SystemExit(
                          f"Unknown team code: {code}"
                      )
                  expected.add(team_codes[code])

          actual = set(extracted["teams"])

          missing = sorted(expected - actual)
          extra = sorted(actual - expected)

          print("Scheduled Sunday games:", len(games))
          print("Scheduled Sunday teams:", len(expected))
          print("Extracted teams:", len(actual))
          print("Missing teams:", missing)
          print("Extra teams:", extra)

          if (
              len(games) != extracted["expected_game_count"]
              or missing
              or extra
          ):
              raise SystemExit(
                  "NFL inactive report schedule mismatch"
              )

          
          print("PASS: All Sunday teams match the schedule")

          eastern = ZoneInfo("America/New_York")
          pacific = ZoneInfo("America/Los_Angeles")

          kickoff_records = []

          for game in games:
              gameday = game.get("gameday", "")
              gametime = game.get("gametime", "")

              try:
                  local_kickoff = datetime.strptime(
                      f"{gameday} {gametime}",
                      "%Y-%m-%d %H:%M",
                  ).replace(tzinfo=eastern)
              except (ValueError, TypeError):
                  raise SystemExit(
                      f"Invalid kickoff for {game['game_id']}"
                  )

              utc_kickoff = local_kickoff.astimezone(
                  timezone.utc
              )

              pacific_kickoff = local_kickoff.astimezone(
                  pacific
              )

              kickoff_records.append({
                  "game_id": game["game_id"],
                  "home_team": game["home_team"],
                  "away_team": game["away_team"],
                  "kickoff_utc": utc_kickoff.isoformat(),
                  "kickoff_pacific": (
                      pacific_kickoff.isoformat()
                  ),
              })

              print(
                  "KICKOFF:",
                  game["game_id"],
                  "| Pacific:",
                  pacific_kickoff.strftime(
                      "%Y-%m-%d %I:%M %p %Z"
                  ),
                  "| UTC:",
                  utc_kickoff.isoformat(),
              )

          if len(kickoff_records) != len(games):
              raise SystemExit(
                  "Kickoff coverage is incomplete"
              )

          print(
              "PASS: All Sunday kickoff times parsed:",
              len(kickoff_records),
          )

          PY


      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-inactives-pipeline-test
          path: |
            data/nfl_inactive_report_candidates.json
            data/nfl_inactives_extracted.json
          if-no-files-found: warn
          retention-days: 7
