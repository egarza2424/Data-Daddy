name: Weekly Model Validation

on:
  workflow_dispatch:

  schedule:
    - cron: "0 22 * * 2"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas scipy

      - name: Find latest frozen pregame snapshot
        id: snapshot
        run: |
          python <<'PY'
          import os
          import re
          from pathlib import Path

          files = list(
              Path("model-snapshots").glob(
                  "2026-week*-pregame-model-snapshot.csv"
              )
          )

          if not files:
              raise SystemExit(
                  "No week-numbered frozen pregame snapshot found."
              )

          def snapshot_week(path):
              match = re.search(
                  r"2026-week(\d+)-pregame-model-snapshot\.csv$",
                  path.name
              )

              if not match:
                  return -1

              return int(match.group(1))

          snapshot = max(
              files,
              key=snapshot_week
          )

          week = snapshot_week(snapshot)

          if week <= 0:
              raise SystemExit(
                  "Could not determine snapshot week."
              )

          print(
              f"Using frozen snapshot: {snapshot}"
          )

          print(
              f"Frozen NFL Week: {week}"
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as output:
              output.write(
                  f"snapshot={snapshot}\n"
              )
              output.write(
                  f"week={week}\n"
              )
          PY

      - name: Validate frozen rankings
        env:
          SNAPSHOT: ${{ steps.snapshot.outputs.snapshot }}
          TARGET_WEEK: ${{ steps.snapshot.outputs.week }}
        run: |
          python <<'PY'
          import io
          import os
          import urllib.request
          from pathlib import Path

          import pandas as pd
          from scipy.stats import spearmanr

          snapshot_path = Path(
              os.environ["SNAPSHOT"]
          )

          target_week = int(
              os.environ["TARGET_WEEK"]
          )

          print(
              f"Loading frozen snapshot: {snapshot_path}"
          )

          print(
              f"Validating NFL Week {target_week}"
          )

          predictions = pd.read_csv(
              snapshot_path
          )

          required_prediction_columns = [
              "player_id",
              "player_name",
              "position",
              "model_score",
              "position_rank",
              "opportunity_score",
              "production_score",
              "usage_score",
              "play_caller_matchup_score",
              "player_vs_defensive_caller_score",
              "matchup_score",
              "redzone_score",
              "expert_score",
              "risk_score",
              "trench_score",
          ]

          missing = [
              column
              for column in required_prediction_columns
              if column not in predictions.columns
          ]

          if missing:
              raise SystemExit(
                  "Snapshot is missing required columns: "
                  + ", ".join(missing)
              )

          predictions["player_id"] = (
              predictions["player_id"]
              .astype(str)
              .str.replace(
                  r"\.0$",
                  "",
                  regex=True
              )
              .str.strip()
          )

          predictions["position"] = (
              predictions["position"]
              .astype(str)
              .str.upper()
              .str.strip()
          )

          predictions = predictions[
              predictions["position"].isin(
                  ["QB", "RB", "WR", "TE"]
              )
          ].copy()

          predictions["position_rank"] = (
              pd.to_numeric(
                  predictions["position_rank"],
                  errors="coerce"
              )
          )

          if predictions["position_rank"].isna().any():
              raise SystemExit(
                  "Snapshot contains invalid position ranks."
              )

          predictions["position_rank"] = (
              predictions["position_rank"]
              .astype(int)
          )

          stats_url = (
              "https://github.com/"
              "nflverse/nflverse-data/"
              "releases/download/stats_player/"
              "stats_player_week_2026.csv"
          )

          print(
              "Downloading actual 2026 player stats:"
          )

          print(stats_url)

          try:
              with urllib.request.urlopen(
                  stats_url,
                  timeout=120
              ) as response:
                  stats_content = (
                      response
                      .read()
                      .decode("utf-8")
                  )
          except Exception as error:
              raise SystemExit(
                  "Could not download 2026 player stats: "
                  f"{error}"
              )

          weekly = pd.read_csv(
              io.StringIO(stats_content),
              low_memory=False
          )

          print(
              f"Downloaded {len(weekly)} "
              "2026 player-week rows."
          )

          required_actual_columns = [
              "player_id",
              "position",
              "week",
              "season_type",
              "passing_yards",
              "passing_tds",
              "interceptions",
              "rushing_yards",
              "rushing_tds",
              "receptions",
              "receiving_yards",
              "receiving_tds",
          ]

          missing_actual = [
              column
              for column in required_actual_columns
              if column not in weekly.columns
          ]

          if missing_actual:
              raise SystemExit(
                  "NFL stats are missing required columns: "
                  + ", ".join(missing_actual)
              )

          weekly["week"] = pd.to_numeric(
              weekly["week"],
              errors="coerce"
          )

          available_weeks = sorted(
              weekly.loc[
                  weekly["season_type"]
                  .fillna("REG")
                  .astype(str)
                  .isin(["REG", ""]),
                  "week"
              ]
              .dropna()
              .astype(int)
              .unique()
              .tolist()
          )

          print(
              "Available 2026 regular-season weeks:",
              available_weeks
          )

          if target_week not in available_weeks:
              raise SystemExit(
                  f"Actual stats for NFL Week {target_week} "
                  "are not available yet. "
                  f"Available weeks: {available_weeks}"
              )

          actual = weekly[
              weekly["week"].eq(target_week)
          ].copy()

          actual = actual[
              actual["season_type"]
              .fillna("REG")
              .astype(str)
              .isin(["REG", ""])
          ].copy()

          actual["position"] = (
              actual["position"]
              .astype(str)
              .str.upper()
              .str.strip()
          )

          actual = actual[
              actual["position"].isin(
                  ["QB", "RB", "WR", "TE"]
              )
          ].copy()

          actual["player_id"] = (
              actual["player_id"]
              .astype(str)
              .str.replace(
                  r"\.0$",
                  "",
                  regex=True
              )
              .str.strip()
          )

          stat_columns = [
              "passing_yards",
              "passing_tds",
              "interceptions",
              "rushing_yards",
              "rushing_tds",
              "receptions",
              "receiving_yards",
              "receiving_tds",
          ]

          for column in stat_columns:
              actual[column] = (
                  pd.to_numeric(
                      actual[column],
                      errors="coerce"
                  )
                  .fillna(0.0)
              )

          actual["actual_ppr"] = (
              actual["passing_yards"] / 25.0
              + actual["passing_tds"] * 4.0
              - actual["interceptions"] * 2.0
              + actual["rushing_yards"] / 10.0
              + actual["rushing_tds"] * 6.0
              + actual["receptions"]
              + actual["receiving_yards"] / 10.0
              + actual["receiving_tds"] * 6.0
          )

          actual = (
              actual
              .sort_values(
                  "actual_ppr",
                  ascending=False
              )
              .drop_duplicates(
                  subset=["player_id"],
                  keep="first"
              )
          )

          print(
              f"Week {target_week} actual "
              f"QB/RB/WR/TE rows: {len(actual)}"
          )

          merged = predictions.merge(
              actual[
                  [
                      "player_id",
                      "actual_ppr",
                  ]
              ],
              on="player_id",
              how="left",
              validate="one_to_one"
          )

          matched_count = int(
              merged["actual_ppr"]
              .notna()
              .sum()
          )

          unmatched_count = int(
              merged["actual_ppr"]
              .isna()
              .sum()
          )

          print(
              f"Matched snapshot players: {matched_count}"
          )

          print(
              f"Snapshot players without Week "
              f"{target_week} stats: {unmatched_count}"
          )

          # A frozen ranking contains players who may not
          # record a stat in the target week. They remain in
          # the evaluation population with 0 PPR.
          merged["actual_ppr"] = (
              merged["actual_ppr"]
              .fillna(0.0)
          )

          # Rank actual fantasy performance separately
          # within QB, RB, WR and TE.
          #
          # method="min" preserves ties:
          # two players with equal PPR receive the same rank.
          merged["actual_rank"] = (
              merged
              .groupby("position")[
                  "actual_ppr"
              ]
              .rank(
                  method="min",
                  ascending=False
              )
              .astype(int)
          )

          # Positive:
          # model ranked player lower than actual finish.
          #
          # Negative:
          # model ranked player higher than actual finish.
          merged["rank_difference"] = (
              merged["position_rank"]
              - merged["actual_rank"]
          )

          merged["absolute_rank_error"] = (
              merged["rank_difference"]
              .abs()
          )

          signal_columns = [
              "opportunity_score",
              "production_score",
              "usage_score",
              "play_caller_matchup_score",
              "player_vs_defensive_caller_score",
              "matchup_score",
              "redzone_score",
              "expert_score",
              "risk_score",
              "trench_score",
          ]

          for column in (
              signal_columns
              + ["model_score"]
          ):
              merged[column] = pd.to_numeric(
                  merged[column],
                  errors="coerce"
              )

          report_columns = [
              "player_id",
              "player_name",
              "position",
              "position_rank",
              "actual_rank",
              "rank_difference",
              "absolute_rank_error",
              "model_score",
              "actual_ppr",
              "opportunity_score",
              "production_score",
              "usage_score",
              "play_caller_matchup_score",
              "player_vs_defensive_caller_score",
              "matchup_score",
              "redzone_score",
              "expert_score",
              "risk_score",
              "trench_score",
          ]

          report = (
              merged[report_columns]
              .sort_values(
                  [
                      "position",
                      "position_rank",
                  ]
              )
              .reset_index(drop=True)
          )

          output_dir = Path(
              "model-validation"
          )

          output_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          detail_path = (
              output_dir
              / (
                  f"2026-week{target_week}"
                  "-validation.csv"
              )
          )

          report.to_csv(
              detail_path,
              index=False
          )

          summary_rows = []
          signal_rows = []

          for position in [
              "QB",
              "RB",
              "WR",
              "TE",
          ]:
              group = report[
                  report["position"] == position
              ].copy()

              if group.empty:
                  continue

              mae = float(
                  group[
                      "absolute_rank_error"
                  ].mean()
              )

              rank_rho = spearmanr(
                  group["position_rank"],
                  group["actual_rank"],
                  nan_policy="omit"
              ).statistic

              score_rho = spearmanr(
                  group["model_score"],
                  group["actual_ppr"],
                  nan_policy="omit"
              ).statistic

              summary_rows.append(
                  {
                      "position": position,
                      "players": len(group),
                      "mean_absolute_rank_error":
                          round(mae, 3),
                      "rank_spearman":
                          (
                              round(
                                  float(rank_rho),
                                  3
                              )
                              if pd.notna(rank_rho)
                              else None
                          ),
                      "score_vs_ppr_spearman":
                          (
                              round(
                                  float(score_rho),
                                  3
                              )
                              if pd.notna(score_rho)
                              else None
                          ),
                  }
              )

              print()
              print(
                  f"===== {position} ====="
              )

              print(
                  f"Players: {len(group)}"
              )

              print(
                  f"Mean absolute rank error: "
                  f"{mae:.3f}"
              )

              print(
                  f"Rank Spearman: "
                  f"{rank_rho:.3f}"
              )

              print(
                  f"Model score vs PPR Spearman: "
                  f"{score_rho:.3f}"
              )

              print()
              print(
                  "10-signal correlations "
                  "with actual PPR:"
              )

              for signal in signal_columns:
                  valid = group[
                      [
                          signal,
                          "actual_ppr",
                      ]
                  ].dropna()

                  if (
                      len(valid) < 3
                      or
                      valid[signal].nunique() < 2
                      or
                      valid["actual_ppr"].nunique() < 2
                  ):
                      rho = None
                  else:
                      result = spearmanr(
                          valid[signal],
                          valid["actual_ppr"]
                      ).statistic

                      rho = (
                          float(result)
                          if pd.notna(result)
                          else None
                      )

                  signal_rows.append(
                      {
                          "position": position,
                          "signal": signal,
                          "players": len(valid),
                          "spearman_vs_actual_ppr":
                              (
                                  round(rho, 3)
                                  if rho is not None
                                  else None
                              ),
                      }
                  )

                  if rho is None:
                      print(
                          f"{signal}: unavailable"
                      )
                  else:
                      print(
                          f"{signal}: {rho:.3f}"
                      )

          summary = pd.DataFrame(
              summary_rows
          )

          summary_path = (
              output_dir
              / (
                  f"2026-week{target_week}"
                  "-summary.csv"
              )
          )

          summary.to_csv(
              summary_path,
              index=False
          )

          signal_report = pd.DataFrame(
              signal_rows
          )

          signal_path = (
              output_dir
              / (
                  f"2026-week{target_week}"
                  "-signal-analysis.csv"
              )
          )

          signal_report.to_csv(
              signal_path,
              index=False
          )

          # Save the largest ranking misses separately
          # for easier weekly diagnosis.
          misses = (
              report
              .sort_values(
                  "absolute_rank_error",
                  ascending=False
              )
              .head(50)
          )

          misses_path = (
              output_dir
              / (
                  f"2026-week{target_week}"
                  "-largest-misses.csv"
              )
          )

          misses.to_csv(
              misses_path,
              index=False
          )

          print()
          print(
              "Validation complete."
          )

          print(
              f"Detailed player report: "
              f"{detail_path}"
          )

          print(
              f"Position summary: "
              f"{summary_path}"
          )

          print(
              f"Signal analysis: "
              f"{signal_path}"
          )

          print(
              f"Largest misses: "
              f"{misses_path}"
          )
          PY

      - name: Show validation results
        run: |
          echo "Generated validation files:"
          ls -lh model-validation/

          echo ""
          echo "Position summary:"
          cat model-validation/*-summary.csv

          echo ""
          echo "Signal analysis:"
          cat model-validation/*-signal-analysis.csv

      - name: Commit validation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add model-validation/

          if git diff --cached --quiet; then
            echo "No new validation results to commit."
            exit 0
          fi

          git commit -m "Add weekly model validation results"
          git push
