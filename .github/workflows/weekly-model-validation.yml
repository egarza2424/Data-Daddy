name: Weekly Model Validation

on:
  workflow_dispatch:

  schedule:
    - cron: "0 22 * * 2"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas scipy nfl_data_py

      - name: Find latest frozen pregame snapshot
        id: snapshot
        run: |
          python <<'PY'
          from pathlib import Path

          files = sorted(
              Path("model-snapshots").glob(
                  "*-pregame-model-snapshot.csv"
              )
          )

          if not files:
              raise SystemExit(
                  "No frozen pregame snapshot found."
              )

          snapshot = files[-1]

          print(
              f"Using frozen snapshot: {snapshot}"
          )

          with open(
              Path(
                  __import__("os").environ[
                      "GITHUB_OUTPUT"
                  ]
              ),
              "a"
          ) as output:
              output.write(
                  f"snapshot={snapshot}\n"
              )
          PY

      - name: Validate frozen rankings
        env:
          SNAPSHOT: ${{ steps.snapshot.outputs.snapshot }}
        run: |
          python <<'PY'
          import os
          import re
          from pathlib import Path

          import pandas as pd
          from scipy.stats import spearmanr
          import nfl_data_py as nfl

          snapshot_path = Path(
              os.environ["SNAPSHOT"]
          )

          print(
              f"Loading snapshot: {snapshot_path}"
          )

          predictions = pd.read_csv(
              snapshot_path
          )

          required_prediction_columns = [
              "player_id",
              "player_name",
              "position",
              "model_score",
              "position_rank",
              "opportunity_score",
              "production_score",
              "usage_score",
              "play_caller_matchup_score",
              "player_vs_defensive_caller_score",
              "matchup_score",
              "redzone_score",
              "expert_score",
              "risk_score",
              "trench_score",
          ]

          missing = [
              column
              for column
              in required_prediction_columns
              if column not in predictions.columns
          ]

          if missing:
              raise SystemExit(
                  "Snapshot is missing columns: "
                  + ", ".join(missing)
              )

          predictions["player_id"] = (
              predictions["player_id"]
              .astype(str)
              .str.replace(r"\.0$", "", regex=True)
          )

          predictions["position"] = (
              predictions["position"]
              .astype(str)
              .str.upper()
          )

          snapshot_name = snapshot_path.name

          date_match = re.search(
              r"2026-(\d{4}-\d{2}-\d{2})-pregame",
              snapshot_name
          )

          if not date_match:
              raise SystemExit(
                  "Could not read snapshot date "
                  "from filename."
              )

          snapshot_date = pd.Timestamp(
              date_match.group(1)
          )

          print(
              "Snapshot date:",
              snapshot_date.date()
          )

          print(
              "Downloading 2026 weekly stats..."
          )

          weekly = nfl.import_weekly_data(
              [2026]
          )

          if weekly.empty:
              raise SystemExit(
                  "No 2026 weekly NFL data returned."
              )

          weekly["player_id"] = (
              weekly["player_id"]
              .astype(str)
              .str.replace(r"\.0$", "", regex=True)
          )

          if "fantasy_points_ppr" not in weekly.columns:
              raise SystemExit(
                  "fantasy_points_ppr is missing "
                  "from weekly stats."
              )

          available_weeks = sorted(
              weekly["week"]
              .dropna()
              .astype(int)
              .unique()
          )

          if not available_weeks:
              raise SystemExit(
                  "No completed NFL weeks found."
              )

          target_week = max(
              available_weeks
          )

          print(
              f"Validating NFL Week {target_week}"
          )

          actual = weekly[
              weekly["week"].astype(int)
              == target_week
          ].copy()

          actual = actual[
              actual["season_type"]
              .astype(str)
              .eq("REG")
          ].copy()

          actual["position"] = (
              actual["position"]
              .astype(str)
              .str.upper()
          )

          actual = actual[
              actual["position"].isin(
                  ["QB", "RB", "WR", "TE"]
              )
          ].copy()

          actual = (
              actual
              .sort_values(
                  "fantasy_points_ppr",
                  ascending=False
              )
              .drop_duplicates(
                  subset=["player_id"],
                  keep="first"
              )
          )

          merged = predictions.merge(
              actual[
                  [
                      "player_id",
                      "fantasy_points_ppr",
                  ]
              ],
              on="player_id",
              how="left",
              validate="one_to_one",
          )

          merged["actual_ppr"] = (
              merged["fantasy_points_ppr"]
          )

          merged["actual_ppr"] = (
              merged["actual_ppr"]
              .fillna(0.0)
          )

          merged["actual_rank"] = (
              merged.groupby("position")[
                  "actual_ppr"
              ]
              .rank(
                  method="min",
                  ascending=False
              )
              .astype(int)
          )

          merged["rank_difference"] = (
              merged["position_rank"]
              - merged["actual_rank"]
          )

          merged["absolute_rank_error"] = (
              merged["rank_difference"]
              .abs()
          )

          report_columns = [
              "player_id",
              "player_name",
              "position",
              "position_rank",
              "actual_rank",
              "rank_difference",
              "absolute_rank_error",
              "model_score",
              "actual_ppr",
              "opportunity_score",
              "production_score",
              "usage_score",
              "play_caller_matchup_score",
              "player_vs_defensive_caller_score",
              "matchup_score",
              "redzone_score",
              "expert_score",
              "risk_score",
              "trench_score",
          ]

          report = merged[
              report_columns
          ].copy()

          report = report.sort_values(
              [
                  "position",
                  "position_rank",
              ]
          )

          output_dir = Path(
              "model-validation"
          )

          output_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          detail_path = (
              output_dir
              / f"2026-week{target_week}-validation.csv"
          )

          report.to_csv(
              detail_path,
              index=False
          )

          summary_rows = []

          signal_columns = [
              "opportunity_score",
              "production_score",
              "usage_score",
              "play_caller_matchup_score",
              "player_vs_defensive_caller_score",
              "matchup_score",
              "redzone_score",
              "expert_score",
              "risk_score",
              "trench_score",
          ]

          for position in [
              "QB",
              "RB",
              "WR",
              "TE",
          ]:
              group = report[
                  report["position"] == position
              ].copy()

              if group.empty:
                  continue

              mae = (
                  group[
                      "absolute_rank_error"
                  ]
                  .mean()
              )

              rank_rho = spearmanr(
                  group["position_rank"],
                  group["actual_rank"],
                  nan_policy="omit",
              ).statistic

              score_rho = spearmanr(
                  group["model_score"],
                  group["actual_ppr"],
                  nan_policy="omit",
              ).statistic

              summary_rows.append(
                  {
                      "position": position,
                      "players": len(group),
                      "mean_absolute_rank_error":
                          round(float(mae), 3),
                      "rank_spearman":
                          round(
                              float(rank_rho),
                              3
                          ),
                      "score_vs_ppr_spearman":
                          round(
                              float(score_rho),
                              3
                          ),
                  }
              )

              print()
              print(
                  f"===== {position} ====="
              )
              print(
                  f"Players: {len(group)}"
              )
              print(
                  f"MAE: {mae:.3f}"
              )
              print(
                  "Rank Spearman:",
                  f"{rank_rho:.3f}"
              )
              print(
                  "Score/PPR Spearman:",
                  f"{score_rho:.3f}"
              )

              print()
              print(
                  "Signal correlations "
                  "with actual PPR:"
              )

              for signal in signal_columns:
                  valid = group[
                      [signal, "actual_ppr"]
                  ].dropna()

                  if (
                      len(valid) < 3
                      or valid[signal].nunique() < 2
                      or valid[
                          "actual_ppr"
                      ].nunique() < 2
                  ):
                      rho = float("nan")
                  else:
                      rho = spearmanr(
                          valid[signal],
                          valid["actual_ppr"],
                      ).statistic

                  print(
                      f"{signal}: "
                      f"{rho:.3f}"
                  )

          summary = pd.DataFrame(
              summary_rows
          )

          summary_path = (
              output_dir
              / f"2026-week{target_week}-summary.csv"
          )

          summary.to_csv(
              summary_path,
              index=False
          )

          print()
          print(
              f"Detailed report: {detail_path}"
          )
          print(
              f"Summary report: {summary_path}"
          )
          PY

      - name: Show validation results
        run: |
          ls -lh model-validation/
          echo ""
          cat model-validation/*-summary.csv

      - name: Commit validation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add model-validation/

          if git diff --cached --quiet; then
            echo "No new validation results to commit."
            exit 0
          fi

          git commit -m "Add weekly model validation results"
          git push
