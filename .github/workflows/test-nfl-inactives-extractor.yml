
name: Test NFL Inactives Extractor

on:
  workflow_dispatch:
    inputs:
      report_url:
        description: "NFL.com inactive report URL"
        required: true
        type: string
        default: "https://www.nfl.com/news/nfl-week-6-inactives-players-ruled-out-sunday-2026-season"

permissions:
  contents: read

jobs:
  test-extractor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NFL inactive extractor
        env:
          NFL_REPORT_URL: ${{ inputs.report_url }}
        run: python3 scripts/extract_nfl_inactives.py --url "$NFL_REPORT_URL"
      
      - name: Validate extracted records
        env:
          NFL_REPORT_URL: ${{ inputs.report_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("data/nfl_inactives_extracted.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          players = data["players"]
          teams = set(data["teams"])

          print("Extracted players:", len(players))
          print("Teams:", ", ".join(sorted(teams)))

          assert data["source_url"] == os.environ["NFL_REPORT_URL"]
          assert data["verification_status"] == "extracted_unverified"
          assert data["player_count"] == len(players)
          assert len(players) >= 10
          assert len(teams) >= 2

          seen = set()

          for player in players:
              assert player["team"] in teams
              assert player["position"]
              assert player["name"]
              assert player["source_url"] == data["source_url"]
              assert isinstance(
                  player["emergency_third_qb"], bool
              )

              key = (
                  player["team"],
                  player["position"],
                  player["name"],
              )

              assert key not in seen, f"Duplicate player: {key}"
              seen.add(key)

          print("Dynamic extraction validation passed.")
          PY

      - name: Upload extracted records
        uses: actions/upload-artifact@v4
        with:
          name: nfl-inactives-extraction
          path: data/nfl_inactives_extracted.json
          retention-days: 7
