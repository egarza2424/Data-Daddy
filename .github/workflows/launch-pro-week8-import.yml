name: Launch Pro Week 8 Draft Import

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type IMPORT-2026-W8-V1 to authorize a private draft database import'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pro-week8-v1-import
  cancel-in-progress: false

jobs:
  import-draft:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'IMPORT-2026-W8-V1' }}
    runs-on: ubuntu-latest
    environment: pro-import
    timeout-minutes: 10
    steps:
      - name: Check out reviewed development code
        uses: actions/checkout@v4
        with:
          ref: 5edd4e4a4026c9d7b9f22ae3bc32925506a2f75a
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare and validate Week 8 draft offline
        run: |
          python scripts/prepare_pro_projection_import.py \
            --csv projection-model/2026-week8-ppr-projections.csv \
            --season 2026 --week 8 --version 1 \
            --output /tmp/pro-week8-import-draft.json
          python scripts/import_pro_projection_draft.py --draft /tmp/pro-week8-import-draft.json
          python - <<'PY'
          import json
          with open('/tmp/pro-week8-import-draft.json', encoding='utf-8') as f:
              data = json.load(f)
          assert (data['snapshot']['season'], data['snapshot']['week'], data['snapshot']['version'], data['snapshot']['status']) == (2026, 8, 1, 'draft')
          assert len(data['players']) == len(data['availability']) == 354
          assert len({p['player_id'] for p in data['players']}) == 354
          assert {a['player_id'] for a in data['availability']} == {p['player_id'] for p in data['players']}
          PY
      - name: Import private draft (requires environment approval)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          python scripts/import_pro_projection_draft.py \
            --draft /tmp/pro-week8-import-draft.json \
            --source-commit "$(git rev-parse HEAD)" \
            --apply
