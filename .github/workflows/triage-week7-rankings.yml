name: Triage Week 7 Rankings
on:
  workflow_dispatch:
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run ranking triage
        run: |
          python -m py_compile scripts/triage_week7_rankings.py
          python scripts/triage_week7_rankings.py
