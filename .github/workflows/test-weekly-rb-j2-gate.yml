name: Test Weekly RB J2 Gate (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-j2-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Check syntax
        run: python -m py_compile scripts/build_live_rb_j2_features.py scripts/build_rb_returning_player_audit.py scripts/build_weekly_rb_j2.py scripts/validate_weekly_rb_j2_gate.py
      - name: Generate read-only J2 inputs
        run: |
          python scripts/build_live_rb_j2_features.py
          python scripts/build_rb_returning_player_audit.py
      - name: Audit low-sample RB workloads before J2
        run: python scripts/audit_weekly_rb_low_sample_roles.py
      - name: Generate J2 and validate gate
        run: |
          python scripts/build_weekly_rb_j2.py
          python scripts/validate_weekly_rb_j2_gate.py
      - name: Review Jordan Mason J2 versus Model F
        run: |
          python - <<'PY'
          import pandas as pd
          j2 = pd.read_csv('projection-model/validation/2026-week8-rb-j2-experimental.csv')
          mason = j2.loc[(j2['player_name'] == 'Jordan Mason') & (j2['team'] == 'MIN')]
          if len(mason) != 1:
              raise SystemExit('Missing or duplicate Jordan Mason J2 row')
          print('JORDAN MASON J2:')
          print(mason[['player_name','team','j2_projection_status','j2_projected_ppr','j2_rank_2026_data_only']].to_string(index=False))
          try:
              f = pd.read_csv('projection-model/2026-week8-ppr-projections.csv')
              print('MODEL F FILE COLUMNS:', ', '.join(f.columns))
              print('MODEL F MASON ROW:')
              print(f.loc[f.astype(str).apply(lambda c: c.str.contains('Jordan Mason', case=False, regex=False)).any(axis=1)].to_string(index=False))
          except FileNotFoundError:
              print('Model F comparison file unavailable; no estimate invented.')
          PY
      - name: Audit priority RB weekly workloads
        run: python scripts/audit_week8_rb_workload.py
      - name: Audit Week 8 AI versus J2 RB divergence
        run: python scripts/audit_week8_rb_ai_j2_divergence.py
      - name: Inspect J2 feature alignment for priority RBs
        run: python scripts/audit_week8_rb_j2_feature_alignment.py
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-rb-j2-gate-test
          path: |
            projection-model/validation/2026-live-rb-j2-features-audit.csv
            projection-model/validation/2026-rb-returning-player-audit.csv
            projection-model/validation/2026-week*-rb-j2-experimental.csv
            projection-model/validation/2026-week*-rb-low-sample-role-review.csv
            projection-model/validation/2026-week8-rb-ai-j2-divergence.csv
            projection-model/validation/2026-week8-rb-workload-review.csv
          if-no-files-found: warn
