                  actual_blend != expected_blend_rounded or
                  actual_source != expected_source
              ):
                  invalid_defensive_blends.append(
                      (
                          defense,
                          position,
                          actual_blend,
                          expected_blend_rounded,
                          actual_source,
                          expected_source
                      )
                  )
          if invalid_defensive_blends:
