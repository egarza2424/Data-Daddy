                  ) or 0.0
              )

              if average_2026 is not None:
                  expected_blend = average_2026
                  expected_source = "2026_only"
              else:
                  expected_blend = None
                  expected_source = "unavailable"
              actual_blend = stored.get(
                  "fantasy_points_allowed"
              )

              actual_source = stored.get(
                  "blend_source"
              )

              defensive_2026_sample_counts[
                  games_2026
              ] += 1

              if actual_source in (
                  defensive_blend_source_counts
              ):
                  defensive_blend_source_counts[
                      actual_source
                  ] += 1

              expected_blend_rounded = (
                  round(expected_blend, 2)
                  if expected_blend is not None
                  else None
              )

