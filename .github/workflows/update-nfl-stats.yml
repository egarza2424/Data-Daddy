          print(
              "Players without defensive play-caller "
              "history: "
              f"{player_signal_counts['without_history']}."
          )

          print(
              "Players without an upcoming play-caller "
              "matchup: "
              f"{player_signal_counts['without_upcoming_matchup']}."
          )
          # -------------------------------------------------
          # NORMALIZE PLAY-CALLER SIGNALS TO 0-100
          # -------------------------------------------------

          position_values = {
              "QB": {
                  "play_caller": [],
                  "player_vs_caller": []
              },
              "RB": {
                  "play_caller": [],
                  "player_vs_caller": []
              },
              "WR": {
                  "play_caller": [],
                  "player_vs_caller": []
              },
              "TE": {
                  "play_caller": [],
                  "player_vs_caller": []
              }
          }

          # ---------------------------------------------
          # COLLECT PLAY-CALLER MATCHUP VALUES
          # ---------------------------------------------

          for team_signal in (
              current_play_caller_signals.values()
          ):
              for position, position_signal in (
                  team_signal.get(
                      "positions",
                      {}
                  ).items()
              ):
                  average_ppr = position_signal.get(
                      "average_ppr"
                  )

                  if (
                      position in position_values and
                      average_ppr is not None
                  ):
                      position_values[
                          position
                      ]["play_caller"].append(
                          float(average_ppr)
                      )

          # ---------------------------------------------
          # COLLECT PLAYER VS DEFENSIVE CALLER VALUES
          # ---------------------------------------------

          for signal in (
              current_player_vs_defensive_caller.values()
          ):
              position = signal.get("position")
              average_ppr = signal.get(
                  "average_ppr"
              )

              if (
                  position in position_values and
                  average_ppr is not None
              ):
                  position_values[
                      position
                  ]["player_vs_caller"].append(
                      float(average_ppr)
                  )

          # ---------------------------------------------
          # SCORE CURRENT PLAY-CALLER MATCHUPS
          # ---------------------------------------------

          for team_signal in (
              current_play_caller_signals.values()
          ):
              for position, position_signal in (
                  team_signal.get(
                      "positions",
                      {}
                  ).items()
              ):
                  average_ppr = position_signal.get(
                      "average_ppr"
                  )

                  sample_size = int(
                      position_signal.get(
                          "sample_size",
                          0
                      ) or 0
                  )

                  values = position_values.get(
                      position,
                      {}
                  ).get(
                      "play_caller",
                      []
                  )

                  if average_ppr is None:
                      raw_score = 50
                      confidence = 0.0
                      adjusted_score = 50
                      score_source = "neutral_no_history"

                  else:
                      raw_score = normalize_matchup_score(
                          average_ppr,
                          values
                      )

                      if sample_size >= 4:
                          confidence = 1.0
                      elif sample_size == 3:
                          confidence = 0.8
                      elif sample_size == 2:
                          confidence = 0.6
                      elif sample_size == 1:
                          confidence = 0.4
                      else:
                          confidence = 0.0

                      adjusted_score = round(
                          50 + (
                              raw_score - 50
                          ) * confidence,
                          2
                      )

                      score_source = (
                          "historical_sample_adjusted"
                      )

                  position_signal["raw_score"] = (
                      raw_score
                  )
                  position_signal[
                      "sample_confidence"
                  ] = confidence
                  position_signal["score"] = (
                      adjusted_score
                  )
                  position_signal[
                      "score_source"
                  ] = score_source
          # ---------------------------------------------
          # SCORE PLAYER VS DEFENSIVE CALLER
          # ---------------------------------------------

          for signal in (
              current_player_vs_defensive_caller.values()
          ):
              position = signal.get("position")
              average_ppr = signal.get(
                  "average_ppr"
              )

              sample_size = int(
                  signal.get(
                      "sample_size",
                      0
                  ) or 0
              )

              values = position_values.get(
                  position,
                  {}
              ).get(
                  "player_vs_caller",
                  []
              )

              if average_ppr is None:
                  raw_score = 50
                  confidence = 0.0
                  adjusted_score = 50
                  score_source = "neutral_no_history"

              else:
                  raw_score = normalize_matchup_score(
                      average_ppr,
                      values
                  )

                  if sample_size >= 4:
                      confidence = 1.0
                  elif sample_size == 3:
                      confidence = 0.8
                  elif sample_size == 2:
                      confidence = 0.6
                  elif sample_size == 1:
                      confidence = 0.4
                  else:
                      confidence = 0.0

                  adjusted_score = round(
                      50 + (
                          raw_score - 50
                      ) * confidence,
                      2
                  )

                  score_source = (
                      "historical_sample_adjusted"
                  )

              signal["raw_score"] = raw_score
              signal[
                  "sample_confidence"
              ] = confidence
              signal["score"] = adjusted_score
              signal[
                  "score_source"
              ] = score_source

          print(
              "Normalized play-caller signals "
              "to 0-100 scores."
          )
          # ---------------------------------------------
          # COMBINE PLAYER-LEVEL PLAY-CALLER MATCHUP
          # ---------------------------------------------

          current_player_play_caller_matchup = {}

          for player_id in current_player_ids:
              player_signal = (
                  current_player_vs_defensive_caller.get(
                      player_id
                  )
              )

              if not player_signal:
                  current_player_play_caller_matchup[
                      player_id
                  ] = {
                      "position": None,
                      "team": None,
                      "opponent": None,
                      "team_position_score": None,
                      "player_history_score": None,
                      "score": 50,
                      "available": False,
                      "score_source":
                          "neutral_no_play_caller_matchup"
                  }

                  continue

              position = player_signal.get(
                  "position"
              )
              team = player_signal.get(
                  "team"
              )

              normalized_team = (
                  "LAR"
                  if team == "LA"
                  else team
              )

              team_signal = (
                  current_play_caller_signals.get(
                      normalized_team,
                      {}
                  )
              )

              position_signal = (
                  team_signal.get(
                      "positions",
                      {}
                  ).get(
                      position,
                      {}
                  )
              )

              team_position_available = (
                  position_signal.get(
                      "average_ppr"
                  ) is not None
              )

              player_history_available = (
                  player_signal.get(
                      "average_ppr"
                  ) is not None
              )

              team_position_score = (
                  position_signal.get("score")
                  if team_position_available
                  else None
              )

              player_history_score = (
                  player_signal.get("score")
                  if player_history_available
                  else None
              )

              if (
                  team_position_available and
                  player_history_available
              ):
                  player_history_confidence = (
                      player_signal.get(
                          "sample_confidence",
                          0.0
                      )
                  )

                  team_foundation_weight = 1.0
                  player_history_weight = (
                      player_history_confidence
                  )

                  combined_score = round(
                      (
                          team_position_score *
                          team_foundation_weight +
                          player_history_score *
                          player_history_weight
                      ) /
                      (
                          team_foundation_weight +
                          player_history_weight
                      ),
                      2
                  )

                  available = True
                  score_source = (
                      "team_position_and_player_history"
                  )

              elif team_position_available:
                  combined_score = (
                      team_position_score
                  )
                  available = True
                  score_source = (
                      "team_position_history_only"
                  )

              elif player_history_available:
                  combined_score = (
                      player_history_score
                  )
                  available = True
                  score_source = (
                      "player_history_only"
                  )

              else:
                  combined_score = 50
                  available = False
                  score_source = (
                      "neutral_no_play_caller_history"
                  )

              current_player_play_caller_matchup[
                  player_id
