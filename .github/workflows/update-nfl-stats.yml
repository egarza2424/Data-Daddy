                      ),
                  "score": combined_score,
                  "available": available,
                  "score_source": score_source
              }
          # ---------------------------------------------
          # VALIDATE SAMPLE-AWARE PLAY-CALLER BLEND
          # ---------------------------------------------

          play_caller_blend_sample_counts = {
              1: 0,
              2: 0,
              3: 0,
              4: 0
          }

          invalid_play_caller_blends = []

          for (
              player_id,
              matchup
          ) in current_player_play_caller_matchup.items():
              if matchup.get("score_source") != (
