name: Update NFL Stats

on:
  workflow_dispatch:
    inputs:
      target_week:
        description: "Optional 2026 week to lock matchup data to"
        required: false
        default: ""
  schedule:
    - cron: "0 12 * * *"
permissions:
  contents: write
jobs:
  update-stats:
    runs-on: ubuntu-latest
    env:
      FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
      TARGET_WEEK: ${{ github.event.inputs.target_week || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install trench data dependencies
        run: python -m pip install pandas pyarrow
      - name: Verify trench modules
        run: |
          python -m py_compile build_trench_pregame.py public_trench_signal.py
          python -c "from build_trench_pregame import build; from public_trench_signal import compute; print('Trench modules ready')"
      - name: Build 2026 pregame trench data
        run: |
          python <<'PY'
          import urllib.request
          import pandas as pd
          from build_trench_pregame import build

          pbp_url = (
              "https://github.com/nflverse/nflverse-data/"
              "releases/download/pbp/play_by_play_2026.csv.gz"
          )
          schedule_url = (
              "https://raw.githubusercontent.com/"
              "nflverse/nfldata/master/data/games.csv"
          )

          try:
              print("Downloading 2026 play-by-play data...")
              pbp = pd.read_csv(
                  pbp_url,
                  compression="gzip",
                  usecols=[
                      "game_id", "posteam", "defteam",
                      "play_type", "sack", "qb_hit", "success"
                  ],
                  low_memory=False
              )

              print("Downloading NFL schedules...")
              schedule = pd.read_csv(schedule_url)

              print("Checking trench data coverage...")
              print("PBP games:", pbp["game_id"].nunique())
              print("Schedule 2026 regular-season games:",
                    len(schedule[
                        (schedule["season"] == 2026)
                        & (schedule["game_type"] == "REG")
                    ]))
              print("Matching game IDs:",
                    len(set(pbp["game_id"].dropna().astype(str))
                        & set(schedule["game_id"].dropna().astype(str))))

              from build_trench_pregame import aggregate

              counts = aggregate(pbp)
              print("Team-game records:", len(counts))
              print("Records with pass and rush data:",
                    sum(
                        1 for c in counts.values()
                        if c["offense_pass_plays"] > 0
                        and c["offense_rushes"] > 0
                    ))

              matched = schedule[
                  schedule["game_id"].astype(str).isin(
                      pbp["game_id"].dropna().astype(str)
                  )
              ]

              print("Matched games by week:")
              print(
                  matched.groupby(["season", "week"])
                  .size()
                  .to_string()
              )
              schedule_teams = set(
                  schedule.loc[
                      schedule["season"] == 2026,
                      ["home_team", "away_team"]
                  ].stack().dropna().astype(str)
              )
              pbp_teams = set(
                  pbp["posteam"].dropna().astype(str)
              )

              print("Schedule teams missing from PBP:",
                    sorted(schedule_teams - pbp_teams))
              print("PBP teams missing from schedule:",
                    sorted(pbp_teams - schedule_teams))
              schedule_2026 = schedule[
                  (schedule["season"] == 2026)
                  & (schedule["game_type"] == "REG")
              ]

              print("2026 games with dates:",
                    schedule_2026["gameday"].notna().sum())
              print("2026 games with kickoff times:",
                    schedule_2026["gametime"].notna().sum())
              print("Week 3 kickoff details:")
              print(
                  schedule_2026.loc[
                      schedule_2026["week"] == 3,
                      ["game_id", "gameday", "gametime"]
                  ].head(3).to_string(index=False)
              )                    
              print("Building pregame trench metrics...")
              rows = build(pbp, schedule)

              if rows:
                  pd.DataFrame(rows).to_csv(
                      "trench_2026_pregame_metrics.csv",
                      index=False
                  )
                  print(f"Generated {len(rows)} pregame matchup records.")
              else:
                  print("No eligible pregame trench data yet.")
          except Exception as error:
              print(f"Trench data unavailable: {error}")
              print("Continuing without Signal 10 data.")
          PY
      - name: Download and convert NFL stats
        run: |
          python <<'PY'
          import csv
          import gzip
          import io
          import json
          import os
          import urllib.request
          from collections import defaultdict
          from datetime import datetime, timezone          
          target_week_raw = os.environ.get(
              "TARGET_WEEK",
              ""
          ).strip()

          target_week = (
              int(target_week_raw)
              if target_week_raw
              else None
          )

          if target_week is not None:
              print(
                  f"Matchup schedule locked to "
                  f"2026 Week {target_week}."
              )
          else:
              print(
                  "Matchup schedule using live "
                  "next-opponent mode."
              )

          seasons = [2026, 2025]
          # -------------------------------------------------
          # COACHING / PLAY-CALLER DATA
          # -------------------------------------------------

          with open(
              "coordinators.json",
              "r",
              encoding="utf-8"
          ) as file:
              coaching_data = json.load(file)

          expected_seasons = {
              "2022",
              "2023",
              "2024",
              "2025",
              "2026"
          }

          missing_seasons = (
              expected_seasons -
              set(coaching_data.keys())
          )

          if missing_seasons:
              raise RuntimeError(
                  "Missing coaching seasons: "
                  f"{sorted(missing_seasons)}"
              )

          expected_teams = 32

          for season in sorted(expected_seasons):
              team_count = len(
                  coaching_data.get(season, {})
              )

              if team_count != expected_teams:
                  raise RuntimeError(
                      f"{season} coaching data has "
                      f"{team_count} teams instead of 32."
                  )

          print(
              "Loaded coaching/play-caller data "
              f"for {len(coaching_data)} seasons."
          )
          selected_fields = [
              "player_id",
              "player_name",
              "player_display_name",
              "position",
              "position_group",
              "season",
              "week",
              "season_type",
              "team",
              "opponent_team",
              "attempts",
              "passing_yards",
              "passing_tds",
              "interceptions",
              "carries",
              "rushing_yards",
              "rushing_tds",
              "targets",
              "receptions",
              "receiving_yards",
              "receiving_tds"
          ]
          def calculate_ppr_points(row):
              passing_yards = float(
                  row.get("passing_yards") or 0
              )

              passing_tds = float(
                  row.get("passing_tds") or 0
              )

              interceptions = float(
                  row.get("interceptions") or 0
              )

              rushing_yards = float(
                  row.get("rushing_yards") or 0
              )

              rushing_tds = float(
                  row.get("rushing_tds") or 0
              )

              receptions = float(
                  row.get("receptions") or 0
              )

              receiving_yards = float(
                  row.get("receiving_yards") or 0
              )

              receiving_tds = float(
                  row.get("receiving_tds") or 0
              )

              return (
                  passing_yards / 25 +
                  passing_tds * 4 -
                  interceptions * 2 +
                  rushing_yards / 10 +
                  rushing_tds * 6 +
                  receptions +
                  receiving_yards / 10 +
                  receiving_tds * 6
              )
          def normalize_matchup_score(
              value,
              values
          ):
              if value is None or not values:
                  return 50

              minimum = min(values)
              maximum = max(values)

              if maximum <= minimum:
                  return 50

              normalized = (
                  (
                      float(value) - minimum
                  ) /
                  (
                      maximum - minimum
                  )
              )

              score = round(
                  25 + normalized * 75
              )

              return max(
                  0,
                  min(100, score)
              )
              
          rows = []
          season_used = None

          for season in seasons:
              stats_url = (
                  "https://github.com/nflverse/nflverse-data/"
                  f"releases/download/stats_player/stats_player_week_{season}.csv"
              )

              print(f"Trying player stats: {stats_url}")

              try:
                  with urllib.request.urlopen(stats_url) as response:
                      content = response.read().decode("utf-8")

                  reader = csv.DictReader(io.StringIO(content))

                  season_rows = []

                  for row in reader:
                      if row.get("position") not in {"QB", "RB", "WR", "TE"}:
                          continue

                      if row.get("season_type") not in {"REG", ""}:
                          continue

                      clean_row = {
                          field: row.get(field, "")
                          for field in selected_fields
                      }

                      clean_row["red_zone_pass_attempts"] = 0
                      clean_row["red_zone_carries"] = 0
                      clean_row["red_zone_targets"] = 0

                      season_rows.append(clean_row)

                  if season_rows:
                      rows = season_rows
                      season_used = season

                      print(
                          f"Loaded {len(rows)} player-week records "
                          f"for {season}"
                      )

                      break

              except Exception as error:
                  print(f"{season} player stats unavailable: {error}")

          if not rows:
              raise RuntimeError(
                  "No NFL player stats could be downloaded."
              )

          # -------------------------------------------------
          # 2026 ROOKIE / PLAYER METADATA
          # -------------------------------------------------

          player_metadata_url = (
              "https://github.com/nflverse/nflverse-data/"
              "releases/download/players/players.csv"
          )

          print(
              "Trying NFL player metadata: "
              f"{player_metadata_url}"
          )

          with urllib.request.urlopen(
              player_metadata_url
          ) as response:
              player_metadata_content = (
                  response.read().decode("utf-8")
              )

          player_metadata_reader = csv.DictReader(
              io.StringIO(player_metadata_content)
          )
          player_metadata_reader = csv.DictReader(
              io.StringIO(player_metadata_content)
          )

          print(
              "NFL player metadata columns: "
              f"{player_metadata_reader.fieldnames}"
          )

          player_metadata_by_id = {}
          rookie_player_metadata = {}

          for player in player_metadata_reader:
              player_id = (
                  player.get("gsis_id") or
                  player.get("player_id")
              )

              if not player_id:
                  continue

              player_metadata_by_id[player_id] = player

              rookie_season = str(
                  player.get("rookie_season") or ""
              ).strip()

              draft_year = str(
                  player.get("draft_year") or ""
              ).strip()

              if rookie_season != "2026":
                  continue
              position = str(
                  player.get("position") or ""
              ).strip()

              if position not in {
                  "QB",
                  "RB",
                  "WR",
                  "TE"
              }:
                  continue

              rookie_player_metadata[player_id] = {
                  "player_id": player_id,
                  "player_name": (
                      player.get("display_name") or
                      player.get("full_name") or
                      player.get("football_name") or
                      player.get("short_name")
                  ),
                  "position": position,
                  "college": player.get("college_name"),
                  "rookie_season": rookie_season,
                  "draft_year": draft_year,
                  "draft_round": player.get("draft_round"),
                  "draft_pick": player.get("draft_pick"),
                  "draft_team": player.get("draft_team")
              }
          print(
              "Loaded metadata for "
              f"{len(player_metadata_by_id)} NFL players."
          )

          print(
              "Identified "
              f"{len(rookie_player_metadata)} "
              "2026 QB/RB/WR/TE rookies."
          )

          drafted_rookie_ids = {
              player_id
              for player_id, rookie in (
                  rookie_player_metadata.items()
              )
              if str(
                  rookie.get("draft_year") or ""
              ).strip() == "2026"
          }

          undrafted_rookie_ids = (
              set(rookie_player_metadata.keys()) -
              drafted_rookie_ids
          )

          print(
              "2026 rookie metadata breakdown: "
              f"{len(drafted_rookie_ids)} drafted, "
              f"{len(undrafted_rookie_ids)} undrafted."
          )

          print(
              "2026 undrafted rookie details: "
              f"{[rookie_player_metadata[player_id] for player_id in sorted(undrafted_rookie_ids)]}"
          )

          # -------------------------------------------------
          # 2026 ROSTER DATA
          # -------------------------------------------------

          roster_url = (
              "https://github.com/nflverse/nflverse-data/"
              "releases/download/rosters/roster_2026.csv"
          )

          print(
              "Trying 2026 roster data: "
              f"{roster_url}"
          )

          with urllib.request.urlopen(
              roster_url
          ) as response:
              roster_content = (
                  response.read().decode("utf-8")
              )

          roster_reader = csv.DictReader(
              io.StringIO(roster_content)
          )

          print(
              "NFL roster columns: "
              f"{roster_reader.fieldnames}"
          )

          roster_players_by_id = {}

          for roster_player in roster_reader:
              roster_player_id = (
                  roster_player.get("gsis_id") or
                  roster_player.get("player_id")
              )

              if not roster_player_id:
                  continue

              roster_position = str(
                  roster_player.get("position") or ""
              ).strip()

              if roster_position not in {
                  "QB",
                  "RB",
                  "WR",
                  "TE"
              }:
                  continue

              roster_team = str(
                  roster_player.get("team") or ""
              ).strip()

              if roster_team == "LA":
                  roster_team = "LAR"

              roster_players_by_id[roster_player_id] = {
                  "player_id": roster_player_id,
                  "player_name": (
                      roster_player.get("full_name") or
                      roster_player.get("player_name")
                  ),
                  "position": roster_position,
                  "team": roster_team,
                  "years_exp": roster_player.get("years_exp"),
                  "rookie_year": roster_player.get("rookie_year"),
                  "entry_year": roster_player.get("entry_year"),
                  "draft_club": roster_player.get("draft_club"),
                  "draft_number": roster_player.get("draft_number")
              }
          print(
              "Loaded "
              f"{len(roster_players_by_id)} "
              "2026 rostered QB/RB/WR/TE players."
          )

          roster_rookie_ids = {
              player_id
              for player_id, roster_player in (
                  roster_players_by_id.items()
              )
              if str(
                  roster_player.get("rookie_year") or ""
              ).strip() == "2026"
          }

          rookie_metadata_roster_ids = (
              set(rookie_player_metadata.keys()) &
              set(roster_players_by_id.keys())
          )

          print(
              "2026 roster rookies by rookie_year: "
              f"{len(roster_rookie_ids)}."
          )

          print(
              "2026 metadata rookies found on roster: "
              f"{len(rookie_metadata_roster_ids)}."
          )

          print(
              "Roster rookie IDs missing from player metadata: "
              f"{len(roster_rookie_ids - set(rookie_player_metadata.keys()))}."
          )

          print(
              "Player-metadata rookie IDs missing from roster rookie_year: "
              f"{len(rookie_metadata_roster_ids - roster_rookie_ids)}."
          )

          roster_only_rookie_ids = (
              roster_rookie_ids -
              set(rookie_player_metadata.keys())
          )

          metadata_only_rookie_ids = (
              rookie_metadata_roster_ids -
              roster_rookie_ids
          )

          roster_only_rookie_details = [
              {
                  "player_id": player_id,
                  "player_name": (
                      roster_players_by_id[player_id].get(
                          "player_name"
                      )
                  ),
                  "position": (
                      roster_players_by_id[player_id].get(
                          "position"
                      )
                  ),
                  "team": (
                      roster_players_by_id[player_id].get(
                          "team"
                      )
                  ),
                  "rookie_year": (
                      roster_players_by_id[player_id].get(
                          "rookie_year"
                      )
                  ),
                  "entry_year": (
                      roster_players_by_id[player_id].get(
                          "entry_year"
                      )
                  ),
                  "years_exp": (
                      roster_players_by_id[player_id].get(
                          "years_exp"
                      )
                  ),
                  "draft_club": (
                      roster_players_by_id[player_id].get(
                          "draft_club"
                      )
                  ),
                  "draft_number": (
                      roster_players_by_id[player_id].get(
                          "draft_number"
                      )
                  )
              }
              for player_id in sorted(
                  roster_only_rookie_ids
              )
          ]

          metadata_only_rookie_details = [
              {
                  "player_id": player_id,
                  "player_metadata": (
                      rookie_player_metadata.get(
                          player_id,
                          {}
                      )
                  ),
                  "roster_metadata": (
                      roster_players_by_id.get(
                          player_id,
                          {}
                      )
                  )
              }
              for player_id in sorted(
                  metadata_only_rookie_ids
              )
          ]

          print(
              "Roster-only rookie mismatch details: "
              f"{roster_only_rookie_details}"
          )

          print(
              "Metadata-only rookie mismatch details: "
              f"{metadata_only_rookie_details}"
          )

          # -------------------------------------------------
          # COMPLETED 2026 PLAYER-WEEK DATA
          # Use completed 2026 weeks as rolling model history.
          # Never include the target prediction week itself.
          # -------------------------------------------------

          completed_2026_rows = []

          if season_used == 2026:
              available_2026_weeks = []

              for row in rows:
                  try:
                      row_week = int(
                          float(row.get("week") or 0)
                      )
                  except (TypeError, ValueError):
                      continue

                  if row_week > 0:
                      available_2026_weeks.append(row_week)

              if target_week is not None:
                  history_cutoff_week = target_week
              elif available_2026_weeks:
                  history_cutoff_week = max(
                      available_2026_weeks
                  ) + 1
              else:
                  history_cutoff_week = 1

              for row in rows:
                  try:
                      row_week = int(
                          float(row.get("week") or 0)
                      )
                  except (TypeError, ValueError):
                      continue

                  if row_week >= history_cutoff_week:
                      continue

                  completed_2026_rows.append(
                      dict(row)
                  )

          print(
              f"Added {len(completed_2026_rows)} completed "
              "2026 player-week records to rolling history."
          )
          # -------------------------------------------------
          # HISTORICAL PLAYER-WEEK DATA
          # 2022-2025 for coaching matchup calculations
          # -------------------------------------------------

          historical_rows = []

          historical_seasons = [
              2022,
              2023,
              2024,
              2025
          ]

          for historical_season in historical_seasons:
              historical_url = (
                  "https://github.com/nflverse/"
                  "nflverse-data/releases/download/"
                  "stats_player/"
                  f"stats_player_week_{historical_season}.csv"
              )

              print(
                  "Trying historical player stats: "
                  f"{historical_url}"
              )

              try:
                  with urllib.request.urlopen(
                      historical_url
                  ) as response:
                      historical_content = (
                          response.read().decode("utf-8")
                      )

                  historical_reader = csv.DictReader(
                      io.StringIO(historical_content)
                  )

                  season_record_count = 0

                  for row in historical_reader:
                      if row.get("position") not in {
                          "QB",
                          "RB",
                          "WR",
                          "TE"
                      }:
                          continue

                      if row.get("season_type") not in {
                          "REG",
                          ""
                      }:
                          continue

                      clean_row = {
                          field: row.get(field, "")
                          for field in selected_fields
                      }

                      historical_rows.append(
                          clean_row
                      )

                      season_record_count += 1

                  print(
                      f"Loaded {season_record_count} "
                      "historical player-week records "
                      f"for {historical_season}."
                  )

              except Exception as error:
                  raise RuntimeError(
                      "Historical player stats unavailable "
                      f"for {historical_season}: {error}"
                  )

          # Add only completed 2026 weeks to the historical
          # dataset used by rolling model signals.
          historical_rows.extend(
              dict(row)
              for row in completed_2026_rows
          )

          print(
              "Loaded "
              f"{len(historical_rows)} total historical "
              "player-week records for 2022-2026 "
              "(completed weeks only)."
          )

          # -------------------------------------------------
          # HISTORICAL ROOKIE DRAFT-CAPITAL OUTCOMES
          # Weeks 1-4 diagnostic only.
          # Seed from player metadata so drafted rookies with
          # zero recorded stats remain in the sample.
          # Does not affect model scoring.
          # -------------------------------------------------

          historical_rookie_player_outcomes = {}

          historical_rookie_seasons = {
              "2022",
              "2023",
              "2024",
              "2025"
          }

          valid_rookie_positions = {
              "QB",
              "RB",
              "WR",
              "TE"
          }

          for player_id, player_metadata in (
              player_metadata_by_id.items()
          ):
              rookie_season = str(
                  player_metadata.get("rookie_season") or ""
              ).strip()

              draft_year = str(
                  player_metadata.get("draft_year") or ""
              ).strip()

              position = str(
                  player_metadata.get("position") or ""
              ).strip()

              draft_pick = player_metadata.get(
                  "draft_pick"
              )

              if rookie_season not in (
                  historical_rookie_seasons
              ):
                  continue

              if draft_year != rookie_season:
                  continue

              if position not in valid_rookie_positions:
                  continue

              if (
                  draft_pick is None or
                  str(draft_pick).strip() == ""
              ):
                  continue

              try:
                  normalized_draft_pick = int(
                      float(draft_pick)
                  )
              except (TypeError, ValueError):
                  continue

              if normalized_draft_pick <= 0:
                  continue

              if normalized_draft_pick <= 32:
                  draft_capital_bucket = "round_1"
              elif normalized_draft_pick <= 64:
                  draft_capital_bucket = "round_2"
              elif normalized_draft_pick <= 100:
                  draft_capital_bucket = "round_3"
              elif normalized_draft_pick <= 150:
                  draft_capital_bucket = "round_4_5"
              else:
                  draft_capital_bucket = "late_round"

              historical_rookie_player_outcomes[
                  player_id
              ] = {
                  "player_id": player_id,
                  "player_name": (
                      player_metadata.get("display_name") or
                      player_metadata.get("full_name") or
                      player_metadata.get("football_name") or
                      player_metadata.get("short_name")
                  ),
                  "position": position,
                  "rookie_season": rookie_season,
                  "draft_pick": normalized_draft_pick,
                  "draft_capital_bucket":
                      draft_capital_bucket,
                  "weeks_with_stats": set(),
                  "first_four_weeks_ppr": 0.0
              }

          for row in historical_rows:
              player_id = row.get("player_id")

              rookie_outcome = (
                  historical_rookie_player_outcomes.get(
                      player_id
                  )
              )

              if not rookie_outcome:
                  continue

              row_season = str(
                  row.get("season") or ""
              ).strip()

              if (
                  row_season !=
                  rookie_outcome["rookie_season"]
              ):
                  continue

              try:
                  row_week = int(
                      float(row.get("week") or 0)
                  )
              except (TypeError, ValueError):
                  continue

              if row_week not in {1, 2, 3, 4}:
                  continue

              rookie_outcome[
                  "weeks_with_stats"
              ].add(
                  row_week
              )

              rookie_outcome[
                  "first_four_weeks_ppr"
              ] += calculate_ppr_points(
                  row
              )

          historical_rookie_bucket_outcomes = defaultdict(
              list
          )

          invalid_historical_rookie_outcomes = []

          for rookie_outcome in (
              historical_rookie_player_outcomes.values()
          ):
              weeks_with_stats = rookie_outcome[
                  "weeks_with_stats"
              ]

              if not weeks_with_stats.issubset(
                  {1, 2, 3, 4}
              ):
                  invalid_historical_rookie_outcomes.append({
                      "player_id":
                          rookie_outcome["player_id"],
                      "reason":
                          "invalid_early_season_week",
                      "weeks":
                          sorted(weeks_with_stats)
                  })

              if (
                  rookie_outcome["rookie_season"] ==
                  "2026"
              ):
                  invalid_historical_rookie_outcomes.append({
                      "player_id":
                          rookie_outcome["player_id"],
                      "reason":
                          "2026_leakage"
                  })

              rookie_outcome[
                  "first_four_weeks_ppr"
              ] = round(
                  rookie_outcome[
                      "first_four_weeks_ppr"
                  ],
                  2
              )

              rookie_outcome[
                  "average_weekly_ppr_weeks_1_4"
              ] = round(
                  rookie_outcome[
                      "first_four_weeks_ppr"
                  ] / 4.0,
                  2
              )

              rookie_outcome[
                  "weeks_with_stats"
              ] = sorted(
                  weeks_with_stats
              )

              bucket_key = (
                  rookie_outcome["position"],
                  rookie_outcome[
                      "draft_capital_bucket"
                  ]
              )

              historical_rookie_bucket_outcomes[
                  bucket_key
              ].append(
                  rookie_outcome
              )

          if invalid_historical_rookie_outcomes:
              raise RuntimeError(
                  "Historical rookie Weeks 1-4 "
                  "validation failed: "
                  f"{invalid_historical_rookie_outcomes[:10]}"
              )

          historical_rookie_bucket_player_count = sum(
              len(rookie_outcomes)
              for rookie_outcomes in (
                  historical_rookie_bucket_outcomes.values()
              )
          )

          if (
              historical_rookie_bucket_player_count !=
              len(historical_rookie_player_outcomes)
          ):
              raise RuntimeError(
                  "Historical rookie bucket count "
                  "validation failed: "
                  f"{historical_rookie_bucket_player_count} "
                  "bucketed vs "
                  f"{len(historical_rookie_player_outcomes)} "
                  "seeded."
              )

          print(
              "Historical drafted rookie Weeks 1-4 "
              "sample: "
              f"{len(historical_rookie_player_outcomes)} "
              "players."
          )

          print(
              "Historical rookie Weeks 1-4 "
              "draft-capital samples by position:"
          )

          for (
              position,
              draft_capital_bucket
          ), rookie_outcomes in sorted(
              historical_rookie_bucket_outcomes.items()
          ):
              players_with_stats = sum(
                  1
                  for rookie in rookie_outcomes
                  if rookie["weeks_with_stats"]
              )

              average_weekly_ppr = sum(
                  rookie[
                      "average_weekly_ppr_weeks_1_4"
                  ]
                  for rookie in rookie_outcomes
              ) / len(rookie_outcomes)

              average_total_ppr = sum(
                  rookie["first_four_weeks_ppr"]
                  for rookie in rookie_outcomes
              ) / len(rookie_outcomes)

              print(
                  f"{position} "
                  f"{draft_capital_bucket}: "
                  f"n={len(rookie_outcomes)}, "
                  f"with_stats={players_with_stats}, "
                  f"avg_weeks_1_4_ppr="
                  f"{average_weekly_ppr:.2f}, "
                  f"avg_total_weeks_1_4_ppr="
                  f"{average_total_ppr:.2f}."
              )

          print(
              "Validated historical rookie Weeks 1-4 "
              f"sample for "
              f"{len(historical_rookie_player_outcomes)} "
              "drafted rookies."
          )
          # -------------------------------------------------
          # ROOKIE DRAFT-CAPITAL PRIOR CALIBRATION
          # Position-normalized and sample-size shrunk.
          # Diagnostic only. Does not affect model scoring.
          # -------------------------------------------------

          rookie_draft_capital_prior_lookup = {}

          rookie_prior_shrinkage_constant = 10.0

          for position in sorted(
              valid_rookie_positions
          ):
              position_bucket_averages = {}

              for (
                  bucket_position,
                  draft_capital_bucket
              ), rookie_outcomes in (
                  historical_rookie_bucket_outcomes.items()
              ):
                  if bucket_position != position:
                      continue

                  average_weekly_ppr = sum(
                      rookie[
                          "average_weekly_ppr_weeks_1_4"
                      ]
                      for rookie in rookie_outcomes
                  ) / len(rookie_outcomes)

                  position_bucket_averages[
                      draft_capital_bucket
                  ] = average_weekly_ppr

              if not position_bucket_averages:
                  continue

              position_minimum_ppr = min(
                  position_bucket_averages.values()
              )

              position_maximum_ppr = max(
                  position_bucket_averages.values()
              )

              for draft_capital_bucket, average_ppr in (
                  position_bucket_averages.items()
              ):
                  rookie_outcomes = (
                      historical_rookie_bucket_outcomes[
                          (
                              position,
                              draft_capital_bucket
                          )
                      ]
                  )

                  sample_size = len(
                      rookie_outcomes
                  )

                  if (
                      position_maximum_ppr >
                      position_minimum_ppr
                  ):
                      raw_prior_score = (
                          25.0 +
                          (
                              (
                                  average_ppr -
                                  position_minimum_ppr
                              ) /
                              (
                                  position_maximum_ppr -
                                  position_minimum_ppr
                              )
                          ) * 75.0
                      )
                  else:
                      raw_prior_score = 50.0

                  sample_reliability = (
                      sample_size /
                      (
                          sample_size +
                          rookie_prior_shrinkage_constant
                      )
                  )

                  shrunk_prior_score = (
                      50.0 +
                      (
                          raw_prior_score - 50.0
                      ) * sample_reliability
                  )

                  lookup_key = (
                      position,
                      draft_capital_bucket
                  )

                  rookie_draft_capital_prior_lookup[
                      lookup_key
                  ] = {
                      "position": position,
                      "draft_capital_bucket":
                          draft_capital_bucket,
                      "sample_size": sample_size,
                      "average_weekly_ppr_weeks_1_4":
                          round(
                              average_ppr,
                              2
                          ),
                      "raw_prior_score": round(
                          raw_prior_score,
                          2
                      ),
                      "sample_reliability": round(
                          sample_reliability,
                          3
                      ),
                      "shrunk_prior_score": round(
                          shrunk_prior_score,
                          2
                      )
                  }

          invalid_rookie_prior_calibrations = []

          for (
              position,
              draft_capital_bucket
          ), prior_data in (
              rookie_draft_capital_prior_lookup.items()
          ):
              raw_prior_score = prior_data[
                  "raw_prior_score"
              ]

              sample_reliability = prior_data[
                  "sample_reliability"
              ]

              shrunk_prior_score = prior_data[
                  "shrunk_prior_score"
              ]

              if not (
                  25.0 <= raw_prior_score <= 100.0
              ):
                  invalid_rookie_prior_calibrations.append({
                      "position": position,
                      "bucket": draft_capital_bucket,
                      "reason": "raw_score_out_of_range",
                      "value": raw_prior_score
                  })

              if not (
                  0.0 <= sample_reliability <= 1.0
              ):
                  invalid_rookie_prior_calibrations.append({
                      "position": position,
                      "bucket": draft_capital_bucket,
                      "reason":
                          "sample_reliability_out_of_range",
                      "value": sample_reliability
                  })

              if not (
                  25.0 <= shrunk_prior_score <= 100.0
              ):
                  invalid_rookie_prior_calibrations.append({
                      "position": position,
                      "bucket": draft_capital_bucket,
                      "reason":
                          "shrunk_score_out_of_range",
                      "value": shrunk_prior_score
                  })

          if invalid_rookie_prior_calibrations:
              raise RuntimeError(
                  "Invalid rookie prior calibration: "
                  f"{invalid_rookie_prior_calibrations[:10]}"
              )

          print(
              "Historical rookie draft-capital prior "
              "calibration:"
          )

          for (
              position,
              draft_capital_bucket
          ), prior_data in sorted(
              rookie_draft_capital_prior_lookup.items()
          ):
              print(
                  f"{position} "
                  f"{draft_capital_bucket}: "
                  f"n={prior_data['sample_size']}, "
                  f"avg_ppr="
                  f"{prior_data['average_weekly_ppr_weeks_1_4']:.2f}, "
                  f"raw_prior="
                  f"{prior_data['raw_prior_score']:.2f}, "
                  f"reliability="
                  f"{prior_data['sample_reliability']:.3f}, "
                  f"shrunk_prior="
                  f"{prior_data['shrunk_prior_score']:.2f}."
              )

          print(
              "Validated rookie draft-capital prior "
              f"calibration for "
              f"{len(rookie_draft_capital_prior_lookup)} "
              "position/bucket combinations."
          )
          # -------------------------------------------------
          # ROOKIE PRIOR LEAVE-ONE-SEASON-OUT BACKTEST
          # Each rookie season is scored using priors built
          # only from the other historical rookie seasons.
          # Diagnostic only. Does not affect model scoring.
          # -------------------------------------------------

          rookie_prior_backtest_results = []

          for held_out_season in sorted(
              historical_rookie_seasons
          ):
              training_rookies = [
                  rookie
                  for rookie in (
                      historical_rookie_player_outcomes.values()
                  )
                  if (
                      rookie["rookie_season"] !=
                      held_out_season
                  )
              ]

              test_rookies = [
                  rookie
                  for rookie in (
                      historical_rookie_player_outcomes.values()
                  )
                  if (
                      rookie["rookie_season"] ==
                      held_out_season
                  )
              ]

              training_bucket_outcomes = defaultdict(
                  list
              )

              for rookie in training_rookies:
                  training_bucket_outcomes[
                      (
                          rookie["position"],
                          rookie[
                              "draft_capital_bucket"
                          ]
                      )
                  ].append(
                      rookie
                  )

              training_position_bucket_averages = (
                  defaultdict(dict)
              )

              for (
                  position,
                  draft_capital_bucket
              ), rookie_outcomes in (
                  training_bucket_outcomes.items()
              ):
                  average_weekly_ppr = sum(
                      rookie[
                          "average_weekly_ppr_weeks_1_4"
                      ]
                      for rookie in rookie_outcomes
                  ) / len(rookie_outcomes)

                  training_position_bucket_averages[
                      position
                  ][
                      draft_capital_bucket
                  ] = average_weekly_ppr

              held_out_prior_lookup = {}

              for position, bucket_averages in (
                  training_position_bucket_averages.items()
              ):
                  if not bucket_averages:
                      continue

                  position_minimum_ppr = min(
                      bucket_averages.values()
                  )

                  position_maximum_ppr = max(
                      bucket_averages.values()
                  )

                  for (
                      draft_capital_bucket,
                      average_ppr
                  ) in bucket_averages.items():
                      rookie_outcomes = (
                          training_bucket_outcomes[
                              (
                                  position,
                                  draft_capital_bucket
                              )
                          ]
                      )

                      sample_size = len(
                          rookie_outcomes
                      )

                      if (
                          position_maximum_ppr >
                          position_minimum_ppr
                      ):
                          raw_prior_score = (
                              25.0 +
                              (
                                  (
                                      average_ppr -
                                      position_minimum_ppr
                                  ) /
                                  (
                                      position_maximum_ppr -
                                      position_minimum_ppr
                                  )
                              ) * 75.0
                          )
                      else:
                          raw_prior_score = 50.0

                      sample_reliability = (
                          sample_size /
                          (
                              sample_size +
                              rookie_prior_shrinkage_constant
                          )
                      )

                      shrunk_prior_score = (
                          50.0 +
                          (
                              raw_prior_score - 50.0
                          ) * sample_reliability
                      )

                      held_out_prior_lookup[
                          (
                              position,
                              draft_capital_bucket
                          )
                      ] = {
                          "score": round(
                              shrunk_prior_score,
                              2
                          ),
                          "sample_size": sample_size
                      }

              for rookie in test_rookies:
                  lookup_key = (
                      rookie["position"],
                      rookie[
                          "draft_capital_bucket"
                      ]
                  )

                  prior_data = (
                      held_out_prior_lookup.get(
                          lookup_key
                      )
                  )

                  if not prior_data:
                      continue

                  rookie_prior_backtest_results.append({
                      "player_id":
                          rookie["player_id"],
                      "player_name":
                          rookie["player_name"],
                      "position":
                          rookie["position"],
                      "rookie_season":
                          rookie["rookie_season"],
                      "draft_capital_bucket":
                          rookie[
                              "draft_capital_bucket"
                          ],
                      "predicted_prior_score":
                          prior_data["score"],
                      "training_sample_size":
                          prior_data["sample_size"],
                      "actual_weekly_ppr_weeks_1_4":
                          rookie[
                              "average_weekly_ppr_weeks_1_4"
                          ]
                  })

          invalid_rookie_prior_backtests = []

          for result in rookie_prior_backtest_results:
              if result["rookie_season"] not in (
                  historical_rookie_seasons
              ):
                  invalid_rookie_prior_backtests.append({
                      "player_id":
                          result["player_id"],
                      "reason":
                          "invalid_held_out_season"
                  })

              if not (
                  25.0 <=
                  result["predicted_prior_score"] <=
                  100.0
              ):
                  invalid_rookie_prior_backtests.append({
                      "player_id":
                          result["player_id"],
                      "reason":
                          "prior_score_out_of_range"
                  })

              if result["training_sample_size"] <= 0:
                  invalid_rookie_prior_backtests.append({
                      "player_id":
                          result["player_id"],
                      "reason":
                          "invalid_training_sample_size"
                  })

          if invalid_rookie_prior_backtests:
              raise RuntimeError(
                  "Rookie prior backtest validation "
                  "failed: "
                  f"{invalid_rookie_prior_backtests[:10]}"
              )

          rookie_prior_backtest_by_position = defaultdict(
              list
          )

          for result in rookie_prior_backtest_results:
              rookie_prior_backtest_by_position[
                  result["position"]
              ].append(
                  result
              )

          print(
              "Rookie prior leave-one-season-out "
              "backtest:"
          )

          for position, position_results in sorted(
              rookie_prior_backtest_by_position.items()
          ):
              average_prior = sum(
                  result["predicted_prior_score"]
                  for result in position_results
              ) / len(position_results)

              average_actual_ppr = sum(
                  result[
                      "actual_weekly_ppr_weeks_1_4"
                  ]
                  for result in position_results
              ) / len(position_results)

              print(
                  f"{position}: "
                  f"n={len(position_results)}, "
                  f"avg_prior={average_prior:.2f}, "
                  f"avg_actual_ppr="
                  f"{average_actual_ppr:.2f}."
              )
          print(
              "Validated rookie prior "
              "leave-one-season-out backtest for "
              f"{len(rookie_prior_backtest_results)} "
              "historical rookies."
          )
          # -------------------------------------------------
          # ROOKIE PRIOR RANKING HELPER
          # Used for predictive-discrimination testing.
          # Diagnostic only. Does not affect model scoring.
          # -------------------------------------------------

          def calculate_average_ranks(values):
              sorted_indexes = sorted(
                  range(len(values)),
                  key=lambda index: values[index]
              )

              ranks = [0.0] * len(values)

              current_index = 0

              while current_index < len(
                  sorted_indexes
              ):
                  tie_end_index = current_index

                  current_value = values[
                      sorted_indexes[current_index]
                  ]

                  while (
                      tie_end_index + 1 <
                      len(sorted_indexes) and
                      values[
                          sorted_indexes[
                              tie_end_index + 1
                          ]
                      ] == current_value
                  ):
                      tie_end_index += 1

                  average_rank = (
                      current_index +
                      tie_end_index +
                      2
                  ) / 2.0

                  for rank_index in range(
                      current_index,
                      tie_end_index + 1
                  ):
                      ranks[
                          sorted_indexes[rank_index]
                      ] = average_rank

                  current_index = tie_end_index + 1

              return ranks
          def calculate_spearman_rank_correlation(
              paired_values
          ):
              if len(paired_values) < 2:
                  return None

              predicted_values = [
                  pair[0]
                  for pair in paired_values
              ]

              actual_values = [
                  pair[1]
                  for pair in paired_values
              ]

              predicted_ranks = calculate_average_ranks(
                  predicted_values
              )

              actual_ranks = calculate_average_ranks(
                  actual_values
              )

              predicted_average = (
                  sum(predicted_ranks) /
                  len(predicted_ranks)
              )

              actual_average = (
                  sum(actual_ranks) /
                  len(actual_ranks)
              )

              numerator = sum(
                  (
                      predicted_rank -
                      predicted_average
                  ) * (
                      actual_rank -
                      actual_average
                  )
                  for predicted_rank, actual_rank in zip(
                      predicted_ranks,
                      actual_ranks
                  )
              )

              predicted_variance = sum(
                  (
                      predicted_rank -
                      predicted_average
                  ) ** 2
                  for predicted_rank in predicted_ranks
              )

              actual_variance = sum(
                  (
                      actual_rank -
                      actual_average
                  ) ** 2
                  for actual_rank in actual_ranks
              )

              denominator = (
                  predicted_variance *
                  actual_variance
              ) ** 0.5

              if denominator == 0:
                  return None

              return numerator / denominator 
          rookie_prior_overall_pairs = [
              (
                  result["predicted_prior_score"],
                  result[
                      "actual_weekly_ppr_weeks_1_4"
                  ]
              )
              for result in rookie_prior_backtest_results
          ]

          rookie_prior_overall_spearman = (
              calculate_spearman_rank_correlation(
                  rookie_prior_overall_pairs
              )
          )

          rookie_prior_spearman_by_position = {}

          for position, position_results in sorted(
              rookie_prior_backtest_by_position.items()
          ):
              position_pairs = [
                  (
                      result["predicted_prior_score"],
                      result[
                          "actual_weekly_ppr_weeks_1_4"
                      ]
                  )
                  for result in position_results
              ]

              position_spearman = (
                  calculate_spearman_rank_correlation(
                      position_pairs
                  )
              )

              rookie_prior_spearman_by_position[
                  position
              ] = position_spearman

          print(
              "Rookie prior predictive-discrimination "
              "Spearman correlations:"
          )

          if rookie_prior_overall_spearman is None:
              print(
                  "Overall: unavailable."
              )
          else:
              print(
                  "Overall: "
                  f"n={len(rookie_prior_overall_pairs)}, "
                  f"rho="
                  f"{rookie_prior_overall_spearman:.3f}."
              )

          for position, position_results in sorted(
              rookie_prior_backtest_by_position.items()
          ):
              position_spearman = (
                  rookie_prior_spearman_by_position[
                      position
                  ]
              )

              if position_spearman is None:
                  print(
                      f"{position}: "
                      f"n={len(position_results)}, "
                      "rho=unavailable."
                  )
              else:
                  print(
                      f"{position}: "
                      f"n={len(position_results)}, "
                      f"rho={position_spearman:.3f}."
                  )

          # -------------------------------------------------
          # ROOKIE PRIOR WEEK-BY-WEEK EVIDENCE TEST
          # Build leakage-safe rookie game histories.
          # Diagnostic only. Does not affect model scoring.
          # -------------------------------------------------

          historical_rookie_weekly_rows = defaultdict(
              list
          )

          for row in historical_rows:
              player_id = row.get("player_id")

              rookie_outcome = (
                  historical_rookie_player_outcomes.get(
                      player_id
                  )
              )

              if not rookie_outcome:
                  continue

              row_season = str(
                  row.get("season") or ""
              ).strip()

              if (
                  row_season !=
                  rookie_outcome["rookie_season"]
              ):
                  continue

              try:
                  row_week = int(
                      float(row.get("week") or 0)
                  )
              except (TypeError, ValueError):
                  continue

              if row_week <= 0:
                  continue

              historical_rookie_weekly_rows[
                  player_id
              ].append({
                  "week": row_week,
                  "ppr_points": round(
                      calculate_ppr_points(row),
                      2
                  )
              })

          for player_id, weekly_rows in (
              historical_rookie_weekly_rows.items()
          ):
              weekly_rows.sort(
                  key=lambda game: game["week"]
              )

          print(
              "Built week-by-week NFL evidence histories "
              f"for {len(historical_rookie_weekly_rows)} "
              "historical drafted rookies."
          )

          invalid_rookie_weekly_histories = []

          for player_id, weekly_rows in (
              historical_rookie_weekly_rows.items()
          ):
              rookie_outcome = (
                  historical_rookie_player_outcomes.get(
                      player_id
                  )
              )

              if not rookie_outcome:
                  invalid_rookie_weekly_histories.append({
                      "player_id": player_id,
                      "reason": "missing_rookie_outcome"
                  })
                  continue

              previous_week = 0

              for game in weekly_rows:
                  game_week = game.get("week")

                  if (
                      not isinstance(game_week, int) or
                      game_week <= 0
                  ):
                      invalid_rookie_weekly_histories.append({
                          "player_id": player_id,
                          "reason": "invalid_week",
                          "week": game_week
                      })
                      continue

                  if game_week <= previous_week:
                      invalid_rookie_weekly_histories.append({
                          "player_id": player_id,
                          "reason":
                              "non_increasing_or_duplicate_week",
                          "week": game_week,
                          "previous_week": previous_week
                      })

                  previous_week = game_week

          if invalid_rookie_weekly_histories:
              raise RuntimeError(
                  "Historical rookie weekly-history "
                  "validation failed: "
                  f"{invalid_rookie_weekly_histories[:10]}"
              )

          print(
              "Validated week-by-week NFL evidence histories "
              f"for {len(historical_rookie_weekly_rows)} "
              "historical drafted rookies with stats."
          )

          # -------------------------------------------------
          # ROOKIE CALENDAR-WEEK PPR LOOKUP
          # Preserve zero-stat weeks as zero fantasy points.
          # Diagnostic only. Does not affect model scoring.
          # -------------------------------------------------

          historical_rookie_calendar_week_ppr = {}

          for player_id, rookie_outcome in (
              historical_rookie_player_outcomes.items()
          ):
              weekly_ppr_lookup = {
                  game["week"]: game["ppr_points"]
                  for game in (
                      historical_rookie_weekly_rows.get(
                          player_id,
                          []
                      )
                  )
              }

              historical_rookie_calendar_week_ppr[
                  player_id
              ] = {
                  week: weekly_ppr_lookup.get(
                      week,
                      0.0
                  )
                  for week in (1, 2, 3, 4)
              }

          print(
              "Built calendar-week rookie PPR histories "
              f"for "
              f"{len(historical_rookie_calendar_week_ppr)} "
              "historical drafted rookies."
          )

          invalid_rookie_calendar_week_histories = []

          if (
              len(historical_rookie_calendar_week_ppr) !=
              len(historical_rookie_player_outcomes)
          ):
              raise RuntimeError(
                  "Calendar-week rookie history count "
                  "validation failed: "
                  f"{len(historical_rookie_calendar_week_ppr)} "
                  "calendar histories vs "
                  f"{len(historical_rookie_player_outcomes)} "
                  "historical rookies."
              )

          for player_id, calendar_week_ppr in (
              historical_rookie_calendar_week_ppr.items()
          ):
              if set(calendar_week_ppr.keys()) != {
                  1,
                  2,
                  3,
                  4
              }:
                  invalid_rookie_calendar_week_histories.append({
                      "player_id": player_id,
                      "reason": "invalid_calendar_weeks",
                      "weeks": sorted(
                          calendar_week_ppr.keys()
                      )
                  })
                  continue

              for week, ppr_points in (
                  calendar_week_ppr.items()
              ):
                  if not isinstance(
                      ppr_points,
                      (int, float)
                  ):
                      invalid_rookie_calendar_week_histories.append({
                          "player_id": player_id,
                          "reason": "non_numeric_ppr",
                          "week": week,
                          "value": ppr_points
                      })

          if invalid_rookie_calendar_week_histories:
              raise RuntimeError(
                  "Calendar-week rookie history validation "
                  "failed: "
                  f"{invalid_rookie_calendar_week_histories[:10]}"
              )

          print(
              "Validated calendar-week rookie PPR histories "
              f"for "
              f"{len(historical_rookie_calendar_week_ppr)} "
              "historical drafted rookies."
          )

          # -------------------------------------------------
          # ROOKIE CALENDAR-WEEK PREDICTION TEST
          # At the start of Weeks 2-4, compare the draft prior
          # with NFL production available before that week.
          # Zero-stat calendar weeks remain zero production.
          # Diagnostic only. Does not affect model scoring.
          # -------------------------------------------------

          rookie_calendar_week_prediction_results = defaultdict(
              list
          )

          for prediction_week in (2, 3, 4):
              evidence_weeks = list(
                  range(1, prediction_week)
              )

              for player_id, rookie_outcome in (
                  historical_rookie_player_outcomes.items()
              ):
                  prior_result = next(
                      (
                          result
                          for result in rookie_prior_backtest_results
                          if result["player_id"] == player_id
                      ),
                      None
                  )
                  if not prior_result:
                      continue

                  calendar_week_ppr = (
                      historical_rookie_calendar_week_ppr.get(
                          player_id
                      )
                  )

                  if not calendar_week_ppr:
                      continue

                  nfl_evidence_ppr = (
                      sum(
                          calendar_week_ppr[week]
                          for week in evidence_weeks
                      ) /
                      len(evidence_weeks)
                  )

                  actual_prediction_week_ppr = (
                      calendar_week_ppr[
                          prediction_week
                      ]
                  )

                  rookie_calendar_week_prediction_results[
                      prediction_week
                  ].append({
                      "player_id": player_id,
                      "position": rookie_outcome["position"],
                      "rookie_season":
                          rookie_outcome["rookie_season"],
                      "prediction_week": prediction_week,
                      "evidence_week_count":
                          len(evidence_weeks),
                      "predicted_prior_score":
                          prior_result[
                              "predicted_prior_score"
                          ],
                      "nfl_evidence_ppr": round(
                          nfl_evidence_ppr,
                          2
                      ),
                      "actual_prediction_week_ppr":
                          actual_prediction_week_ppr
                  })

          expected_calendar_prediction_sample_size = len(
              rookie_prior_backtest_results
          )

          for prediction_week in (2, 3, 4):
              week_results = (
                  rookie_calendar_week_prediction_results[
                      prediction_week
                  ]
              )

              if (
                  len(week_results) !=
                  expected_calendar_prediction_sample_size
              ):
                  raise RuntimeError(
                      "Rookie calendar-week prediction sample "
                      "validation failed for Week "
                      f"{prediction_week}: "
                      f"{len(week_results)} results vs "
                      f"{expected_calendar_prediction_sample_size} "
                      "expected."
                  )

          print(
              "Rookie calendar-week prediction signal "
              "comparison:"
          )

          for prediction_week in (2, 3, 4):
              week_results = (
                  rookie_calendar_week_prediction_results[
                      prediction_week
                  ]
              )

              prior_pairs = [
                  (
                      result["predicted_prior_score"],
                      result[
                          "actual_prediction_week_ppr"
                      ]
                  )
                  for result in week_results
              ]

              nfl_evidence_pairs = [
                  (
                      result["nfl_evidence_ppr"],
                      result[
                          "actual_prediction_week_ppr"
                      ]
                  )
                  for result in week_results
              ]

              prior_spearman = (
                  calculate_spearman_rank_correlation(
                      prior_pairs
                  )
              )

              nfl_evidence_spearman = (
                  calculate_spearman_rank_correlation(
                      nfl_evidence_pairs
                  )
              )

              prior_rho_text = (
                  f"{prior_spearman:.3f}"
                  if prior_spearman is not None
                  else "unavailable"
              )

              nfl_rho_text = (
                  f"{nfl_evidence_spearman:.3f}"
                  if nfl_evidence_spearman is not None
                  else "unavailable"
              )

              print(
                  f"Week {prediction_week}: "
                  f"n={len(week_results)}, "
                  f"prior_rho={prior_rho_text}, "
                  f"nfl_evidence_rho={nfl_rho_text}."
              )

          # -------------------------------------------------
          # ROOKIE CALENDAR-WEEK BLEND TEST
          # Test draft prior + NFL evidence on the corrected
          # 321-player calendar-week sample.
          # Diagnostic only. Does not affect model scoring.
          # -------------------------------------------------

          rookie_calendar_week_blend_weights = [
              (1.00, 0.00),
              (0.75, 0.25),
              (0.50, 0.50),
              (0.25, 0.75),
              (0.00, 1.00)
          ]

          print(
              "Rookie calendar-week prior + NFL evidence "
              "blend test:"
          )

          for prediction_week in (2, 3, 4):
              week_results = (
                  rookie_calendar_week_prediction_results[
                      prediction_week
                  ]
              )

              print(
                  f"Week {prediction_week}: "
                  f"n={len(week_results)}"
              )

              for (
                  prior_weight,
                  nfl_evidence_weight
              ) in rookie_calendar_week_blend_weights:
                  blend_pairs = [
                      (
                          (
                              result[
                                  "predicted_prior_score"
                              ] * prior_weight
                          ) +
                          (
                              result[
                                  "nfl_evidence_ppr"
                              ] * nfl_evidence_weight
                          ),
                          result[
                              "actual_prediction_week_ppr"
                          ]
                      )
                      for result in week_results
                  ]

                  blend_spearman = (
                      calculate_spearman_rank_correlation(
                          blend_pairs
                      )
                  )

                  blend_rho_text = (
                      f"{blend_spearman:.3f}"
                      if blend_spearman is not None
                      else "unavailable"
                  )

                  print(
                      f"  prior={prior_weight:.2f}, "
                      f"nfl={nfl_evidence_weight:.2f}, "
                      f"rho={blend_rho_text}"
                  )
          # -------------------------------------------------
          # ROOKIE CALENDAR-WEEK SCALE-ALIGNED BLEND TEST
          # Convert draft prior and NFL evidence to comparable
          # within-week percentile-rank scales before blending.
          # Diagnostic only. Does not affect model scoring.
          # -------------------------------------------------

          print(
              "Rookie calendar-week scale-aligned prior + "
              "NFL evidence blend test:"
          )

          for prediction_week in (2, 3, 4):
              week_results = (
                  rookie_calendar_week_prediction_results[
                      prediction_week
                  ]
              )

              prior_values = [
                  result["predicted_prior_score"]
                  for result in week_results
              ]

              nfl_evidence_values = [
                  result["nfl_evidence_ppr"]
                  for result in week_results
              ]

              prior_ranks = calculate_average_ranks(
                  prior_values
              )

              nfl_evidence_ranks = calculate_average_ranks(
                  nfl_evidence_values
              )

              sample_size = len(week_results)

              if sample_size <= 1:
                  raise RuntimeError(
                      "Scale-aligned rookie blend test "
                      f"requires at least 2 players for "
                      f"Week {prediction_week}."
                  )

              prior_percentile_scores = [
                  (
                      (rank - 1.0) /
                      (sample_size - 1.0)
                  ) * 100.0
                  for rank in prior_ranks
              ]

              nfl_percentile_scores = [
                  (
                      (rank - 1.0) /
                      (sample_size - 1.0)
                  ) * 100.0
                  for rank in nfl_evidence_ranks
              ]

              print(
                  f"Week {prediction_week}: "
                  f"n={sample_size}"
              )

              for (
                  prior_weight,
                  nfl_evidence_weight
              ) in rookie_calendar_week_blend_weights:
                  blend_pairs = [
                      (
                          (
                              prior_percentile_scores[
                                  result_index
                              ] * prior_weight
                          ) +
                          (
                              nfl_percentile_scores[
                                  result_index
                              ] * nfl_evidence_weight
                          ),
                          result[
                              "actual_prediction_week_ppr"
                          ]
                      )
                      for result_index, result in enumerate(
                          week_results
                      )
                  ]

                  blend_spearman = (
                      calculate_spearman_rank_correlation(
                          blend_pairs
                      )
                  )

                  blend_rho_text = (
                      f"{blend_spearman:.3f}"
                      if blend_spearman is not None
                      else "unavailable"
                  )

                  print(
                      f"  prior={prior_weight:.2f}, "
                      f"nfl={nfl_evidence_weight:.2f}, "
                      f"rho={blend_rho_text}"
                  )

          # -------------------------------------------------
          # ROOKIE CALENDAR-WEEK NESTED LOYO VALIDATION
          # Select the scale-aligned blend using only the other
          # rookie seasons, then evaluate the held-out season.
          # Diagnostic only. Does not affect model scoring.
          # -------------------------------------------------

          print(
              "Rookie calendar-week nested leave-one-season-out "
              "blend validation:"
          )

          for prediction_week in (2, 3, 4):
              week_results = (
                  rookie_calendar_week_prediction_results[
                      prediction_week
                  ]
              )

              print(
                  f"Week {prediction_week}:"
              )

              nested_week_results = []

              for held_out_season in sorted(
                  historical_rookie_seasons
              ):
                  training_results = [
                      result
                      for result in week_results
                      if result["rookie_season"] !=
                      held_out_season
                  ]

                  test_results = [
                      result
                      for result in week_results
                      if result["rookie_season"] ==
                      held_out_season
                  ]

                  if (
                      len(training_results) <= 1 or
                      len(test_results) <= 1
                  ):
                      raise RuntimeError(
                          "Nested calendar-week rookie validation "
                          f"has insufficient sample for Week "
                          f"{prediction_week}, season "
                          f"{held_out_season}."
                      )

                  training_prior_values = [
                      result["predicted_prior_score"]
                      for result in training_results
                  ]

                  training_nfl_values = [
                      result["nfl_evidence_ppr"]
                      for result in training_results
                  ]

                  training_prior_ranks = (
                      calculate_average_ranks(
                          training_prior_values
                      )
                  )

                  training_nfl_ranks = (
                      calculate_average_ranks(
                          training_nfl_values
                      )
                  )

                  training_sample_size = len(
                      training_results
                  )

                  training_prior_percentiles = [
                      (
                          (rank - 1.0) /
                          (training_sample_size - 1.0)
                      ) * 100.0
                      for rank in training_prior_ranks
                  ]

                  training_nfl_percentiles = [
                      (
                          (rank - 1.0) /
                          (training_sample_size - 1.0)
                      ) * 100.0
                      for rank in training_nfl_ranks
                  ]

                  best_training_rho = None
                  selected_prior_weight = None
                  selected_nfl_weight = None

                  for (
                      prior_weight,
                      nfl_evidence_weight
                  ) in rookie_calendar_week_blend_weights:
                      training_blend_pairs = [
                          (
                              (
                                  training_prior_percentiles[
                                      result_index
                                  ] * prior_weight
                              ) +
                              (
                                  training_nfl_percentiles[
                                      result_index
                                  ] * nfl_evidence_weight
                              ),
                              result[
                                  "actual_prediction_week_ppr"
                              ]
                          )
                          for result_index, result in enumerate(
                              training_results
                          )
                      ]

                      training_rho = (
                          calculate_spearman_rank_correlation(
                              training_blend_pairs
                          )
                      )

                      if training_rho is None:
                          continue

                      if (
                          best_training_rho is None or
                          training_rho > best_training_rho
                      ):
                          best_training_rho = training_rho
                          selected_prior_weight = prior_weight
                          selected_nfl_weight = (
                              nfl_evidence_weight
                          )

                  if selected_prior_weight is None:
                      raise RuntimeError(
                          "Nested calendar-week rookie validation "
                          "could not select a blend for Week "
                          f"{prediction_week}, season "
                          f"{held_out_season}."
                      )

                  combined_results = (
                      training_results + test_results
                  )

                  combined_prior_values = [
                      result["predicted_prior_score"]
                      for result in combined_results
                  ]

                  combined_nfl_values = [
                      result["nfl_evidence_ppr"]
                      for result in combined_results
                  ]

                  combined_prior_ranks = (
                      calculate_average_ranks(
                          combined_prior_values
                      )
                  )

                  combined_nfl_ranks = (
                      calculate_average_ranks(
                          combined_nfl_values
                      )
                  )

                  combined_sample_size = len(
                      combined_results
                  )

                  combined_prior_percentiles = [
                      (
                          (rank - 1.0) /
                          (combined_sample_size - 1.0)
                      ) * 100.0
                      for rank in combined_prior_ranks
                  ]

                  combined_nfl_percentiles = [
                      (
                          (rank - 1.0) /
                          (combined_sample_size - 1.0)
                      ) * 100.0
                      for rank in combined_nfl_ranks
                  ]

                  test_start_index = len(
                      training_results
                  )

                  test_blend_pairs = []

                  for test_offset, result in enumerate(
                      test_results
                  ):
                      combined_index = (
                          test_start_index + test_offset
                      )

                      test_blend_score = (
                          combined_prior_percentiles[
                              combined_index
                          ] * selected_prior_weight +
                          combined_nfl_percentiles[
                              combined_index
                          ] * selected_nfl_weight
                      )

                      test_blend_pairs.append(
                          (
                              test_blend_score,
                              result[
                                  "actual_prediction_week_ppr"
                              ]
                          )
                      )

                  held_out_rho = (
                      calculate_spearman_rank_correlation(
                          test_blend_pairs
                      )
                  )

                  nested_week_results.append({
                      "season": held_out_season,
                      "sample_size": len(test_results),
                      "rho": held_out_rho,
                      "prior_weight":
                          selected_prior_weight,
                      "nfl_weight":
                          selected_nfl_weight
                  })

                  held_out_rho_text = (
                      f"{held_out_rho:.3f}"
                      if held_out_rho is not None
                      else "unavailable"
                  )

                  print(
                      f"  held_out={held_out_season}: "
                      f"n={len(test_results)}, "
                      f"rho={held_out_rho_text}, "
                      f"selected_prior_weight="
                      f"{selected_prior_weight:.2f}, "
                      f"selected_nfl_weight="
                      f"{selected_nfl_weight:.2f}"
                  )

              valid_nested_results = [
                  result
                  for result in nested_week_results
                  if result["rho"] is not None
              ]

              total_nested_sample = sum(
                  result["sample_size"]
                  for result in valid_nested_results
              )

              weighted_nested_rho = (
                  sum(
                      result["rho"] * result["sample_size"]
                      for result in valid_nested_results
                  ) /
                  total_nested_sample
                  if total_nested_sample > 0
                  else None
              )

              weighted_rho_text = (
                  f"{weighted_nested_rho:.3f}"
                  if weighted_nested_rho is not None
                  else "unavailable"
              )
              selected_weight_counts = defaultdict(int)

              for result in nested_week_results:
                  selected_weight_counts[
                      (
                          result["prior_weight"],
                          result["nfl_weight"]
                      )
                  ] += 1

              selected_weight_text = ", ".join(
                  (
                      f"{prior_weight:.2f}/"
                      f"{nfl_weight:.2f}:"
                      f"{count}"
                  )
                  for (
                      prior_weight,
                      nfl_weight
                  ), count in sorted(
                      selected_weight_counts.items()
                  )
              )

              print(
                  f"  nested summary: "
                  f"n={total_nested_sample}, "
                  f"weighted_fold_rho={weighted_rho_text}, "
                  f"selected_prior/nfl_weights="
                  f"{selected_weight_text}"
              )
 
          # -------------------------------------------------
          # ROOKIE PRIOR EVIDENCE-CUTOFF BACKTEST
          # Test prior value after 0, 1, 2, and 3 NFL games.
          # Diagnostic only. Does not affect model scoring.
          # -------------------------------------------------
          rookie_prior_evidence_backtest_results = defaultdict(
              list
          )

          rookie_prior_backtest_by_player_id = {
              result["player_id"]: result
              for result in rookie_prior_backtest_results
          }

          for player_id, rookie_outcome in (
              historical_rookie_player_outcomes.items()
          ):
              prior_result = (
                  rookie_prior_backtest_by_player_id.get(
                      player_id
                  )
              )

              if not prior_result:
                  continue

              rookie_prior_evidence_backtest_results[
                  0
              ].append({
                  "player_id": player_id,
                  "position": rookie_outcome["position"],
                  "predicted_prior_score":
                      prior_result["predicted_prior_score"],
                  "future_ppr":
                      rookie_outcome[
                          "average_weekly_ppr_weeks_1_4"
                      ]
              })
          zero_game_results = (
              rookie_prior_evidence_backtest_results[0]
          )

          if len(zero_game_results) != len(
              rookie_prior_backtest_results
          ):
              raise RuntimeError(
                  "Rookie prior 0-game sample validation "
                  "failed: "
                  f"{len(zero_game_results)} evidence results "
                  "vs "
                  f"{len(rookie_prior_backtest_results)} "
                  "leave-one-season-out results."
              )

          # Build leakage-safe future-performance samples
          # after 1, 2, and 3 recorded statistical games.
          for evidence_game_count in (1, 2, 3):
              for player_id, weekly_rows in (
                  historical_rookie_weekly_rows.items()
              ):
                  prior_result = (
                      rookie_prior_backtest_by_player_id.get(
                          player_id
                      )
                  )

                  if not prior_result:
                      continue

                  if len(weekly_rows) <= evidence_game_count:
                      continue

                  evidence_rows = weekly_rows[
                      :evidence_game_count
                  ]

                  future_rows = weekly_rows[
                      evidence_game_count:
                  ]

                  if not evidence_rows or not future_rows:
                      continue

                  evidence_cutoff_week = evidence_rows[
                      -1
                  ]["week"]

                  if any(
                      future_row["week"] <=
                      evidence_cutoff_week
                      for future_row in future_rows
                  ):
                      raise RuntimeError(
                          "Rookie evidence-cutoff leakage "
                          "validation failed for "
                          f"{player_id} at "
                          f"{evidence_game_count} games."
                      )

                  future_average_ppr = (
                      sum(
                          future_row["ppr_points"]
                          for future_row in future_rows
                      ) /
                      len(future_rows)
                  )

                  rookie_prior_evidence_backtest_results[
                      evidence_game_count
                  ].append({
                      "player_id": player_id,
                      "position":
                          prior_result["position"],
                      "rookie_season":
                          prior_result["rookie_season"],
                      "predicted_prior_score":
                          prior_result[
                              "predicted_prior_score"
                          ],
                      "evidence_game_count":
                          evidence_game_count,
                      "evidence_cutoff_week":
                          evidence_cutoff_week,
                      "future_game_count":
                          len(future_rows),
                      "future_ppr":
                          round(
                              future_average_ppr,
                              2
                          )
                  })

          rookie_prior_evidence_spearman = {}

          print(
              "Rookie prior value by recorded "
              "statistical-game evidence cutoff:"
          )

          for evidence_game_count in (0, 1, 2, 3):
              cutoff_results = (
                  rookie_prior_evidence_backtest_results[
                      evidence_game_count
                  ]
              )

              cutoff_pairs = [
                  (
                      result["predicted_prior_score"],
                      result["future_ppr"]
                  )
                  for result in cutoff_results
              ]

              cutoff_spearman = (
                  calculate_spearman_rank_correlation(
                      cutoff_pairs
                  )
              )

              rookie_prior_evidence_spearman[
                  evidence_game_count
              ] = cutoff_spearman

              if cutoff_spearman is None:
                  print(
                      f"{evidence_game_count} games: "
                      f"n={len(cutoff_results)}, "
                      "rho=unavailable."
                  )
              else:
                  print(
                      f"{evidence_game_count} games: "
                      f"n={len(cutoff_results)}, "
                      f"rho={cutoff_spearman:.3f}."
                  )

          # -------------------------------------------------
          # ROOKIE NFL PRODUCTION VS DRAFT-CAPITAL PRIOR
          # Compare early NFL production and the rookie prior
          # against the exact same future-performance sample.
          # Diagnostic only. Does not affect model scoring.
          # -------------------------------------------------

          rookie_signal_comparison_results = defaultdict(
              list
          )

          for evidence_game_count in (1, 2, 3):
              for player_id, weekly_rows in (
                  historical_rookie_weekly_rows.items()
              ):
                  prior_result = (
                      rookie_prior_backtest_by_player_id.get(
                          player_id
                      )
                  )

                  if not prior_result:
                      continue

                  if len(weekly_rows) <= evidence_game_count:
                      continue

                  evidence_rows = weekly_rows[
                      :evidence_game_count
                  ]

                  future_rows = weekly_rows[
                      evidence_game_count:
                  ]

                  if not evidence_rows or not future_rows:
                      continue

                  evidence_cutoff_week = evidence_rows[
                      -1
                  ]["week"]

                  if any(
                      future_row["week"] <=
                      evidence_cutoff_week
                      for future_row in future_rows
                  ):
                      raise RuntimeError(
                          "Rookie signal-comparison leakage "
                          "validation failed for "
                          f"{player_id} at "
                          f"{evidence_game_count} games."
                      )

                  evidence_average_ppr = (
                      sum(
                          evidence_row["ppr_points"]
                          for evidence_row in evidence_rows
                      ) /
                      len(evidence_rows)
                  )

                  future_average_ppr = (
                      sum(
                          future_row["ppr_points"]
                          for future_row in future_rows
                      ) /
                      len(future_rows)
                  )

                  rookie_signal_comparison_results[
                      evidence_game_count
                  ].append({
                      "player_id": player_id,
                      "position":
                          prior_result["position"],
                      "predicted_prior_score":
                          prior_result[
                              "predicted_prior_score"
                          ],
                      "evidence_average_ppr":
                          round(
                              evidence_average_ppr,
                              2
                          ),
                      "future_average_ppr":
                          round(
                              future_average_ppr,
                              2
                          ),
                      "evidence_game_count":
                          evidence_game_count,
                      "future_game_count":
                          len(future_rows)
                  })

          print(
              "Rookie signal comparison against identical "
              "future-performance samples:"
          )

          for evidence_game_count in (1, 2, 3):
              comparison_results = (
                  rookie_signal_comparison_results[
                      evidence_game_count
                  ]
              )

              prior_pairs = [
                  (
                      result["predicted_prior_score"],
                      result["future_average_ppr"]
                  )
                  for result in comparison_results
              ]

              nfl_production_pairs = [
                  (
                      result["evidence_average_ppr"],
                      result["future_average_ppr"]
                  )
                  for result in comparison_results
              ]

              prior_spearman = (
                  calculate_spearman_rank_correlation(
                      prior_pairs
                  )
              )

              nfl_production_spearman = (
                  calculate_spearman_rank_correlation(
                      nfl_production_pairs
                  )
              )

              if (
                  prior_spearman is None or
                  nfl_production_spearman is None
              ):
                  print(
                      f"{evidence_game_count} games: "
                      f"n={len(comparison_results)}, "
                      "comparison unavailable."
                  )
              else:
                  print(
                      f"{evidence_game_count} games: "
                      f"n={len(comparison_results)}, "
                      f"prior_rho={prior_spearman:.3f}, "
                      f"nfl_production_rho="
                      f"{nfl_production_spearman:.3f}."
                  )
          # -------------------------------------------------
          # ROOKIE PRIOR + NFL PRODUCTION BLEND TEST
          # Test multiple blends against the exact same
          # future-performance sample at each evidence cutoff.
          # Diagnostic only. Does not affect model scoring.
          # -------------------------------------------------

          rookie_blend_weights = (
              0.00,
              0.25,
              0.50,
              0.75,
              1.00
          )
          rookie_production_nfl_weights = {
              1: {
                  "QB": 0.50,
                  "RB": 0.75,
                  "WR": 0.50,
                  "TE": 0.75
              },
              2: {
                  "QB": 0.50,
                  "RB": 0.75,
                  "WR": 0.75,
                  "TE": 0.75
              },
              3: {
                  "QB": 0.75,
                  "RB": 0.75,
                  "WR": 1.00,
                  "TE": 1.00
              }
          }
          print(
              "Rookie prior + NFL production blend test:"
          )

          for evidence_game_count in (1, 2, 3):
              comparison_results = (
                  rookie_signal_comparison_results[
                      evidence_game_count
                  ]
              )

              if not comparison_results:
                  print(
                      f"{evidence_game_count} games: "
                      "no comparison sample."
                  )
                  continue

              prior_values = [
                  result["predicted_prior_score"]
                  for result in comparison_results
              ]

              nfl_values = [
                  result["evidence_average_ppr"]
                  for result in comparison_results
              ]

              prior_ranks = calculate_average_ranks(
                  prior_values
              )

              nfl_ranks = calculate_average_ranks(
                  nfl_values
              )

              if (
                  len(prior_ranks) !=
                  len(comparison_results) or
                  len(nfl_ranks) !=
                  len(comparison_results)
              ):
                  raise RuntimeError(
                      "Rookie blend rank validation "
                      "failed at "
                      f"{evidence_game_count} games."
                  )

              for nfl_weight in rookie_blend_weights:
                  prior_weight = 1.0 - nfl_weight

                  blended_pairs = []

                  for result_index, result in enumerate(
                      comparison_results
                  ):
                      blended_rank_score = (
                          prior_ranks[result_index] *
                          prior_weight +
                          nfl_ranks[result_index] *
                          nfl_weight
                      )

                      blended_pairs.append(
                          (
                              blended_rank_score,
                              result[
                                  "future_average_ppr"
                              ]
                          )
                      )

                  blend_spearman = (
                      calculate_spearman_rank_correlation(
                          blended_pairs
                      )
                  )

                  if blend_spearman is None:
                      print(
                          f"{evidence_game_count} games: "
                          f"prior_weight="
                          f"{prior_weight:.2f}, "
                          f"nfl_weight={nfl_weight:.2f}, "
                          "rho=unavailable."
                      )
                  else:
                      print(
                          f"{evidence_game_count} games: "
                          f"prior_weight="
                          f"{prior_weight:.2f}, "
                          f"nfl_weight={nfl_weight:.2f}, "
                          f"rho={blend_spearman:.3f}."
                      )

          # -------------------------------------------------
          # ROOKIE POSITION-SPECIFIC BLEND TEST
          # Compare prior + NFL production separately within
          # QB, RB, WR, and TE at each evidence cutoff.
          # Diagnostic only. Does not affect model scoring.
          # -------------------------------------------------

          print(
              "Rookie position-specific prior + NFL "
              "production blend test:"
          )

          for evidence_game_count in (1, 2, 3):
              comparison_results = (
                  rookie_signal_comparison_results[
                      evidence_game_count
                  ]
              )

              for position in ("QB", "RB", "WR", "TE"):
                  position_results = [
                      result
                      for result in comparison_results
                      if result["position"] == position
                  ]

                  if len(position_results) < 2:
                      print(
                          f"{evidence_game_count} games "
                          f"{position}: "
                          f"n={len(position_results)}, "
                          "insufficient sample."
                      )
                      continue

                  position_prior_values = [
                      result["predicted_prior_score"]
                      for result in position_results
                  ]

                  position_nfl_values = [
                      result["evidence_average_ppr"]
                      for result in position_results
                  ]

                  position_prior_ranks = (
                      calculate_average_ranks(
                          position_prior_values
                      )
                  )

                  position_nfl_ranks = (
                      calculate_average_ranks(
                          position_nfl_values
                      )
                  )

                  position_prior_pairs = [
                      (
                          result["predicted_prior_score"],
                          result["future_average_ppr"]
                      )
                      for result in position_results
                  ]

                  position_nfl_pairs = [
                      (
                          result["evidence_average_ppr"],
                          result["future_average_ppr"]
                      )
                      for result in position_results
                  ]

                  position_prior_spearman = (
                      calculate_spearman_rank_correlation(
                          position_prior_pairs
                      )
                  )

                  position_nfl_spearman = (
                      calculate_spearman_rank_correlation(
                          position_nfl_pairs
                      )
                  )

                  print(
                      f"{evidence_game_count} games "
                      f"{position}: "
                      f"n={len(position_results)}, "
                      f"prior_rho="
                      f"{position_prior_spearman:.3f}, "
                      f"nfl_rho="
                      f"{position_nfl_spearman:.3f}."
                  )

                  for nfl_weight in rookie_blend_weights:
                      prior_weight = 1.0 - nfl_weight

                      position_blended_pairs = []

                      for result_index, result in enumerate(
                          position_results
                      ):
                          blended_rank_score = (
                              position_prior_ranks[
                                  result_index
                              ] * prior_weight +
                              position_nfl_ranks[
                                  result_index
                              ] * nfl_weight
                          )

                          position_blended_pairs.append(
                              (
                                  blended_rank_score,
                                  result[
                                      "future_average_ppr"
                                  ]
                              )
                          )

                      position_blend_spearman = (
                          calculate_spearman_rank_correlation(
                              position_blended_pairs
                          )
                      )

                      if position_blend_spearman is None:
                          print(
                              f"  prior_weight="
                              f"{prior_weight:.2f}, "
                              f"nfl_weight="
                              f"{nfl_weight:.2f}, "
                              "rho=unavailable."
                          )
                      else:
                          print(
                              f"  prior_weight="
                              f"{prior_weight:.2f}, "
                              f"nfl_weight="
                              f"{nfl_weight:.2f}, "
                              f"rho="
                              f"{position_blend_spearman:.3f}."
                          )

          # -------------------------------------------------
          # ROOKIE POSITION-SPECIFIC NESTED
          # LEAVE-ONE-SEASON-OUT BLEND VALIDATION
          #
          # The outer held-out season is excluded from:
          # 1. rookie-prior calibration,
          # 2. blend-weight selection, and
          # 3. all inner training predictions.
          #
          # Diagnostic only. Does not affect model scoring.
          # -------------------------------------------------

          def build_nested_rookie_prior_lookup(
              excluded_seasons
          ):
              nested_bucket_outcomes = defaultdict(list)

              for rookie in (
                  historical_rookie_player_outcomes.values()
              ):
                  if rookie["rookie_season"] in excluded_seasons:
                      continue

                  nested_bucket_outcomes[
                      (
                          rookie["position"],
                          rookie["draft_capital_bucket"]
                      )
                  ].append(rookie)

              nested_position_bucket_averages = defaultdict(
                  dict
              )

              for (
                  position,
                  draft_capital_bucket
              ), rookie_outcomes in (
                  nested_bucket_outcomes.items()
              ):
                  average_weekly_ppr = sum(
                      rookie[
                          "average_weekly_ppr_weeks_1_4"
                      ]
                      for rookie in rookie_outcomes
                  ) / len(rookie_outcomes)

                  nested_position_bucket_averages[
                      position
                  ][
                      draft_capital_bucket
                  ] = average_weekly_ppr

              nested_prior_lookup = {}

              for position, bucket_averages in (
                  nested_position_bucket_averages.items()
              ):
                  if not bucket_averages:
                      continue

                  position_minimum_ppr = min(
                      bucket_averages.values()
                  )

                  position_maximum_ppr = max(
                      bucket_averages.values()
                  )

                  for (
                      draft_capital_bucket,
                      average_ppr
                  ) in bucket_averages.items():
                      rookie_outcomes = (
                          nested_bucket_outcomes[
                              (
                                  position,
                                  draft_capital_bucket
                              )
                          ]
                      )

                      sample_size = len(rookie_outcomes)

                      if (
                          position_maximum_ppr >
                          position_minimum_ppr
                      ):
                          raw_prior_score = (
                              25.0 +
                              (
                                  (
                                      average_ppr -
                                      position_minimum_ppr
                                  ) /
                                  (
                                      position_maximum_ppr -
                                      position_minimum_ppr
                                  )
                              ) * 75.0
                          )
                      else:
                          raw_prior_score = 50.0

                      sample_reliability = (
                          sample_size /
                          (
                              sample_size +
                              rookie_prior_shrinkage_constant
                          )
                      )

                      shrunk_prior_score = (
                          50.0 +
                          (
                              raw_prior_score - 50.0
                          ) * sample_reliability
                      )

                      nested_prior_lookup[
                          (
                              position,
                              draft_capital_bucket
                          )
                      ] = round(
                          shrunk_prior_score,
                          2
                      )

              return nested_prior_lookup

          print(
              "Rookie position-specific nested "
              "leave-one-season-out blend validation:"
          )

          for evidence_game_count in (1, 2, 3):
              comparison_results = (
                  rookie_signal_comparison_results[
                      evidence_game_count
                  ]
              )

              for position in ("QB", "RB", "WR", "TE"):
                  position_results = [
                      result
                      for result in comparison_results
                      if result["position"] == position
                  ]

                  fold_results = []
                  selected_weight_counts = defaultdict(int)

                  for held_out_season in sorted(
                      historical_rookie_seasons
                  ):
                      outer_training_results = []
                      outer_test_results = []

                      for result in position_results:
                          rookie_outcome = (
                              historical_rookie_player_outcomes.get(
                                  result["player_id"]
                              )
                          )

                          if not rookie_outcome:
                              continue

                          result_season = rookie_outcome[
                              "rookie_season"
                          ]

                          if result_season == held_out_season:
                              outer_test_results.append(result)
                          else:
                              outer_training_results.append(
                                  result
                              )

                      if (
                          len(outer_training_results) < 2 or
                          len(outer_test_results) < 2
                      ):
                          continue

                      nested_training_rows = []

                      for result in outer_training_results:
                          rookie_outcome = (
                              historical_rookie_player_outcomes.get(
                                  result["player_id"]
                              )
                          )

                          if not rookie_outcome:
                              continue

                          training_result_season = (
                              rookie_outcome["rookie_season"]
                          )

                          inner_prior_lookup = (
                              build_nested_rookie_prior_lookup(
                                  {
                                      held_out_season,
                                      training_result_season
                                  }
                              )
                          )

                          lookup_key = (
                              rookie_outcome["position"],
                              rookie_outcome[
                                  "draft_capital_bucket"
                              ]
                          )

                          nested_prior_score = (
                              inner_prior_lookup.get(
                                  lookup_key
                              )
                          )

                          if nested_prior_score is None:
                              continue

                          nested_training_rows.append({
                              "player_id":
                                  result["player_id"],
                              "prior_score":
                                  nested_prior_score,
                              "evidence_average_ppr":
                                  result[
                                      "evidence_average_ppr"
                                  ],
                              "future_average_ppr":
                                  result[
                                      "future_average_ppr"
                                  ]
                          })

                      if len(nested_training_rows) < 2:
                          continue

                      training_prior_values = [
                          result["prior_score"]
                          for result in nested_training_rows
                      ]

                      training_nfl_values = [
                          result["evidence_average_ppr"]
                          for result in nested_training_rows
                      ]

                      training_prior_ranks = (
                          calculate_average_ranks(
                              training_prior_values
                          )
                      )

                      training_nfl_ranks = (
                          calculate_average_ranks(
                              training_nfl_values
                          )
                      )

                      best_nfl_weight = None
                      best_training_rho = None

                      for nfl_weight in rookie_blend_weights:
                          prior_weight = 1.0 - nfl_weight

                          training_blended_pairs = []

                          for (
                              result_index,
                              result
                          ) in enumerate(
                              nested_training_rows
                          ):
                              blended_rank_score = (
                                  training_prior_ranks[
                                      result_index
                                  ] * prior_weight +
                                  training_nfl_ranks[
                                      result_index
                                  ] * nfl_weight
                              )

                              training_blended_pairs.append(
                                  (
                                      blended_rank_score,
                                      result[
                                          "future_average_ppr"
                                      ]
                                  )
                              )

                          training_rho = (
                              calculate_spearman_rank_correlation(
                                  training_blended_pairs
                              )
                          )

                          if training_rho is None:
                              continue

                          if (
                              best_training_rho is None or
                              training_rho > best_training_rho
                          ):
                              best_training_rho = training_rho
                              best_nfl_weight = nfl_weight

                      if best_nfl_weight is None:
                          continue

                      outer_test_prior_lookup = (
                          build_nested_rookie_prior_lookup(
                              {held_out_season}
                          )
                      )

                      nested_test_rows = []

                      for result in outer_test_results:
                          rookie_outcome = (
                              historical_rookie_player_outcomes.get(
                                  result["player_id"]
                              )
                          )

                          if not rookie_outcome:
                              continue

                          lookup_key = (
                              rookie_outcome["position"],
                              rookie_outcome[
                                  "draft_capital_bucket"
                              ]
                          )

                          nested_prior_score = (
                              outer_test_prior_lookup.get(
                                  lookup_key
                              )
                          )

                          if nested_prior_score is None:
                              continue

                          nested_test_rows.append({
                              "player_id":
                                  result["player_id"],
                              "prior_score":
                                  nested_prior_score,
                              "evidence_average_ppr":
                                  result[
                                      "evidence_average_ppr"
                                  ],
                              "future_average_ppr":
                                  result[
                                      "future_average_ppr"
                                  ]
                          })

                      if len(nested_test_rows) < 2:
                          continue

                      test_prior_values = [
                          result["prior_score"]
                          for result in nested_test_rows
                      ]

                      test_nfl_values = [
                          result["evidence_average_ppr"]
                          for result in nested_test_rows
                      ]

                      test_prior_ranks = calculate_average_ranks(
                          test_prior_values
                      )

                      test_nfl_ranks = calculate_average_ranks(
                          test_nfl_values
                      )

                      held_out_prior_weight = (
                          1.0 - best_nfl_weight
                      )

                      held_out_pairs = []

                      for result_index, result in enumerate(
                          nested_test_rows
                      ):
                          held_out_blended_rank = (
                              test_prior_ranks[
                                  result_index
                              ] * held_out_prior_weight +
                              test_nfl_ranks[
                                  result_index
                              ] * best_nfl_weight
                          )

                          held_out_pairs.append(
                              (
                                  held_out_blended_rank,
                                  result[
                                      "future_average_ppr"
                                  ]
                              )
                          )

                      held_out_rho = (
                          calculate_spearman_rank_correlation(
                              held_out_pairs
                          )
                      )

                      if held_out_rho is None:
                          continue
                      held_out_nfl_only_pairs = [
                          (
                              test_nfl_ranks[result_index],
                              result["future_average_ppr"]
                          )
                          for result_index, result in enumerate(
                              nested_test_rows
                          )
                      ]

                      held_out_nfl_only_rho = (
                          calculate_spearman_rank_correlation(
                              held_out_nfl_only_pairs
                          )
                      )

                      if held_out_nfl_only_rho is None:
                          continue
                      selected_weight_counts[
                          best_nfl_weight
                      ] += 1

                      fold_results.append({
                          "season": held_out_season,
                          "n": len(held_out_pairs),
                          "rho": held_out_rho,
                          "nfl_only_rho":
                              held_out_nfl_only_rho,
                          "nfl_weight": best_nfl_weight
                      })

                      print(
                          f"{evidence_game_count} games "
                          f"{position} "
                          f"held_out={held_out_season}: "
                          f"n={len(held_out_pairs)}, "
                          f"rho={held_out_rho:.3f}, "
                          f"selected_nfl_weight="
                          f"{best_nfl_weight:.2f}."
                      )

                  total_fold_players = sum(
                      fold["n"]
                      for fold in fold_results
                  )

                  if total_fold_players > 0:
                      weighted_fold_rho = sum(
                          fold["rho"] * fold["n"]
                          for fold in fold_results
                      ) / total_fold_players

                      weighted_nfl_only_rho = sum(
                          fold["nfl_only_rho"] * fold["n"]
                          for fold in fold_results
                      ) / total_fold_players
                  else:
                      weighted_fold_rho = None
                      weighted_nfl_only_rho = None

                  weight_summary = ", ".join(
                      (
                          f"{nfl_weight:.2f}:"
                          f"{selected_weight_counts[nfl_weight]}"
                      )
                      for nfl_weight in rookie_blend_weights
                      if selected_weight_counts[
                          nfl_weight
                      ] > 0
                  )

                  if weighted_fold_rho is None:
                      print(
                          f"{evidence_game_count} games "
                          f"{position} nested summary: "
                          "rho=unavailable, "
                          f"selected_nfl_weights="
                          f"{weight_summary}."
                      )
                  else:
                      print(
                          f"{evidence_game_count} games "
                          f"{position} nested summary: "
                          f"n={total_fold_players}, "
                          f"blend_rho="
                          f"{weighted_fold_rho:.3f}, "
                          f"nfl_only_rho="
                          f"{weighted_nfl_only_rho:.3f}, "
                          f"delta="
                          f"{weighted_fold_rho - weighted_nfl_only_rho:+.3f}, "
                          f"selected_nfl_weights="
                          f"{weight_summary}."
                      )
          # -------------------------------------------------
          # ATTACH HISTORICAL COACHING / PLAY-CALLER DATA
          # -------------------------------------------------
          coaching_records_matched = 0
          coaching_records_missing = 0

          for row in historical_rows:
              season = str(row.get("season") or "")
              offense_team = row.get("team")
              defense_team = row.get("opponent_team")

              if offense_team == "LA":
                  offense_team = "LAR"

              if defense_team == "LA":
                  defense_team = "LAR"

              season_coaches = coaching_data.get(
                  season,
                  {}
              )

              offense_coaches = season_coaches.get(
                  offense_team,
                  {}
              )

              defense_coaches = season_coaches.get(
                  defense_team,
                  {}
              )

              row["offensive_coordinator"] = (
                  offense_coaches.get(
                      "offensive_coordinator"
                  )
              )

              row["offensive_play_caller"] = (
                  offense_coaches.get(
                      "offensive_play_caller"
                  )
              )

              row["defensive_coordinator"] = (
                  defense_coaches.get(
                      "defensive_coordinator"
                  )
              )

              row["defensive_play_caller"] = (
                  defense_coaches.get(
                      "defensive_play_caller"
                  )
              )

              if (
                  row["offensive_play_caller"] and
                  row["defensive_play_caller"]
              ):
                  coaching_records_matched += 1
              else:
                  coaching_records_missing += 1
          print(
              "Attached coaching data to "
              f"{coaching_records_matched} "
              "historical player-week records."
          )

          print(
              "Historical records missing a play caller: "
              f"{coaching_records_missing}."
          )
          # -------------------------------------------------
          # DIAGNOSE MISSING COACHING MAPPINGS
          # -------------------------------------------------

          missing_mapping_counts = defaultdict(int)

          for row in historical_rows:
              if (
                  row.get("offensive_play_caller") and
                  row.get("defensive_play_caller")
              ):
                  continue

              season = str(row.get("season") or "")
              offense_team = row.get("team") or "UNKNOWN"
              defense_team = (
                  row.get("opponent_team") or "UNKNOWN"
              )

              if not row.get("offensive_play_caller"):
                  key = (
                      season,
                      "OFFENSE",
                      offense_team
                  )

                  missing_mapping_counts[key] += 1

              if not row.get("defensive_play_caller"):
                  key = (
                      season,
                      "DEFENSE",
                      defense_team
                  )

                  missing_mapping_counts[key] += 1

          print(
              "Missing coaching mappings by "
              "season/team:"
          )

          for (
              season,
              side,
              team
          ), count in sorted(
              missing_mapping_counts.items()
          ):
              print(
                  f"{season} {side} {team}: "
                  f"{count}"
              )
          # -------------------------------------------------
          # HISTORICAL PLAY-CALLER MATCHUP PPR
          # -------------------------------------------------

          play_caller_game_totals = defaultdict(float)

          for row in historical_rows:
              offensive_play_caller = row.get(
                  "offensive_play_caller"
              )

              defensive_play_caller = row.get(
                  "defensive_play_caller"
              )

              position = row.get("position")
              season = str(row.get("season") or "")
              week = str(row.get("week") or "")

              if (
                  not offensive_play_caller or
                  not defensive_play_caller or
                  position not in {
                      "QB",
                      "RB",
                      "WR",
                      "TE"
                  } or
                  not season or
                  not week
              ):
                  continue

              fantasy_points = (
                  calculate_ppr_points(row)
              )
              game_key = (
                  offensive_play_caller,
                  defensive_play_caller,
                  position,
                  season,
                  week
              )

              play_caller_game_totals[
                  game_key
              ] += fantasy_points

          play_caller_matchup_history = defaultdict(
              list
          )

          for (
              offensive_play_caller,
              defensive_play_caller,
              position,
              season,
              week
          ), fantasy_points in (
              play_caller_game_totals.items()
          ):
              matchup_key = (
                  offensive_play_caller,
                  defensive_play_caller,
                  position
              )

              play_caller_matchup_history[
                  matchup_key
              ].append({
                  "season": int(season),
                  "week": int(float(week)),
                  "ppr_points": round(
                      fantasy_points,
                      2
                  )
              })

          for matchup_games in (
              play_caller_matchup_history.values()
          ):
              matchup_games.sort(
                  key=lambda game: (
                      game["season"],
                      game["week"]
                  ),
                  reverse=True
              )

          play_caller_matchups = {}

          for matchup_key, matchup_games in (
              play_caller_matchup_history.items()
          ):
              recent_games = matchup_games[:4]

              average_ppr = sum(
                  game["ppr_points"]
                  for game in recent_games
              ) / len(recent_games)

              key_string = "|".join(
                  matchup_key
              )

              play_caller_matchups[
                  key_string
              ] = {
                  "average_ppr": round(
                      average_ppr,
                      2
                  ),
                  "sample_size": len(
                      recent_games
                  ),
                  "games": recent_games
              }
          print(
              "Created "
              f"{len(play_caller_matchups)} "
              "historical play-caller matchup "
              "profiles."
          )
          # -------------------------------------------------
          # PLAYER VS DEFENSIVE PLAY-CALLER PPR
          # -------------------------------------------------

          player_vs_defensive_caller_history = defaultdict(
              list
          )

          for row in historical_rows:
              player_id = row.get("player_id")
              player_name = (
                  row.get("player_display_name") or
                  row.get("player_name")
              )
              position = row.get("position")
              defensive_play_caller = row.get(
                  "defensive_play_caller"
              )
              season = str(row.get("season") or "")
              week = str(row.get("week") or "")

              if (
                  not player_id or
                  not defensive_play_caller or
                  position not in {
                      "QB",
                      "RB",
                      "WR",
                      "TE"
                  } or
                  not season or
                  not week
              ):
                  continue

              fantasy_points = (
                  calculate_ppr_points(row)
              )
              matchup_key = (
                  player_id,
                  defensive_play_caller
              )

              player_vs_defensive_caller_history[
                  matchup_key
              ].append({
                  "season": int(season),
                  "week": int(float(week)),
                  "ppr_points": round(
                      fantasy_points,
                      2
                  ),
                  "player_name": player_name,
                  "position": position
              })

          for matchup_games in (
              player_vs_defensive_caller_history.values()
          ):
              matchup_games.sort(
                  key=lambda game: (
                      game["season"],
                      game["week"]
                  ),
                  reverse=True
              )

          player_vs_defensive_caller = {}

          for matchup_key, matchup_games in (
              player_vs_defensive_caller_history.items()
          ):
              recent_games = matchup_games[:4]
              average_ppr = sum(
                  game["ppr_points"]
                  for game in recent_games
              ) / len(recent_games)

              player_id, defensive_play_caller = (
                  matchup_key
              )

              key_string = (
                  f"{player_id}|"
                  f"{defensive_play_caller}"
              )

              player_vs_defensive_caller[
                  key_string
              ] = {
                  "player_name":
                      recent_games[0][
                          "player_name"
                      ],
                  "position":
                      recent_games[0][
                          "position"
                      ],
                  "defensive_play_caller":
                      defensive_play_caller,
                  "average_ppr": round(
                      average_ppr,
                      2
                  ),
                  "sample_size": len(
                      recent_games
                  ),
                  "games": [
                      {
                          "season":
                              game["season"],
                          "week":
                              game["week"],
                          "ppr_points":
                              game["ppr_points"]
                      }
                      for game in recent_games
                  ]
              }

          print(
              "Created "
              f"{len(player_vs_defensive_caller)} "
              "player-vs-defensive-play-caller "
              "profiles."
          )
          red_zone_seasons = {2025}

          if season_used:
              red_zone_seasons.add(
                  season_used
              )

          if completed_2026_rows:
              red_zone_seasons.add(2026)

          red_zone_stats = defaultdict(
              lambda: {
                  "red_zone_pass_attempts": 0,
                  "red_zone_carries": 0,
                  "red_zone_targets": 0
              }
          )

          for red_zone_season in sorted(
              red_zone_seasons
          ):
              pbp_url = (
                  "https://github.com/nflverse/nflverse-data/"
                  "releases/download/pbp/"
                  f"play_by_play_{red_zone_season}.csv.gz"
              )

              print(
                  f"Trying play-by-play: {pbp_url}"
              )

              with urllib.request.urlopen(
                  pbp_url
              ) as response:
                  compressed = response.read()

              content = gzip.decompress(
                  compressed
              ).decode("utf-8")

              reader = csv.DictReader(
                  io.StringIO(content)
              )

              for play in reader:
                  if play.get("season_type") != "REG":
                      continue

                  try:
                      yardline = float(
                          play.get("yardline_100") or 999
                      )
                  except (TypeError, ValueError):
                      continue

                  if yardline > 20:
                      continue

                  week = play.get("week")
                  team = play.get("posteam")

                  if not week or not team:
                      continue

                  try:
                      play_week = int(
                          float(week)
                      )
                  except (TypeError, ValueError):
                      continue

                  if (
                      target_week is not None and
                      red_zone_season == 2026 and
                      play_week >= target_week
                  ):
                      continue

                  passer_id = play.get(
                      "passer_player_id"
                  )
                  rusher_id = play.get(
                      "rusher_player_id"
                  )
                  receiver_id = play.get(
                      "receiver_player_id"
                  )

                  pass_attempt = (
                      play.get("pass_attempt") == "1"
                  )

                  rush_attempt = (
                      play.get("rush_attempt") == "1"
                  )

                  if pass_attempt and passer_id:
                      key = (
                          str(red_zone_season),
                          passer_id,
                          str(play_week)
                      )

                      red_zone_stats[key][
                          "red_zone_pass_attempts"
                      ] += 1

                  if rush_attempt and rusher_id:
                      key = (
                          str(red_zone_season),
                          rusher_id,
                          str(play_week)
                      )

                      red_zone_stats[key][
                          "red_zone_carries"
                      ] += 1

                  if pass_attempt and receiver_id:
                      key = (
                          str(red_zone_season),
                          receiver_id,
                          str(play_week)
                      )

                      red_zone_stats[key][
                          "red_zone_targets"
                      ] += 1

          matched = 0

          historical_matched_by_season = defaultdict(
              int
          )

          for row in rows:
              row_season = str(
                  row.get("season") or
                  season_used or
                  ""
              )

              player_id = row.get("player_id")
              week = str(row.get("week") or "")

              key = (
                  row_season,
                  player_id,
                  week
              )

              rz = red_zone_stats.get(key)

              if rz:
                  row.update(rz)
                  matched += 1

          for row in historical_rows:
              row_season = str(
                  row.get("season") or ""
              )

              if row_season not in {
                  "2025",
                  "2026"
              }:
                  continue

              row["red_zone_pass_attempts"] = 0
              row["red_zone_carries"] = 0
              row["red_zone_targets"] = 0

              player_id = row.get("player_id")
              week = str(row.get("week") or "")

              key = (
                  row_season,
                  player_id,
                  week
              )

              rz = red_zone_stats.get(key)

              if rz:
                  row.update(rz)

                  historical_matched_by_season[
                      row_season
                  ] += 1

          print(
              "Matched red-zone stats to "
              f"{matched} current player-week rows."
          )

          for red_zone_season in {
              "2025",
              "2026"
          }:
              season_match_count = (
                  historical_matched_by_season.get(
                      red_zone_season,
                      0
                  )
              )

              print(
                  "Matched red-zone stats to "
                  f"{season_match_count} historical "
                  "player-week rows for "
                  f"{red_zone_season}."
              )
          # -------------------------------------------------
          # MATCHUP DATA
          # Calculate rolling 2025-2026 fantasy points
          # allowed per game by each defense to
          # QB, RB, WR and TE.
          # -------------------------------------------------

          defense_position_totals = defaultdict(
              lambda: {
                  "2025": {
                      "fantasy_points": 0.0,
                      "games": set()
                  },
                  "2026": {
                      "fantasy_points": 0.0,
                      "games": set()
                  }
              }
          )
          for row in historical_rows:
              row_season = str(
                  row.get("season") or ""
              )

              if row_season not in {
                  "2025",
                  "2026"
              }:
                  continue

              defense = row.get("opponent_team")

              if defense == "LA":
                  defense = "LAR"

              position = row.get("position")
              week = str(row.get("week") or "")

              game_id = (
                  f"{row_season}-{week}"
              )

              if (
                  not defense or
                  position not in {"QB", "RB", "WR", "TE"} or
                  not week
              ):
                  continue

              fantasy_points = (
                  calculate_ppr_points(row)
              )
              key = (defense, position)

              defense_position_totals[key][
                  row_season
              ][
                  "fantasy_points"
              ] += fantasy_points

              defense_position_totals[key][
                  row_season
              ][
                  "games"
              ].add(game_id)
          defense_position_allowed = {}

          for (defense, position), data in (
              defense_position_totals.items()
          ):
              season_2025 = data["2025"]
              season_2026 = data["2026"]

              games_2025 = len(
                  season_2025["games"]
              )
              games_2026 = len(
                  season_2026["games"]
              )

              average_2025 = (
                  season_2025["fantasy_points"] /
                  games_2025
                  if games_2025 > 0
                  else None
              )

              average_2026 = (
                  season_2026["fantasy_points"] /
                  games_2026
                  if games_2026 > 0
                  else None
              )

              if games_2025 == 0 and games_2026 == 0:
                  continue

              if average_2026 is not None:
                  blended_average = average_2026
                  blend_source = "2026_only"
              else:
                  blended_average = None
                  blend_source = "unavailable"
              if defense not in defense_position_allowed:
                  defense_position_allowed[defense] = {}

              defense_position_allowed[
                  defense
              ][position] = {
                  "fantasy_points_allowed": round(
                      blended_average,
                      2
                  ),
                  "fantasy_points_allowed_2025": (
                      round(average_2025, 2)
                      if average_2025 is not None
                      else None
                  ),
                  "fantasy_points_allowed_2026": (
                      round(average_2026, 2)
                      if average_2026 is not None
                      else None
                  ),
                  "sample_size_2025": games_2025,
                  "sample_size_2026": games_2026,
                  "blend_source": blend_source
              }
          print(
              f"Created defensive matchup data for "
              f"{len(defense_position_allowed)} teams."
          )

          defense_matchup_position_values = {
              "QB": [],
              "RB": [],
              "WR": [],
              "TE": []
          }

          for defense_data in (
              defense_position_allowed.values()
          ):
              for position in {
                  "QB",
                  "RB",
                  "WR",
                  "TE"
              }:
                  position_defense_data = (
                      defense_data.get(
                          position,
                          {}
                      )
                  )

                  fantasy_points_allowed = (
                      position_defense_data.get(
                          "fantasy_points_allowed"
                      )
                  )

                  if fantasy_points_allowed is not None:
                      defense_matchup_position_values[
                          position
                      ].append(
                          float(fantasy_points_allowed)
                      )

          # -------------------------------------------------
          # 2026 CURRENT / NEXT OPPONENT DATA
          # -------------------------------------------------
          schedule_url = (
              "https://raw.githubusercontent.com/"
              "nflverse/nfldata/master/data/games.csv"
          )

          print(f"Trying schedule data: {schedule_url}")

          with urllib.request.urlopen(schedule_url) as response:
              schedule_content = (
                  response.read().decode("utf-8")
              )

          schedule_reader = csv.DictReader(
              io.StringIO(schedule_content)
          )

          upcoming_games = []

          for game in schedule_reader:
              if str(game.get("season")) != "2026":
                  continue

              if game.get("game_type") not in {"REG", ""}:
                  continue

              gameday = game.get("gameday")

              if not gameday:
                  continue

              try:
                  game_date = datetime.strptime(
                      gameday,
                      "%Y-%m-%d"
                  ).date()
              except ValueError:
                  continue

              game_week = int(
                  game.get("week") or 0
              )

              if target_week is not None:
                  if game_week != target_week:
                      continue
              else:
                  away_score = game.get("away_score")
                  home_score = game.get("home_score")

                  game_completed = (
                      away_score not in {
                          None,
                          ""
                      } and
                      home_score not in {
                          None,
                          ""
                      }
                  )

                  if game_completed:
                      continue

              away_team = game.get("away_team")
              home_team = game.get("home_team")

              if not away_team or not home_team:
                  continue

              upcoming_games.append({
                  "date": game_date,
                  "week": game_week,
                  "away_team": away_team,
                  "home_team": home_team
              })
          upcoming_games.sort(
              key=lambda game: (
                  game["date"],
                  game["week"]
              )
          )

          team_next_opponent = {}

          for game in upcoming_games:
              away_team = game["away_team"]
              home_team = game["home_team"]

              if away_team == "LA":
                  away_team = "LAR"

              if home_team == "LA":
                  home_team = "LAR"

              if away_team not in team_next_opponent:
                  team_next_opponent[away_team] = {
                      "opponent": home_team,
                      "week": game["week"],
                      "gameday": game["date"].isoformat(),
                      "location": "away"
                  }

              if home_team not in team_next_opponent:
                  team_next_opponent[home_team] = {
                      "opponent": away_team,
                      "week": game["week"],
                      "gameday": game["date"].isoformat(),
                      "location": "home"
                  }

          print(
              f"Created next-opponent data for "
              f"{len(team_next_opponent)} teams."
          )
          # -------------------------------------------------
          # 2026 PLAY-CALLER MATCHUP SIGNALS
          # -------------------------------------------------

          current_coaching = coaching_data.get(
              "2026",
              {}
          )

          current_play_caller_signals = {}

          signal_counts = {
              "teams_with_matchup": 0,
              "play_caller_history": 0,
              "play_caller_no_history": 0
          }

          for team, matchup in (
              team_next_opponent.items()
          ):
              normalized_team = (
                  "LAR"
                  if team == "LA"
                  else team
              )
              
              opponent = matchup.get(
                  "opponent"
              )

              normalized_opponent = (
                  "LAR"
                  if opponent == "LA"
                  else opponent
              )

              offense_staff = (
                  current_coaching.get(
                      normalized_team,
                      {}
                  )
              )

              defense_staff = (
                  current_coaching.get(
                      normalized_opponent,
                      {}
                  )
              )

              offensive_play_caller = (
                  offense_staff.get(
                      "offensive_play_caller"
                  )
              )

              defensive_play_caller = (
                  defense_staff.get(
                      "defensive_play_caller"
                  )
              )

              team_signal = {
                  "opponent":
                     opponent,
                  "week":
                      matchup.get("week"),
                  "offensive_coordinator":
                      offense_staff.get(
                          "offensive_coordinator"
                      ),
                  "offensive_play_caller":
                      offensive_play_caller,
                  "opponent_defensive_coordinator":
                      defense_staff.get(
                          "defensive_coordinator"
                      ),
                  "opponent_defensive_play_caller":
                      defensive_play_caller,
                  "positions": {}
              }

              if (
                  offensive_play_caller and
                  defensive_play_caller
              ):
                  signal_counts[
                      "teams_with_matchup"
                  ] += 1

              for position in {
                  "QB",
                  "RB",
                  "WR",
                  "TE"
              }:
                  history_key = "|".join([
                      offensive_play_caller or "",
                      defensive_play_caller or "",
                      position
                  ])

                  history = (
                      play_caller_matchups.get(
                          history_key
                      )
                  )

                  if history:
                      team_signal[
                          "positions"
                      ][position] = {
                          "average_ppr":
                              history.get(
                                  "average_ppr"
                              ),
                          "sample_size":
                              history.get(
                                  "sample_size"
                              ),
                          "games":
                              history.get(
                                  "games",
                                  []
                              )
                      }

                      signal_counts[
                          "play_caller_history"
                      ] += 1

                  else:
                      team_signal[
                          "positions"
                      ][position] = {
                          "average_ppr": None,
                          "sample_size": 0,
                          "games": []
                      }

                      signal_counts[
                          "play_caller_no_history"
                      ] += 1

              current_play_caller_signals[
                  team
              ] = team_signal

          print(
              "Created current play-caller signals "
              f"for {len(current_play_caller_signals)} "
              "teams."
          )

          print(
              "2026 teams with both play callers: "
              f"{signal_counts['teams_with_matchup']}."
          )

          print(
              "Position matchups with historical "
              "play-caller data: "
              f"{signal_counts['play_caller_history']}."
          )

          print(
              "Position matchups without historical "
              "play-caller data: "
              f"{signal_counts['play_caller_no_history']}."
          )
          # -------------------------------------------------
          # 2026 PLAYER VS DEFENSIVE PLAY-CALLER SIGNALS
          # -------------------------------------------------

          current_player_vs_defensive_caller = {}
          
          if target_week is not None:
              player_signal_source_rows = (
                  completed_2026_rows
              )
          else:
              player_signal_source_rows = rows

          player_signal_source_weeks = sorted({
              int(float(row.get("week") or 0))
              for row in player_signal_source_rows
              if row.get("week")
          })

          print(
              "Player-signal source weeks: "
              f"{player_signal_source_weeks}."
          )

          if target_week is not None:
              leaked_player_signal_weeks = [
                  week
                  for week in player_signal_source_weeks
                  if week >= target_week
              ]

              if leaked_player_signal_weeks:
                  raise RuntimeError(
                      "Fixed-week player-signal leakage "
                      "detected. Source contains target "
                      "or future weeks: "
                      f"{leaked_player_signal_weeks}"
                  )

          current_player_ids = {
              row.get("player_id")
              for row in player_signal_source_rows
              if row.get("player_id")
          }

          rostered_rookie_ids = {
              player_id
              for player_id, roster_player in (
                  roster_players_by_id.items()
              )
              if (
                  str(
                      roster_player.get("rookie_year") or ""
                  ).strip() == "2026" and
                  str(
                      roster_player.get("entry_year") or ""
                  ).strip() == "2026" and
                  str(
                      roster_player.get("years_exp") or ""
                  ).strip() in {"0", "0.0"}
              )
          }

          current_player_context_ids = (
              current_player_ids |
              rostered_rookie_ids
          )

          print(
              "Current stats-based model pool: "
              f"{len(current_player_ids)} players."
          )

          print(
              "Roster-aware player context pool: "
              f"{len(current_player_context_ids)} players."
          )

          current_player_context = {}

          for player_id in current_player_context_ids:
              player_rows = [
                  row
                  for row in player_signal_source_rows
                  if row.get("player_id") == player_id
              ]

              latest_player_row = (
                  max(
                      player_rows,
                      key=lambda row: int(
                          float(row.get("week") or 0)
                      )
                  )
                  if player_rows
                  else {}
              )

              roster_player = roster_players_by_id.get(
                  player_id,
                  {}
              )

              player_team = (
                  latest_player_row.get("team") or
                  roster_player.get("team")
              )

              if player_team == "LA":
                  player_team = "LAR"

              player_metadata = player_metadata_by_id.get(
                  player_id,
                  {}
              )

              is_rookie = (
                  player_id in rostered_rookie_ids
              )

              rookie_season = (
                  player_metadata.get("rookie_season")
              )

              draft_year = (
                  player_metadata.get("draft_year")
              )

              draft_round = (
                  player_metadata.get("draft_round")
              )

              draft_pick = (
                  player_metadata.get("draft_pick") or
                  roster_player.get("draft_number")
              )

              draft_team = (
                  player_metadata.get("draft_team") or
                  roster_player.get("draft_club")
              )

              draft_pick_source = (
                  "player_metadata"
                  if player_metadata.get("draft_pick")
                  else (
                      "roster"
                      if roster_player.get("draft_number")
                      else "unavailable"
                  )
              )

              draft_team_source = (
                  "player_metadata"
                  if player_metadata.get("draft_team")
                  else (
                      "roster"
                      if roster_player.get("draft_club")
                      else "unavailable"
                  )
              )

              college = (
                  player_metadata.get("college_name")
              )

              current_player_context[player_id] = {
                  "player_id": player_id,
                  "player_name": (
                      latest_player_row.get(
                          "player_display_name"
                      ) or
                      latest_player_row.get(
                          "player_name"
                      ) or
                      roster_player.get("player_name")
                  ),
                  "position": (
                      latest_player_row.get("position") or
                      roster_player.get("position")
                  ),
                  "team": player_team,
                  "has_stat_history": bool(player_rows),
                  "roster_source_available": bool(
                      roster_player
                  ),
                   "is_rookie": is_rookie,
                  "rookie_season": rookie_season,
                  "draft_year": draft_year,
                  "draft_round": draft_round,
                  "draft_pick": draft_pick,
                  "draft_pick_source": draft_pick_source,
                  "draft_team": draft_team,
                  "draft_team_source": draft_team_source,
                  "college": college
              }

          print(
              "Created roster-aware current-player "
              "context for "
              f"{len(current_player_context)} players."
          )

          invalid_current_player_context = []
          zero_stat_rookie_context_ids = []

          for player_id in current_player_context_ids:
              player_context = current_player_context.get(
                  player_id,
                  {}
              )

              player_name = player_context.get(
                  "player_name"
              )

              position = player_context.get(
                  "position"
              )

              team = player_context.get(
                  "team"
              )

              if (
                  not player_name or
                  position not in {
                      "QB",
                      "RB",
                      "WR",
                      "TE"
                  } or
                  not team
              ):
                  invalid_current_player_context.append({
                      "player_id": player_id,
                      "player_name": player_name,
                      "position": position,
                      "team": team
                  })

              if (
                  player_id in rostered_rookie_ids and
                  player_id not in current_player_ids
              ):
                  zero_stat_rookie_context_ids.append(
                      player_id
                  )

          if invalid_current_player_context:
              raise RuntimeError(
                  "Invalid roster-aware player context: "
                  f"{invalid_current_player_context[:10]}"
              )

          expected_zero_stat_rookie_ids = (
              rostered_rookie_ids -
              current_player_ids
          )

          if (
              set(zero_stat_rookie_context_ids) !=
              expected_zero_stat_rookie_ids
          ):
              raise RuntimeError(
                  "Zero-stat rookie context mismatch. "
                  f"Expected "
                  f"{len(expected_zero_stat_rookie_ids)}, "
                  f"found "
                  f"{len(zero_stat_rookie_context_ids)}."
              )

          invalid_rookie_context = []

          for player_id in rostered_rookie_ids:
              player_context = current_player_context.get(
                  player_id,
                  {}
              )

              if not player_context.get("is_rookie"):
                  invalid_rookie_context.append({
                      "player_id": player_id,
                      "reason": "missing_rookie_flag"
                  })
                  continue

              if not player_context.get(
                  "roster_source_available"
              ):
