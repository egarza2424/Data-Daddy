                          position,
                          "sample_size_mismatch",
                          games_2025,
                          stored_sample_2025,
                          games_2026,
                          stored_sample_2026
                      )
                  )
                  continue

              average_2025 = (
                  season_2025["fantasy_points"] /
                  games_2025
                  if games_2025 > 0
                  else None
              )

              average_2026 = (
                  season_2026["fantasy_points"] /
                  games_2026
                  if games_2026 > 0
                  else None
              )

              prior_weight = float(
                  stored.get(
                      "prior_season_weight_games",
