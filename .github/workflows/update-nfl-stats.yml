          def normalize_player_name(name):
              if not name:
                  return ""

              normalized_name = (
                  str(name)
                  .lower()
                  .replace(".", "")
                  .replace("'", "")
                  .replace("-", " ")
              )

              name_parts = normalized_name.split()

              suffixes = {
                  "jr",
                  "sr",
                  "ii",
                  "iii",
                  "iv",
                  "v"
              }

              while (
                  name_parts and
                  name_parts[-1] in suffixes
              ):
                  name_parts.pop()

              return " ".join(name_parts)
              
          def calculate_ecr_score(
              rank_ecr,
              model_eligible
          ):
              if not model_eligible:
                  return 50

              if rank_ecr is None:
                  return 50

              try:
                  ecr_rank = float(rank_ecr)
              except (TypeError, ValueError):
                  return 50

              if (
                  ecr_rank < 1 or
                  ecr_rank > 10
              ):
                  return 50

              if ecr_rank <= 2:
                  return 100

              if ecr_rank <= 4:
                  return 90

              if ecr_rank <= 6:
                  return 80

              if ecr_rank <= 8:
                  return 70

              if ecr_rank <= 10:
                  return 60

              return 50
              
