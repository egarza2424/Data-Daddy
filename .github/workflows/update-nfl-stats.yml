                  "ecr_score"
              ] = calculate_ecr_score(
                  expert_ranking.get("rank_ecr"),
                  expert_rankings_model_eligible
              )

          invalid_available_ecr = []

          for (
              expert_name,
              expert_ranking
          ) in expert_rankings.items():
              if not expert_ranking.get(
                  "ecr_available"
              ):
                  continue

              try:
                  available_rank_ecr = float(
                      expert_ranking.get("rank_ecr")
                  )
              except (TypeError, ValueError):
                  available_rank_ecr = None

              if (
                  available_rank_ecr is None or
                  available_rank_ecr < 1 or
                  available_rank_ecr > 10 or
                  not expert_ranking.get(
                      "model_eligible"
                  )
              ):
                  invalid_available_ecr.append(
                      expert_name
                  )

          if invalid_available_ecr:
              raise RuntimeError(
                  "Invalid usable ECR state for: "
                  f"{invalid_available_ecr}"
              )              
          invalid_unavailable_ecr_scores = [
              expert_name
              for expert_name, expert_ranking
              in expert_rankings.items()
              if (
                  not expert_ranking.get(
                      "ecr_available"
                  ) and
                  expert_ranking.get(
                      "ecr_score"
                  ) != 50
              )
          ]

          if invalid_unavailable_ecr_scores:
              raise RuntimeError(
                  "Unavailable ECR has a non-neutral "
                  "score for: "
                  f"{invalid_unavailable_ecr_scores}"
              )          
          available_ecr_signals = sum(
              1
              for expert_ranking in expert_rankings.values()
              if expert_ranking.get("ecr_available")
          )

          unavailable_ecr_signals = (
              len(expert_rankings) -
              available_ecr_signals
          )

          print(
              "ECR availability: "
              f"{available_ecr_signals} usable, "
              f"{unavailable_ecr_signals} unavailable."
          )

          active_ecr_scores = sum(
              1
              for expert_ranking in expert_rankings.values()
              if (
                  expert_ranking.get("ecr_available") and
                  expert_ranking.get("ecr_score") != 50
              )
          )

          print(
              "ECR scoring signals: "
              f"{active_ecr_scores} active."
          )
          if (
              len(current_recent_performance) !=
              len(current_player_ids)
          ):
              raise RuntimeError(
                  "Recent-performance current-player "
                  "count does not match current player pool. "
                  f"Scores: "
                  f"{len(current_recent_performance)}, "
                  f"players: {len(current_player_ids)}."
              )

          invalid_recent_performance_scores = []

          for (
              player_id,
              performance
          ) in current_recent_performance.items():
              score = performance.get("score")

              if (
                  score is None or
                  score < 0 or
                  score > 100
              ):
                  invalid_recent_performance_scores.append(
                      player_id
                  )

          if invalid_recent_performance_scores:
              raise RuntimeError(
                  "Invalid recent-performance scores for: "
                  f"{invalid_recent_performance_scores[:10]}"
              )

          print(
              "Validated recent-performance scores for "
              f"{len(current_recent_performance)} "
              "current players."
          )
          # ---------------------------------------------
          # VALIDATE RECENT-PERFORMANCE SAMPLE CONFIDENCE
          # ---------------------------------------------

          recent_confidence_sample_counts = {
              0: 0,
              1: 0,
              2: 0,
              3: 0,
              4: 0
          }

          invalid_recent_confidence_scores = []

          for (
              player_id,
              performance
          ) in current_recent_performance.items():
              sample_size = int(
                  performance.get(
                      "sample_size",
                      0
                  ) or 0
              )

              raw_score = performance.get(
                  "raw_score"
              )

              actual_score = performance.get(
                  "score"
              )

              actual_confidence = float(
                  performance.get(
                      "sample_confidence",
                      0.0
                  ) or 0.0
              )

              actual_available = performance.get(
                  "available",
                  False
              )

              if sample_size >= 4:
                  expected_confidence = 1.0
              elif sample_size == 3:
                  expected_confidence = 0.8
              elif sample_size == 2:
                  expected_confidence = 0.6
              elif sample_size == 1:
                  expected_confidence = 0.4
              else:
                  expected_confidence = 0.0

              sample_bucket = min(
                  max(sample_size, 0),
                  4
              )

              recent_confidence_sample_counts[
                  sample_bucket
              ] += 1

              if sample_size == 0:
                  if (
                      actual_score != 50 or
                      actual_confidence != 0.0 or
                      actual_available
                  ):
                      invalid_recent_confidence_scores.append(
                          (
                              player_id,
                              sample_size,
                              actual_score,
                              actual_confidence,
                              actual_available
                          )
                      )

                  continue

              if not actual_available:
                  invalid_recent_confidence_scores.append(
                      (
                          player_id,
                          sample_size,
                          "history_marked_unavailable"
                      )
                  )

                  continue

              expected_score = round(
                  50 + (
                      raw_score - 50
                  ) * expected_confidence,
                  2
              )

              if (
                  actual_confidence !=
                  expected_confidence or
                  actual_score != expected_score
              ):
                  invalid_recent_confidence_scores.append(
                      (
                          player_id,
                          sample_size,
                          actual_score,
                          expected_score,
                          actual_confidence,
                          expected_confidence
                      )
                  )

          if invalid_recent_confidence_scores:
              raise RuntimeError(
                  "Recent-performance sample-confidence "
                  "validation failed for: "
                  f"{invalid_recent_confidence_scores[:10]}"
              )

          print(
              "Recent-performance confidence sample sizes: "
              f"{recent_confidence_sample_counts}."
          )

          print(
              "Validated recent-performance sample "
              "confidence for "
              f"{len(current_recent_performance)} "
              "current players."
          )

          # ---------------------------------------------
          # FANTASY AI SCORE WEIGHTS
          # ---------------------------------------------

          fantasy_ai_base_weights = {
              "recent_performance": 0.25,
              "opportunity_volume": 0.25,
              "red_zone_opportunity": 0.15,
              "defensive_matchup": 0.15,
              "play_caller_matchup": 0.10,
              "fantasypros_ecr": 0.10
          }

          rookie_prior_production_weights = {
              "QB": {
                  0: 1.00,
                  1: 0.50,
                  2: 0.50,
                  3: 0.25
              },
              "RB": {
                  0: 1.00,
                  1: 0.25,
                  2: 0.25,
                  3: 0.25
              },
              "WR": {
                  0: 1.00,
                  1: 0.50,
                  2: 0.25,
                  3: 0.00
              },
              "TE": {
                  0: 1.00,
                  1: 0.25,
                  2: 0.25,
                  3: 0.00
              }
          }
          if round(
              sum(fantasy_ai_base_weights.values()),
              10
          ) != 1.0:
              raise RuntimeError(
                  "Fantasy AI base weights must total 1.0."
              )

          def calculate_fantasy_ai_score(
              component_scores
          ):
              active_components = {}

              for (
                  component_name,
                  component_data
              ) in component_scores.items():
                  if not component_data.get(
                      "available",
                      False
                  ):
                      continue

                  score = component_data.get("score")

                  if score is None:
                      continue

                  base_weight = (
                      fantasy_ai_base_weights.get(
                          component_name,
                          0.0
                      )
                  )

                  if base_weight <= 0:
                      continue

                  active_components[
                      component_name
                  ] = {
                      "score": float(score),
                      "base_weight": base_weight
                  }

              active_weight_total = sum(
                  component["base_weight"]
                  for component in (
                      active_components.values()
                  )
              )

              if active_weight_total <= 0:
                  return {
                      "score": 50.0,
                      "available": False,
                      "active_weight_total": 0.0,
                      "components": {}
                  }

              weighted_score = 0.0

              for (
                  component_name,
                  component
              ) in active_components.items():
                  effective_weight = (
                      component["base_weight"] /
                      active_weight_total
                  )

                  component[
                      "effective_weight"
                  ] = round(
                      effective_weight,
                      4
                  )

                  weighted_score += (
                      component["score"] *
                      effective_weight
                  )

              return {
                  "score": round(weighted_score, 1),
                  "available": True,
                  "active_weight_total": round(
                      active_weight_total,
                      4
                  ),
                  "components": active_components
              }

          # ---------------------------------------------
          # CALCULATE CURRENT FANTASY AI SCORES
          # ---------------------------------------------

          eligible_zero_stat_rookie_ids = {
              player_id
              for player_id, player_context in (
                  current_player_context.items()
              )
              if (
                  target_week is None and
                  player_context.get("is_rookie", False) and
                  player_context.get(
                      "rookie_prior_eligible",
                      False
                  ) and
                  not player_context.get(
                      "has_stat_history",
                      False
                  ) and
                  (
                      player_context.get(
                          "rookie_draft_capital_bucket"
                      ) is not None
                  )
              )
          }

          fantasy_ai_player_ids = (
              current_player_ids |
              eligible_zero_stat_rookie_ids
          )

          print(
              "Fantasy AI scoring pool: "
              f"{len(fantasy_ai_player_ids)} players "
              f"({len(current_player_ids)} stats-based + "
              f"{len(eligible_zero_stat_rookie_ids)} "
              "eligible zero-stat rookies)."
          )

          current_fantasy_ai_scores = {}

          expert_rankings_by_player_id = {}

          for expert_ranking in expert_rankings.values():
              nflverse_player_id = expert_ranking.get(
                  "nflverse_player_id"
              )

              if nflverse_player_id:
                  expert_rankings_by_player_id[
                      nflverse_player_id
                  ] = expert_ranking

          for player_id in fantasy_ai_player_ids:
              recent_signal = (
                  current_recent_performance.get(
                      player_id,
                      {}
                  )
              )

              opportunity_signal = (
                  current_player_opportunity.get(
                      player_id,
                      {}
                  )
              )

              red_zone_signal = (
                  current_player_red_zone.get(
                      player_id,
                      {}
                  )
              )

              defensive_signal = (
                  current_player_defensive_matchup.get(
                      player_id,
                      {}
                  )
              )

              play_caller_signal = (
                  current_player_play_caller_matchup.get(
                      player_id,
                      {}
                  )
              )

              matching_ecr = (
                  expert_rankings_by_player_id.get(
                      player_id
                  )
              )
              player_context = current_player_context.get(
                  player_id,
                  {}
              )

              rookie_prior_score = None
              rookie_prior_weight = 0.0

              if (
                  player_context.get("is_rookie", False) and
                  player_context.get(
                      "rookie_prior_eligible",
                      False
                  )
              ):
                  rookie_position = player_context.get(
                      "position"
                  )

                  rookie_draft_capital_bucket = (
                      player_context.get(
                          "rookie_draft_capital_bucket"
                      )
                  )

                  rookie_prior_data = (
                      rookie_draft_capital_prior_lookup.get(
                          (
                              rookie_position,
                              rookie_draft_capital_bucket
                          ),
                          {}
                      )
                  )

                  rookie_prior_score = (
                      rookie_prior_data.get(
                          "shrunk_prior_score"
                      )
                  )

                  rookie_games_with_stats = int(
                      player_context.get(
                          "rookie_nfl_games_with_stats",
                          0
                      ) or 0
                  )

                  rookie_weight_game_count = (
                      rookie_games_with_stats
                  )

                  rookie_prior_weight = (
                      rookie_prior_production_weights.get(
                          rookie_position,
                          {}
                      ).get(
                          rookie_weight_game_count,
                          0.0
                      )
                  )
              recent_available = (
                  recent_signal.get(
                      "available",
                      False
                  ) and
                  recent_signal.get("score") is not None
              )
              opportunity_available = (
                  opportunity_signal.get(
                      "available",
                      False
                  ) and
                  opportunity_signal.get("score") is not None
              )

              red_zone_available = (
                  red_zone_signal.get(
                      "available",
                      False
                  ) and
                  red_zone_signal.get("score") is not None
              )

              defensive_available = (
                  defensive_signal.get("score") is not None and
                  not str(
                      defensive_signal.get("score_source")
                  ).startswith("neutral_")
              )

              play_caller_available = (
                  play_caller_signal.get(
                      "available",
                      False
                  ) and
                  play_caller_signal.get("score") is not None
              )

              ecr_available = (
                  matching_ecr is not None and
                  matching_ecr.get(
                      "ecr_available",
                      False
                  ) and
                  matching_ecr.get(
                      "model_eligible",
                      False
                  ) and
                  matching_ecr.get("ecr_score") is not None
              )

              component_scores = {
                  "recent_performance": {
                      "score": recent_signal.get("score"),
                      "available": recent_available
                  },
                  "opportunity_volume": {
                      "score": opportunity_signal.get("score"),
                      "available": opportunity_available
                  },
                  "red_zone_opportunity": {
                      "score": red_zone_signal.get("score"),
                      "available": red_zone_available
                  },
                  "defensive_matchup": {
                      "score": defensive_signal.get("score"),
                      "available": defensive_available
                  },
                  "play_caller_matchup": {
                      "score": play_caller_signal.get("score"),
                      "available": play_caller_available
                  },
                  "fantasypros_ecr": {
                      "score": (
                          matching_ecr.get("ecr_score")
                          if matching_ecr
                          else None
                      ),
                      "available": ecr_available
                  }
              }

              fantasy_ai_result = (
                  calculate_fantasy_ai_score(
                      component_scores
                  )
              )

              base_fantasy_ai_score = (
                  fantasy_ai_result.get("score")
              )

              base_fantasy_ai_available = (
                  fantasy_ai_result.get(
                      "available",
                      False
                  )
              )

              rookie_prior_applied = (
                  rookie_prior_score is not None and
                  rookie_prior_weight > 0.0
              )

              rookie_prior_only = (
                  rookie_prior_applied and
                  not base_fantasy_ai_available and
                  rookie_prior_weight == 1.0
              )

              if (
                  rookie_prior_applied and
                  base_fantasy_ai_available
              ):
                  adjusted_fantasy_ai_score = round(
                      (
                          base_fantasy_ai_score *
                          (1.0 - rookie_prior_weight)
                      ) +
                      (
                          rookie_prior_score *
                          rookie_prior_weight
                      ),
                      1
                  )

                  fantasy_ai_result["score"] = max(
                      0.0,
                      min(
                          100.0,
                          adjusted_fantasy_ai_score
                      )
                  )

              elif rookie_prior_only:
                  fantasy_ai_result["score"] = round(
                      max(
                          0.0,
                          min(
                              100.0,
                              float(rookie_prior_score)
                          )
                      ),
                      1
                  )

                  fantasy_ai_result[
                      "available"
                  ] = True

              fantasy_ai_result[
                  "base_score"
              ] = base_fantasy_ai_score

              fantasy_ai_result[
                  "base_available"
              ] = base_fantasy_ai_available

              fantasy_ai_result[
                  "rookie_prior_adjustment"
              ] = {
                  "eligible": (
                      player_context.get(
                          "rookie_prior_eligible",
                          False
                      )
                  ),
                  "applied": rookie_prior_applied,
                  "prior_only": rookie_prior_only,
                  "prior_score": rookie_prior_score,
                  "weight": rookie_prior_weight,
                  "nfl_games_with_stats": (
                      player_context.get(
                          "rookie_nfl_games_with_stats",
                          0
                      )
                  ),
                  "draft_capital_bucket": (
                      player_context.get(
                          "rookie_draft_capital_bucket"
                      )
                  ),
                  "draft_capital_source": (
                      player_context.get(
                          "rookie_draft_capital_source"
                      )
                  )
              }

              transparent_components = {}

              for (
                  component_name,
                  component_data
              ) in component_scores.items():
                  active_component = (
                      fantasy_ai_result.get(
                          "components",
                          {}
                      ).get(
                          component_name,
                          {}
                      )
                  )

                  transparent_components[
                      component_name
                  ] = {
                      "score":
                          component_data.get("score"),
                      "available":
                          component_data.get(
                              "available",
                              False
                          ),
                      "base_weight":
                          fantasy_ai_base_weights.get(
                              component_name,
                              0.0
                          ),
                      "effective_weight":
                          active_component.get(
                              "effective_weight",
                              0.0
                          )
                  }

              fantasy_ai_result[
                  "components"
              ] = transparent_components

              current_fantasy_ai_scores[
                  player_id
              ] = fantasy_ai_result
          print("2026 ROOKIE PRODUCTION-WEIGHT DIAGNOSTIC:")

          for player_id, fantasy_ai_result in sorted(
              current_fantasy_ai_scores.items()
          ):
              player_context = current_player_context.get(
                  player_id,
                  {}
              )

              if not player_context.get("is_rookie", False):
                  continue

              rookie_adjustment = fantasy_ai_result.get(
                  "rookie_prior_adjustment",
                  {}
              )

          print(
                  f"{player_context.get('player_name')} | "
                  f"{player_context.get('position')} | "
                  f"games="
                  f"{rookie_adjustment.get('nfl_games_with_stats')} | "
                  f"prior="
                  f"{rookie_adjustment.get('prior_score')} | "
                  f"weight="
                  f"{rookie_adjustment.get('weight')} | "
                  f"base="
                  f"{fantasy_ai_result.get('base_score')} | "
                  f"final="
                  f"{fantasy_ai_result.get('score')} | "
                  f"prior_only="
                  f"{rookie_adjustment.get('prior_only')}"
              )

          print("END ROOKIE PRODUCTION-WEIGHT DIAGNOSTIC")
          print(
              "Created Fantasy AI scores for "
              f"{len(current_fantasy_ai_scores)} "
              "current players."
          )

          # ---------------------------------------------
          # VALIDATE FANTASY AI SCORES
          # ---------------------------------------------

          invalid_fantasy_ai_scores = []
          fantasy_ai_active_weight_counts = defaultdict(int)
          fantasy_ai_component_usage = defaultdict(int)
          fantasy_ai_scores_for_diagnostics = []

          if (
              len(current_fantasy_ai_scores) !=
              len(fantasy_ai_player_ids)
          ):
              raise RuntimeError(
                  "Fantasy AI score count does not match "
                  "Fantasy AI player pool. Scores: "
                  f"{len(current_fantasy_ai_scores)}, "
                  "players: "
                  f"{len(fantasy_ai_player_ids)}."
              )
          for (
              player_id,
              fantasy_ai_result
          ) in current_fantasy_ai_scores.items():
              final_score = fantasy_ai_result.get("score")
              score_available = fantasy_ai_result.get(
                  "available",
                  False
              )

              components = fantasy_ai_result.get(
                  "components",
                  {}
              )

              expected_component_names = set(
                  fantasy_ai_base_weights.keys()
              )

              actual_component_names = set(
                  components.keys()
              )

              prior_only_result = (
                  fantasy_ai_result.get(
                      "rookie_prior_adjustment",
                      {}
                  ).get(
                      "prior_only",
                      False
                  )
              )

              valid_component_structure = (
                  actual_component_names.issubset(
                      expected_component_names
                  )
                  and (
                      bool(actual_component_names)
                      or prior_only_result
                  )
              )

              if not valid_component_structure:
                  invalid_fantasy_ai_scores.append(
                      (
                          player_id,
                          "component_structure_mismatch",
                          sorted(actual_component_names),
                          sorted(expected_component_names)
                      )
                  )
                  continue
              rookie_adjustment = fantasy_ai_result.get(
                  "rookie_prior_adjustment",
                  {}
              )

              prior_only = rookie_adjustment.get(
                  "prior_only",
                  False
              )

              prior_applied = rookie_adjustment.get(
                  "applied",
                  False
              )

              base_available = fantasy_ai_result.get(
                  "base_available",
                  False
              )

              prior_weight = float(
                  rookie_adjustment.get(
                      "weight",
                      0.0
                  ) or 0.0
              )

              prior_score = rookie_adjustment.get(
                  "prior_score"
              )

              if prior_only and not (
                  rookie_adjustment.get("eligible", False)
                  and prior_applied
                  and not base_available
                  and prior_weight == 1.0
                  and prior_score is not None
                  and score_available
              ):
                  invalid_fantasy_ai_scores.append(
                      (
                          player_id,
                          "invalid_prior_only_configuration"
                      )
                  )

              if (
                  prior_applied
                  and not base_available
                  and not prior_only
              ):
                  invalid_fantasy_ai_scores.append(
                      (
                          player_id,
                          "prior_applied_without_base"
                      )
                  )                  
              active_weight_total = float(
                  fantasy_ai_result.get(
                      "active_weight_total",
                      0.0
                  ) or 0.0
              )

              if not score_available:
                  invalid_fantasy_ai_scores.append(
                      (
                          player_id,
                          "final_score_unavailable"
                      )
                  )
                  continue

              if (
                  final_score is None or
                  float(final_score) < 0 or
                  float(final_score) > 100
              ):
                  invalid_fantasy_ai_scores.append(
                      (
                          player_id,
                          "invalid_final_score",
                          final_score
                      )
                  )
                  continue

              active_components = {
                  component_name: component
                  for component_name, component
                  in components.items()
                  if component.get("available", False)
              }

              unavailable_components = {
                  component_name: component
                  for component_name, component
                  in components.items()
                  if not component.get("available", False)
              }
              expected_recent_available = (
                  current_recent_performance.get(
                      player_id,
                      {}
                  ).get(
                      "available",
                      False
                  )
              )

              signal_availability_checks = {
                  "recent_performance": (
                      expected_recent_available
                  ),
                  "opportunity_volume": (
                      current_player_opportunity.get(
                          player_id,
                          {}
                      ).get(
                          "available",
                          False
                      )
                  ),
                  "red_zone_opportunity": (
                      current_player_red_zone.get(
                          player_id,
                          {}
                      ).get(
                          "available",
                          False
                      )
                  )
              }
              for (
                  component_name,
                  expected_available
              ) in signal_availability_checks.items():
                  actual_available = components.get(
                      component_name,
                      {}
                  ).get(
                      "available",
                      False
                  )
                  if actual_available != expected_available:
                      invalid_fantasy_ai_scores.append(
                          (
                              player_id,
                              "component_availability_mismatch",
                              component_name,
                              expected_available,
                              actual_available
                          )
                      )
              effective_weight_sum = sum(
                  float(
                      component.get(
                          "effective_weight",
                          0.0
                      ) or 0.0
                  )
                  for component in active_components.values()
              )

              invalid_unavailable_weights = [
                  component_name
                  for component_name, component
                  in unavailable_components.items()
                  if abs(
                      float(
                          component.get(
                              "effective_weight",
                              0.0
                          ) or 0.0
                      )
                  ) > 0.0001
              ]

              if invalid_unavailable_weights:
                  invalid_fantasy_ai_scores.append(
                      (
                          player_id,
                          "unavailable_component_has_weight",
                          invalid_unavailable_weights
                      )
                  )
              base_available = fantasy_ai_result.get(
                  "base_available",
                  False
              )

              expected_weight_sum = (
                  1.0 if base_available else 0.0
              )

              if abs(
                  effective_weight_sum - expected_weight_sum
              ) > 0.001:
                  invalid_fantasy_ai_scores.append(
                      (
                          player_id,
                          "effective_weights_do_not_match_base",
                          round(effective_weight_sum, 6),
                          expected_weight_sum
                      )
                  )
              base_score = fantasy_ai_result.get(
                  "base_score"
              )

              rookie_adjustment = fantasy_ai_result.get(
                  "rookie_prior_adjustment",
                  {}
              )

              if base_available:
                  independently_rebuilt_score = round(
                      sum(
                          float(component.get("score") or 0.0) *
                          (
                              float(
                                  component.get(
                                      "base_weight",
                                      0.0
                                  ) or 0.0
                              ) /
                              active_weight_total
                          )
                          for component in active_components.values()
                      ),
                      1
                  )
              else:
                  independently_rebuilt_score = 50.0

              if abs(
                  float(base_score) -
                  independently_rebuilt_score
              ) > 0.11:
                  invalid_fantasy_ai_scores.append(
                      (
                          player_id,
                          "base_score_math_mismatch",
                          base_score,
                          independently_rebuilt_score
                      )
                  )

              prior_applied = rookie_adjustment.get(
                  "applied",
                  False
              )

              prior_only = rookie_adjustment.get(
                  "prior_only",
                  False
              )

              prior_score = rookie_adjustment.get(
                  "prior_score"
              )

              prior_weight = float(
                  rookie_adjustment.get(
                      "weight",
                      0.0
                  ) or 0.0
              )

              if prior_only:
                  expected_final_score = round(
                      float(prior_score),
                      1
                  )
              elif prior_applied and base_available:
                  expected_final_score = round(
                      (
                          independently_rebuilt_score *
                          (1.0 - prior_weight)
                      ) +
                      (
                          float(prior_score) *
                          prior_weight
                      ),
                      1
                  )
              else:
                  expected_final_score = (
                      independently_rebuilt_score
                  )

              if abs(
                  float(final_score) -
                  expected_final_score
              ) > 0.11:
                  invalid_fantasy_ai_scores.append(
                      (
                          player_id,
                          "final_score_math_mismatch",
                          final_score,
                          expected_final_score
                      )
                  )
              expected_active_weight_total = sum(
                  float(
                      component.get(
                          "base_weight",
                          0.0
                      ) or 0.0
                  )
                  for component in active_components.values()
              )
              if abs(
                  active_weight_total -
                  expected_active_weight_total
              ) > 0.0001:
                  invalid_fantasy_ai_scores.append(
                      (
                          player_id,
                          "active_weight_total_mismatch",
                          active_weight_total,
                          round(
                              expected_active_weight_total,
                              4
                          )
                      )
                  )

              historical_ecr_component = (
                  components.get(
                      "fantasypros_ecr",
                      {}
                  )
              )

              if (
                  target_week is not None and
                  (
                      historical_ecr_component.get(
                          "available",
                          False
                      ) or
                      abs(
                          float(
                              historical_ecr_component.get(
                                  "effective_weight",
                                  0.0
                              ) or 0.0
                          )
                      ) > 0.0001
                  )
              ):
                  invalid_fantasy_ai_scores.append(
                      (
                          player_id,
                          "historical_ecr_leakage"
                      )
                  )
              active_weight_key = round(
                  active_weight_total,
                  2
              )

              fantasy_ai_active_weight_counts[
                  active_weight_key
              ] += 1

              for component_name in active_components:
                  fantasy_ai_component_usage[
                      component_name
                  ] += 1

              fantasy_ai_scores_for_diagnostics.append(
                  float(final_score)
              )

          if invalid_fantasy_ai_scores:
              raise RuntimeError(
                  "Fantasy AI score validation failed for: "
                  f"{invalid_fantasy_ai_scores[:10]}"
              )

          print(
              "Fantasy AI active base-weight totals: "
              f"{dict(sorted(
                  fantasy_ai_active_weight_counts.items()
              ))}."
          )

          print(
              "Fantasy AI component usage: "
              f"{dict(
                  sorted(
                      fantasy_ai_component_usage.items()
                  )
              )}."
          )

          if fantasy_ai_scores_for_diagnostics:
              print(
                  "Fantasy AI score range: "
                  f"{round(
                      min(fantasy_ai_scores_for_diagnostics),
                      1
                  )}-"
                  f"{round(
                      max(fantasy_ai_scores_for_diagnostics),
                      1
                  )}; average "
                  f"{round(
                      sum(
                          fantasy_ai_scores_for_diagnostics
                      ) /
                      len(
                          fantasy_ai_scores_for_diagnostics
                      ),
                      2
                  )}."
              )

          print(
              "Validated Fantasy AI scores for "
              f"{len(current_fantasy_ai_scores)} "
              "current players."
          )

          # ---------------------------------------------
          # FINAL MODEL COMPONENT DIAGNOSTICS
          # ---------------------------------------------

          model_component_diagnostics = {
              "recent_performance": {
                  "scores": [],
                  "available": 0,
                  "unavailable": 0
              },
              "opportunity_volume": {
                  "scores": [],
                  "available": 0,
                  "unavailable": 0
              },
              "red_zone_opportunity": {
                  "scores": [],
                  "available": 0,
                  "unavailable": 0
              },
              "defensive_matchup": {
                  "scores": [],
                  "available": 0,
                  "unavailable": 0
              },
              "play_caller_matchup": {
                  "scores": [],
                  "available": 0,
                  "unavailable": 0
              },
              "fantasypros_ecr": {
                  "scores": [],
                  "available": 0,
                  "unavailable": 0
              }
          }

          for player_id in current_player_ids:
              recent_signal = (
                  current_recent_performance.get(
                      player_id,
                      {}
                  )
              )

              opportunity_signal = (
                  current_player_opportunity.get(
                      player_id,
                      {}
                  )
              )

              red_zone_signal = (
                  current_player_red_zone.get(
                      player_id,
                      {}
                  )
              )

              defensive_signal = (
                  current_player_defensive_matchup.get(
                      player_id,
                      {}
                  )
              )

              play_caller_signal = (
                  current_player_play_caller_matchup.get(
                      player_id,
                      {}
                  )
              )

              component_signals = {
                  "recent_performance": recent_signal,
                  "opportunity_volume": opportunity_signal,
                  "red_zone_opportunity": red_zone_signal,
                  "defensive_matchup": defensive_signal
              }

              for (
                  component_name,
                  component_signal
              ) in component_signals.items():
                  score_source = component_signal.get(
                      "score_source"
                  )

                  score = component_signal.get("score")

                  component_available = (
                      score is not None and
                      not str(score_source).startswith(
                          "neutral_"
                      )
                  )

                  if component_available:
                      model_component_diagnostics[
                          component_name
                      ]["available"] += 1

                      model_component_diagnostics[
                          component_name
                      ]["scores"].append(
                          float(score)
                      )

                  else:
                      model_component_diagnostics[
                          component_name
                      ]["unavailable"] += 1

              play_caller_available = (
                  play_caller_signal.get(
                      "available",
                      False
                  ) and
                  play_caller_signal.get("score") is not None
              )

              if play_caller_available:
                  model_component_diagnostics[
                      "play_caller_matchup"
                  ]["available"] += 1

                  model_component_diagnostics[
                      "play_caller_matchup"
                  ]["scores"].append(
                      float(
                          play_caller_signal.get("score")
                      )
                  )

              else:
                  model_component_diagnostics[
                      "play_caller_matchup"
                  ]["unavailable"] += 1

              matching_ecr = None

              for expert_ranking in (
                  expert_rankings.values()
              ):
                  if (
                      expert_ranking.get(
                          "nflverse_player_id"
                      ) == player_id
                  ):
                      matching_ecr = expert_ranking
                      break

              ecr_available = (
                  matching_ecr is not None and
                  matching_ecr.get(
                      "ecr_available",
                      False
                  )
              )

              if ecr_available:
                  model_component_diagnostics[
                      "fantasypros_ecr"
                  ]["available"] += 1

                  model_component_diagnostics[
                      "fantasypros_ecr"
                  ]["scores"].append(
                      float(
                          matching_ecr.get(
                              "ecr_score"
                          )
                      )
                  )

              else:
                  model_component_diagnostics[
                      "fantasypros_ecr"
                  ]["unavailable"] += 1

          print(
              "Final-model component diagnostics "
              f"for {len(current_player_ids)} players:"
          )

          for (
              component_name,
              diagnostic
          ) in model_component_diagnostics.items():
              component_scores = diagnostic["scores"]

              if component_scores:
                  average_score = round(
                      sum(component_scores) /
                      len(component_scores),
                      2
                  )

                  minimum_score = min(
                      component_scores
                  )

                  maximum_score = max(
                      component_scores
                  )

                  print(
                      f"{component_name}: "
                      f"{diagnostic['available']} available, "
                      f"{diagnostic['unavailable']} unavailable, "
                      f"range {minimum_score}-"
                      f"{maximum_score}, "
                      f"average {average_score}."
                  )

              else:
                  print(
                      f"{component_name}: "
                      f"{diagnostic['available']} available, "
                      f"{diagnostic['unavailable']} unavailable, "
                      "no active score distribution."
                  )          
          output = {
              "season": season_used,
              "target_week": target_week,
              "schedule_mode": (
                  "fixed_week"
                  if target_week is not None
                  else "next_opponent"
              ),
              "updated": datetime.now(
                  timezone.utc
              ).strftime("%Y-%m-%d"),
              "source": "nflverse",
              "expert_rankings_mode":
                  expert_rankings_mode,
              "expert_rankings_model_eligible":
                  expert_rankings_model_eligible,

              "players": rolling_model_rows,
              "player_lookup": {
                  player_id: {
                      "name": context.get("player_name"),
                      "team": context.get("team"),
                      "position": context.get("position"),
                      "is_rookie": context.get("is_rookie", False)
                  }
                  for player_id, context in
                  current_player_context.items()
              },
              "recent_player_performance":
                  current_recent_performance,
              "opportunity_volume":
                  current_player_opportunity,
              "red_zone_opportunity":
                  current_player_red_zone,
              "defensive_matchup":
                  current_player_defensive_matchup,
              "defense_position_allowed":
                  defense_position_allowed,
              "team_next_opponent":
                  team_next_opponent,
              "current_play_caller_signals":
                  current_play_caller_signals,
              "play_caller_matchup":
                  current_player_play_caller_matchup,
              "current_player_vs_defensive_caller":
                  current_player_vs_defensive_caller,
              "play_caller_matchups":
                  play_caller_matchups,
              "player_vs_defensive_caller":
                  player_vs_defensive_caller,
              "expert_rankings":
                  expert_rankings,
              "fantasy_ai_scores":
                  current_fantasy_ai_scores
          }
          if target_week is not None:
              output_filename = (
                  f"nfl-stats-week{target_week}-snapshot.json"
              )
          else:
              output_filename = "nfl-stats.json"

          with open(
              output_filename,
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  indent=2
              )

          print(
              f"Created {output_filename} with "
              f"{len(rows)} records "
              f"from the {season_used} season."
          )
          PY
      - name: Add current trench signals
        if: ${{ github.event.inputs.target_week == '' || github.event.inputs.target_week == null }}
        run: |
          python <<'PY'
          import csv
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from public_trench_signal import compute, stamp

          output_file = Path("nfl-stats.json")
          metrics_file = Path("trench_2026_pregame_metrics.csv")

          if not output_file.exists():
              raise RuntimeError("nfl-stats.json is missing")

          with output_file.open(encoding="utf-8") as f:
              data = json.load(f)

          signals = {}
          now = datetime.now(timezone.utc)

          if metrics_file.exists():
              with metrics_file.open(newline="") as f:
                  rows = csv.DictReader(f)

                  for row in rows:
                      team = row["offense_team"]
                      opponent = row["defense_team"]

                      if team == "LA":
                          team = "LAR"
                      if opponent == "LA":
                          opponent = "LAR"

                      matchup = data.get(
                          "team_next_opponent", {}
                      ).get(team, {})
                      if team in ("GB", "ATL"):
                          print(
                              "TRENCH DEBUG:",
                              team,
                              "CSV opponent:", opponent,
                              "CSV week:", row["week"],
                              "Expected matchup:", matchup,
                              "Published:", row["metric_published_utc"],
                              "Kickoff:", row["kickoff_utc"],
                              "Current time:", now.isoformat()
                          )

                      if matchup.get("opponent") != opponent:
                          continue

                      if int(row["week"]) != int(
                          matchup.get("week", -1)
                      ):
                          continue

                      if not (
                          stamp(row["metric_published_utc"])
                          <= now
                          < stamp(row["kickoff_utc"])
                      ):
                          continue

                      result = compute(row)

                      if result["available"]:
                          result["offense_team"] = team
                          result["defense_team"] = opponent
                          signals[team] = result

          data["current_trench_signals"] = signals

          with output_file.open("w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          print("Teams with trench signals:", sorted(signals))
          print(
              "Upcoming teams without trench signals:",
              sorted(
                  set(data.get("team_next_opponent", {}))
                  - set(signals)
              )
          )

          print(
              f"Added {len(signals)} current "
              "pregame trench signals."
          )
          PY
          
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$TARGET_WEEK" ]; then
            OUTPUT_FILE="nfl-stats-week${TARGET_WEEK}-snapshot.json"
          else
            OUTPUT_FILE="nfl-stats.json"
          fi

          git add "$OUTPUT_FILE"

          if git diff --cached --quiet; then
            echo "No stats changes to commit."
          else
            git commit -m "Update NFL player stats"
            git push
          fi
