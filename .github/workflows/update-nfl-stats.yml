                  "team_position_score"
              )

              player_score = matchup.get(
                  "player_history_score"
              )

              actual_score = matchup.get("score")

              expected_score = round(
                  (
                      team_score +
                      player_score * player_confidence
                  ) /
                  (
                      1.0 + player_confidence
                  ),
                  2
              )

              if actual_score != expected_score:
                  invalid_play_caller_blends.append(
                      (
                          player_id,
                          actual_score,
                          expected_score
                      )
                  )

              sample_bucket = min(
                  max(sample_size, 1),
                  4
              )

              play_caller_blend_sample_counts[
                  sample_bucket
              ] += 1

          if invalid_play_caller_blends:
