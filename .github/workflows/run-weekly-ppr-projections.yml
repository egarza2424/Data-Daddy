name: Run Weekly PPR Projections

on:
  push:
    branches: [main]
    paths:
      - "data/verified_injury_outs.json"
      - "data/starter_absence_opportunities.json"
      - "scripts/build_weekly_ppr_projections.py"
  schedule:
    # Hourly injury-feed refresh and projection recalculation, all week.
    - cron: "0 * * * *"
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Pregame Model Snapshot"
    types:
      - completed

permissions:
  contents: write

jobs:
  project:
    if: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install projection packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Check projection scripts
        run: |
          python -m py_compile scripts/build_live_rb_j2_features.py scripts/build_rb_returning_player_audit.py scripts/build_week7_rb_j2_experiment.py scripts/build_weekly_ppr_projections.py scripts/audit_te_ppg_challenger.py

      - name: Refresh current player injury availability from Sleeper
        run: |
          python -m py_compile scripts/build_gameday_availability.py
          python scripts/build_gameday_availability.py

      - name: Generate Week 7 J2 RB projections
        run: |
          python scripts/build_live_rb_j2_features.py
          python scripts/build_rb_returning_player_audit.py
          python scripts/build_week7_rb_j2_experiment.py

      - name: Collect injury opportunity evidence from 2026 weekly stats
        run: |
          python -m py_compile scripts/build_starter_absence_evidence.py
          mkdir -p historical-data
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2026.csv \
            -o historical-data/player_stats_2026.csv
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_2026.csv.gz \
            -o historical-data/play_by_play_2026.csv.gz
          python scripts/build_starter_absence_evidence.py \
            --stats historical-data/player_stats_2026.csv \
            --pbp historical-data/play_by_play_2026.csv.gz \
            --season 2026 --week 7 \
            --output projection-model/validation/starter-absence-evidence.csv

      - name: Backtest historical RB absence carry retention
        run: |
          python -m py_compile scripts/backtest_rb_absence_carry_retention.py
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2025.csv \
            -o historical-data/player_stats_2025.csv
          for season in 2023 2024 2025; do
            if [ "$season" != "2025" ]; then
              curl --fail --location --retry 3 --max-time 120 \
                "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_${season}.csv" \
                -o "historical-data/player_stats_${season}.csv"
            fi
            python scripts/backtest_rb_absence_carry_retention.py \
              --stats "historical-data/player_stats_${season}.csv" \
              --season "$season" \
              --output "projection-model/validation/${season}-rb-absence-retention-backtest.csv"
          done

      - name: Run weekly PPR projection model
        run: |
          python scripts/build_weekly_ppr_projections.py

      - name: Guard AI Score consistency across website sections
        run: python scripts/test_ai_score_display_consistency.py

      - name: Validate projection output
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          import pandas as pd


          files = list(
              Path("projection-model").glob(
                  "2026-week*-ppr-projections.csv"
              )
          )

          if not files:
              raise SystemExit(
                  "No weekly PPR projection file was created."
              )


          def get_week(path):
              match = re.search(
                  r"2026-week(\d+)-ppr-projections\.csv$",
                  path.name,
              )

              if not match:
                  return -1

              return int(match.group(1))


          projection_path = max(
              files,
              key=get_week,
          )

          week = get_week(
              projection_path
          )

          if week <= 0:
              raise SystemExit(
                  "Could not determine projection week."
              )

          coefficient_path = Path(
              "projection-model"
          ) / (
              f"2026-week{week}-"
              "ppr-model-coefficients.csv"
          )

          if not coefficient_path.exists():
              raise SystemExit(
                  "Coefficient audit file was not created: "
                  f"{coefficient_path}"
              )

          projections = pd.read_csv(
              projection_path
          )

          coefficients = pd.read_csv(
              coefficient_path
          )

          required_projection_columns = {
              "snapshot_week",
              "player_id",
              "player_name",
              "position",
              "team",
              "opponent",
              "model_score",
              "position_rank",
              "projected_ppr",
              "projected_position_rank",
              "opportunity_score",
              "production_score",
              "usage_score",
              "redzone_score",
              "model_confidence_score",
              "matchup_score",
              "scoring_environment_score",
              "projection_model",
              "projection_training_season",
          }

          missing = sorted(
              required_projection_columns
              - set(projections.columns)
          )

          if missing:
              raise SystemExit(
                  "Projection file is missing columns: "
                  + ", ".join(missing)
              )

          required_coefficient_columns = {
              "position",
              "feature",
              "coefficient",
              "training_rows",
          }

          missing_coefficients = sorted(
              required_coefficient_columns
              - set(coefficients.columns)
          )

          if missing_coefficients:
              raise SystemExit(
                  "Coefficient file is missing columns: "
                  + ", ".join(
                      missing_coefficients
                  )
              )

          if projections.empty:
              raise SystemExit(
                  "Projection output is empty."
              )

          positions = set(
              projections[
                  "position"
              ]
              .astype(str)
              .str.upper()
          )

          expected_positions = {
              "QB",
              "RB",
              "WR",
              "TE",
          }

          if positions != expected_positions:
              raise SystemExit(
                  "Projection positions are incorrect. "
                  f"Found: {sorted(positions)}"
              )

          snapshot_weeks = set(
              pd.to_numeric(
                  projections[
                      "snapshot_week"
                  ],
                  errors="coerce",
              )
              .dropna()
              .astype(int)
          )

          if snapshot_weeks != {week}:
              raise SystemExit(
                  "Projection snapshot_week values "
                  f"do not equal Week {week}: "
                  f"{sorted(snapshot_weeks)}"
              )

          if (
              projections[
                  "projected_ppr"
              ].isna().any()
          ):
              raise SystemExit(
                  "projected_ppr contains missing values."
              )

          if (
              projections[
                  "projected_ppr"
              ] < 0
          ).any():
              raise SystemExit(
                  "projected_ppr contains negative values."
              )

          if (
              projections[
                  "projected_position_rank"
              ].isna().any()
          ):
              raise SystemExit(
                  "Projected ranks contain missing values."
              )

          models = set(
              projections[
                  "projection_model"
              ].astype(str)
          )

          allowed_models = {
              "F_position_specific",
              "J2_RB_role_stability",
              "F_TE_50pct_prior_PPG",
              "F_WR_50pct_prior_PPG",
              "Manual_Week7_RB_override",
              "Editorial_Week7_WR_team_total_adjusted",
              "Editorial_Week7_TE_role_matchup_adjusted",
              "StarterAbsence_TE_target_shrinkage_Week7",
              "WarrenOut_WR_target_share_shrinkage_Week7",
              "StarterAbsence_WR_target_share_shrinkage",
              "StarterAbsence_RB_50pct_carry_retention_Week7",
          }

          if not models.issubset(allowed_models):
              raise SystemExit(
                  "Unexpected projection model: "
                  f"{sorted(models)}"
              )

          if not (
              projections.loc[
                  projections["position"].eq("QB"),
                  "projection_model",
              ] == "F_position_specific"
          ).all():
              raise SystemExit(
                  "QB projections must remain Model F."
              )

          wr_models = set(
              projections.loc[
                  projections["position"].eq("WR"),
                  "projection_model",
              ].astype(str)
          )
          if not wr_models.issubset({
              "F_position_specific",
              "F_WR_50pct_prior_PPG",
              "Editorial_Week7_WR_team_total_adjusted",
              "WarrenOut_WR_target_share_shrinkage_Week7",
              "StarterAbsence_WR_target_share_shrinkage",
          }):
              raise SystemExit(
                  "Unexpected WR projection models: "
                  f"{sorted(wr_models)}"
              )
          if (
              projections.loc[
                  ~projections["position"].eq("WR"),
                  "projection_model",
              ].eq("F_WR_50pct_prior_PPG").any()
          ):
              raise SystemExit(
                  "WR PPG blend label assigned to non-WR player."
              )

          if week == 7:
              editorial = projections.loc[
                  projections["projection_model"].eq(
                      "Editorial_Week7_WR_team_total_adjusted"
                  )
              ]
              # Official OUT players may vacate curated positions; available
              # model-ranked receivers fill those positions without pretending
              # they received an editorial PPR override.
              if not (1 <= len(editorial) <= 24) or not editorial["position"].eq("WR").all():
                  raise SystemExit("Invalid Week 7 available editorial WR board.")
              if projections["player_name"].eq("Mike Evans").any():
                  raise SystemExit("Mike Evans must be excluded for Week 7.")
              board = editorial.sort_values("projected_position_rank")
              if board["projected_position_rank"].astype(int).tolist() != list(range(1, len(board) + 1)):
                  raise SystemExit("Available editorial WR ranks must be contiguous.")
              if not board["projected_ppr"].is_monotonic_decreasing:
                  raise SystemExit("Editorial WR PPR must descend by rank.")
              wr_top24 = projections.loc[
                  projections["position"].eq("WR")
              ].sort_values("projected_position_rank").head(24)
              if wr_top24["projected_position_rank"].astype(int).tolist() != list(range(1, 25)):
                  raise SystemExit("Week 7 available WR Top 24 must remain contiguous.")
              import json
              from pathlib import Path
              verified_outs = json.loads(Path("data/verified_injury_outs.json").read_text())
              for item in verified_outs["out"]:
                  if item["season"] == 2026 and item["week"] == 7:
                      if projections["player_id"].astype(str).eq(str(item["player_id"])).any():
                          raise SystemExit("Officially OUT player still projected: " + item["player_name"])

          if week == 7:
              te_editorial = projections.loc[
                  projections["projection_model"].eq(
                      "Editorial_Week7_TE_role_matchup_adjusted"
                  )
              ]
              expected_te = {
                  "Mark Andrews": (15, 9.40),
                  "Michael Mayer": (17, 9.20),
                  "Juwan Johnson": (18, 9.12),
              }
              if len(te_editorial) != 3 or not te_editorial["position"].eq("TE").all():
                  raise SystemExit("Expected three Week 7 TE editorial overrides.")
              for name, (rank, ppr) in expected_te.items():
                  match = te_editorial.loc[te_editorial["player_name"].eq(name)]
                  if len(match) != 1 or abs(float(match.iloc[0]["projected_ppr"]) - ppr) > 0.001:
                      raise SystemExit(f"Week 7 TE editorial mismatch: {name}")
              # Analyst adjustments can legitimately move an editorial TE's rank.
              # Preserve editorial PPR values, but verify ranks are contiguous instead
              # of enforcing stale fixed rank numbers.
              te_ranks = sorted(projections.loc[projections["position"].eq("TE"), "projected_position_rank"].astype(int).tolist())
              if te_ranks != list(range(1, len(te_ranks) + 1)):
                  raise SystemExit("Week 7 TE projected ranks must be contiguous.")

          coefficient_positions = set(
              coefficients[
                  "position"
              ]
              .astype(str)
              .str.upper()
          )

          if (
              coefficient_positions
              != expected_positions
          ):
              raise SystemExit(
                  "Coefficient positions are incorrect: "
                  f"{sorted(coefficient_positions)}"
              )

          expected_features = {
              "QB": {
                  "intercept",
                  "opportunity_score",
                  "production_score",
                  "usage_score",
                  "redzone_score",
                  "model_confidence_score",
                  "matchup_score",
              },
              "RB": {
                  "intercept",
                  "opportunity_score",
                  "production_score",
                  "usage_score",
                  "redzone_score",
                  "model_confidence_score",
              },
              "WR": {
                  "intercept",
                  "opportunity_score",
                  "production_score",
                  "usage_score",
                  "redzone_score",
                  "model_confidence_score",
              },
              "TE": {
                  "intercept",
                  "opportunity_score",
                  "production_score",
                  "usage_score",
                  "redzone_score",
                  "model_confidence_score",
                  "matchup_score",
                  "scoring_environment_score",
              },
          }

          for position, expected in (
              expected_features.items()
          ):
              actual = set(
                  coefficients.loc[
                      coefficients[
                          "position"
                      ].astype(str).str.upper()
                      == position,
                      "feature",
                  ].astype(str)
              )

              if actual != expected:
                  raise SystemExit(
                      f"{position} coefficient "
                      "features are incorrect. "
                      f"Found: {sorted(actual)}"
                  )

          print()
          print(
              "Weekly PPR projection validation passed."
          )

          print(
              f"Projection file: {projection_path}"
          )

          print(
              f"Coefficient file: {coefficient_path}"
          )

          print(
              f"Projection rows: {len(projections)}"
          )

          print()
          print("Rows by position:")

          print(
              projections[
                  "position"
              ]
              .value_counts()
              .sort_index()
              .to_string()
          )

          print()
          print("Projected PPR summary:")

          print(
              projections.groupby(
                  "position"
              )["projected_ppr"]
              .agg(
                  [
                      "count",
                      "mean",
                      "min",
                      "max",
                  ]
              )
              .round(2)
              .to_string()
          )
          PY

      - name: Commit weekly PPR projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add projection-model/
          git add data/gameday_availability.json
          git add -f projection-model/validation/*-analyst-adjustments-audit.csv 2>/dev/null || true
          git add -f projection-model/validation/starter-absence-evidence.csv 2>/dev/null || true
          git add -f projection-model/validation/2026-week7-rb-injury-rushing-scenarios.csv 2>/dev/null || true
          git add -f projection-model/validation/2025-rb-absence-retention-backtest.csv 2>/dev/null || true
          git add -f projection-model/validation/2023-rb-absence-retention-backtest.csv 2>/dev/null || true
          git add -f projection-model/validation/2024-rb-absence-retention-backtest.csv 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No projection changes to commit."
            exit 0
          fi

          git commit -m "Update weekly PPR projections"
          # Concurrent runs and code commits can advance main during this job.
          # Replay this generated-output commit on the latest main, then push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              echo "Generated projection files conflict with newer main; stopping safely."
              exit 1
            }
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced during push; retrying ($attempt/5)."
            sleep 2
          done
          echo "Could not publish projections after 5 attempts."
          exit 1
