
name: Build Weighted Red-Zone Feed

on:
  workflow_dispatch:
    inputs:
      target_week:
        description: "2026 target week (only earlier games used)"
        required: true
        default: "6"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download 2026 play-by-play
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/play_by_play_2026.csv.gz \
            https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_2026.csv.gz

      - name: Generate weighted red-zone evidence
        run: |
          python scripts/build_rb_goal_line_feed.py \
            --pbp /tmp/play_by_play_2026.csv.gz \
            --stats nfl-stats.json \
            --target-week "${{ inputs.target_week }}" \
            --output "data/red_zone_usage_2026_week${{ inputs.target_week }}.json"

      - name: Upload red-zone artifact
        uses: actions/upload-artifact@v4
        with:
          name: weighted-red-zone-week${{ inputs.target_week }}
          path: data/red_zone_usage_2026_week${{ inputs.target_week }}.json

      - name: Commit generated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "data/red_zone_usage_2026_week${{ inputs.target_week }}.json"

          if ! git diff --cached --quiet; then
            git commit -m "Update Week ${{ inputs.target_week }} weighted red-zone feed"
            git push
          fi
