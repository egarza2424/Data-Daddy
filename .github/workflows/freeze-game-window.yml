name: Freeze Game-Time AI and PPR Predictions

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Run pregame checks without creating or publishing game locks'
        type: boolean
        default: true
  schedule:
    # Every 5 minutes; the script only captures games 90-60 minutes from kickoff.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: game-time-prediction-locks
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh authoritative schedule
        run: python scripts/fetch_nfl_schedule.py
      - name: Check for games inside capture window
        id: window
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          schedule = json.loads(Path("data/nfl_schedule_2026.json").read_text())
          now = datetime.now(timezone.utc)
          eligible = False
          for game in schedule["games"]:
              if str(game.get("season")) not in ("", "2026"):
                  continue
              day, clock = str(game.get("gameday") or ""), str(game.get("gametime") or "")
              if not day or not clock:
                  continue
              if len(clock.split(":")) == 2:
                  clock += ":00"
              kickoff = datetime.fromisoformat(f"{day}T{clock}").replace(
                  tzinfo=ZoneInfo("America/New_York")).astimezone(timezone.utc)
              if timedelta(minutes=60) <= kickoff - now <= timedelta(minutes=90):
                  eligible = True
                  break
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("eligible=" + str(eligible).lower() + "\n")
          print("Game in freeze window:", eligible)
          PY
      - name: Refresh injury availability before game lock
        if: (steps.window.outputs.eligible == 'true' || inputs.validate_only == true)
        run: python scripts/build_gameday_availability.py
      - name: Install projection model dependencies
        if: (steps.window.outputs.eligible == 'true' || inputs.validate_only == true)
        run: python -m pip install pandas numpy
      - name: Verify upcoming-game injury inputs match fresh feed
        if: (steps.window.outputs.eligible == 'true' || inputs.validate_only == true)
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo
          feed = json.loads(Path("data/gameday_availability.json").read_text())
          schedule = json.loads(Path("data/nfl_schedule_2026.json").read_text())
          now = datetime.now(timezone.utc)
          teams = set()
          for g in schedule["games"]:
              day, clock = g.get("gameday"), g.get("gametime")
              if not day or not clock or int(g.get("season", 2026)) != 2026:
                  continue
              kickoff = datetime.fromisoformat(day + "T" + clock).replace(
                  tzinfo=ZoneInfo("America/New_York")).astimezone(timezone.utc)
              if timedelta(minutes=55) <= kickoff - now <= timedelta(minutes=95):
                  teams.update((g["home_team"], g["away_team"]))
          aliases = {"LAR": "LA", "JAC": "JAX", "WSH": "WAS"}
          norm = lambda x: aliases.get(str(x or "").upper(), str(x or "").upper())
          teams = {norm(t) for t in teams}
          players = feed.get("players", {})
          directory = {(norm(p.get("team")), str(p.get("position") or "").upper(),
                        str(p.get("name") or "").strip().casefold()): p
                       for p in players.values() if isinstance(p, dict)}
          with Path("projection-model/current-live-model-snapshot.csv").open(newline="") as fp:
              rows = list(csv.DictReader(fp))
          if not rows or not {"team", "position", "player_name", "injury_status", "roster_status"}.issubset(rows[0]):
              raise SystemExit("Missing model injury status columns")
          checked = 0
          differences = []
          for row in rows:
              if norm(row["team"]) not in teams:
                  continue
              key = (norm(row["team"]), row["position"].upper(),
                     row["player_name"].strip().casefold())
              fresh = directory.get(key)
              if fresh is None:
                  continue
              checked += 1
              for field in ("injury_status", "roster_status"):
                  if str(row.get(field) or "").upper() != str(fresh.get(field) or "").upper():
                      differences.append((row["player_name"], field))
          if not teams:
              print('No kickoff teams currently eligible; matchup injury comparison not applicable')
          elif checked == 0 or differences:
              raise SystemExit(f"Model injury input sync failed: checked={checked}, mismatches={differences[:10]}")
          print(f"Checked {checked} live model injury statuses against fresh feed")
          PY
      - name: Rebuild predictions after injury refresh
        if: (steps.window.outputs.eligible == 'true' || inputs.validate_only == true)
        run: |
          python scripts/build_weekly_ppr_projections.py
      - name: Test production injury uplift code with controlled fixture
        if: (steps.window.outputs.eligible == 'true' || inputs.validate_only == true)
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path("scripts/build_weekly_ppr_projections.py").read_text()
          tree = ast.parse(source)
          formula = None
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign) and any(
                  isinstance(t, ast.Name) and t.id == "uplift" for t in node.targets
              ):
                  segment = ast.get_source_segment(source, node.value)
                  if segment and "absent / before" in segment:
                      formula = compile(ast.Expression(node.value), "<production-injury-uplift>", "eval")
                      break
          if formula is None:
              raise SystemExit("Production injury uplift expression not found")
          def project(base, before, absent, evidence_weight):
              weight = min(0.5, max(0.0, evidence_weight))
              uplift = eval(formula, {"__builtins__": {}}, {
                  "min": min, "max": max, "weight": weight,
                  "absent": absent, "before": before
              })
              return round(base * (1 + uplift), 2)
          assert project(10.0, 15.0, 21.0, 0.35) == 11.40
          assert project(10.0, 15.0, 15.0, 0.35) == 10.0
          assert project(10.0, 10.0, 30.0, 0.5) == 11.5
          assert project(10.0, 20.0, 10.0, 0.35) == 10.0
          print("PASS: four scenarios evaluated against actual production uplift expression")
          PY
      - name: Audit starter-absence projection boosts
        if: (steps.window.outputs.eligible == 'true' || inputs.validate_only == true)
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          source = Path("projection-model")
          files = sorted(source.glob("2026-week*-ppr-projections.csv"), key=lambda p: p.stat().st_mtime, reverse=True)
          if not files:
              raise SystemExit("No rebuilt projection output")
          config_path = Path("data/starter_absence_opportunities.json")
          if not config_path.exists():
              print("No starter-absence configuration")
              raise SystemExit(0)
          config = json.loads(config_path.read_text())
          with files[0].open(newline="") as stream:
              rows = list(csv.DictReader(stream))
          if not rows:
              raise SystemExit("Empty projection output")
          week = int(rows[0]["snapshot_week"])
          ids = {str(r["player_id"]): r for r in rows}
          verified_path = Path("data/verified_injury_outs.json")
          verified = json.loads(verified_path.read_text()) if verified_path.exists() else {}
          out = {str(x["player_id"]) for x in verified.get("out", [])
                 if x.get("week") == week and x.get("season") == 2026}
          checked = 0
          for case in config.get("cases", []):
              if case.get("season") != 2026 or case.get("week") != week:
                  continue
              starter = str(case["starter_player_id"])
              if starter not in out or starter in ids:
                  continue
              for benefit in case.get("beneficiaries", []):
                  row = ids.get(str(benefit["player_id"]))
                  if not row:
                      continue
                  checked += 1
                  if row.get("projection_model") != "StarterAbsence_WR_target_share_shrinkage":
                      raise SystemExit("Starter-absence projection not applied: " + row["player_name"])
          print("Validated active starter-absence adjustments:", checked)
          PY
      - name: Enforce real injury audit on capture runs
        if: steps.window.outputs.eligible == 'true' && inputs.validate_only != true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cases = json.loads(Path("data/starter_absence_opportunities.json").read_text()).get("cases", [])
          if not cases:
              print("No evidence-backed starter-absence cases: no opportunity boosts can be claimed")
          else:
              print("Configured starter-absence cases:", len(cases))
          PY
      - name: Verify injury opportunity scenario configuration
        if: (steps.window.outputs.eligible == 'true' || inputs.validate_only == true)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("data/starter_absence_opportunities.json").read_text())
          cases = config.get("cases", [])
          print("Evidence-backed starter absence cases:", len(cases))
          for case in cases:
              print("Case:", case.get("week"), case.get("starter_player_id"),
                    "beneficiaries:", len(case.get("beneficiaries", [])))
          if not cases:
              print("WARNING: No configured starter-absence scenarios exist; opportunity uplift has not been validated")
          PY
      - name: Confirm live model inputs are current
        if: (steps.window.outputs.eligible == 'true' || inputs.validate_only == true)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          feed = json.loads(Path("data/gameday_availability.json").read_text())
          updated = datetime.fromisoformat(feed["generated_at_utc"].replace("Z", "+00:00"))
          age = (datetime.now(timezone.utc) - updated).total_seconds() / 60
          if not 0 <= age <= 30:
              raise SystemExit("Fresh injury data unavailable; game lock blocked")
          source = Path("projection-model/current-live-model-snapshot.csv")
          if not source.exists():
              raise SystemExit("Missing live model inputs; game lock blocked")
          print("Feed freshness verified; model feature synchronization still requires validation")
          PY
      - name: Freeze eligible games
        if: steps.window.outputs.eligible == 'true'
        run: python scripts/freeze_game_window.py
      - name: Commit immutable game locks
        if: steps.window.outputs.eligible == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model-snapshots/game-locks/
          if git diff --cached --quiet; then
            echo "No games in capture window."
            exit 0
          fi
          git commit -m "Freeze game-time AI and PPR predictions"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
