name: Validate TE PPG Heldout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas
      - name: Run heldout TE audit
        run: python scripts/validate_te_ppg_heldout.py
      - uses: actions/upload-artifact@v4
        with:
          name: 2025-te-ppg-heldout-validation
          path: projection-model/validation/2025-te-ppg-heldout-validation.csv
