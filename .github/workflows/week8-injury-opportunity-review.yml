name: Week 8 Injury Opportunity Review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Washington injury opportunity review
        run: python scripts/build_week8_injury_opportunity_review.py
      - name: Upload review-only CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week8-washington-injury-opportunity-review
          path: projection-model/validation/2026-week8-injury-opportunity-signal-review.csv
          if-no-files-found: warn
