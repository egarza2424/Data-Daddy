name: RB Conditional Opportunity Validation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas scipy
      - name: Download frozen upstream trend results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p projection-model/validation
          gh run list --workflow rb-opportunity-trends-validation.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' > /tmp/upstream_run
          RUN_ID=$(cat /tmp/upstream_run)
          test -n "$RUN_ID"
          gh run download "$RUN_ID" -n rb-opportunity-trends-validation-2023-2025 -D projection-model/validation
      - name: Evaluate conditional opportunity adjustment
        run: python scripts/validate_rb_conditional_opportunity.py
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: rb-conditional-opportunity-results
          path: |
            projection-model/validation/rb-conditional-opportunity-*.csv
          if-no-files-found: error
