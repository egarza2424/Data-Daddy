name: Weekly PPR Validation

on:
  workflow_dispatch:

  schedule:
    - cron: "0 22 * * 2"
    - cron: "0 1 * * 3"
    - cron: "0 4 * * 3"

permissions:
  contents: write

jobs:
  validate-ppr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout private historical audits
        uses: actions/checkout@v4
        with:
          repository: egarza2424/Data-Daddy-Private-Audits
          token: ${{ secrets.PRIVATE_AUDIT_TOKEN }}
          path: private-audits
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy

      - name: Validate latest Model F projections
        run: |
          python <<'PY'
          import io
          import re
          import urllib.request
          from pathlib import Path

          import numpy as np
          import pandas as pd
          from scipy.stats import pearsonr, spearmanr


          # -----------------------------------------
          # Find newest weekly Model F projection
          # -----------------------------------------

          projection_dir = Path(
              "projection-model"
          )

          projection_files = list(
              projection_dir.glob(
                  "2026-week*-ppr-projections.csv"
              )
          )

          if not projection_files:
              raise SystemExit(
                  "No 2026 weekly PPR projection "
                  "files were found."
              )


          def get_week(path):
              match = re.search(
                  r"2026-week(\d+)"
                  r"-ppr-projections\.csv$",
                  path.name
              )

              if match is None:
                  return None

              return int(match.group(1))


          week_files = []

          for path in projection_files:
              week = get_week(path)

              if week is not None:
                  week_files.append(
                      (week, path)
                  )

          if not week_files:
              raise SystemExit(
                  "Could not determine a week from "
                  "the PPR projection filenames."
              )

          # Choose the latest week with available actual statistics
          # after downloading the nflverse weekly dataset.
          target_week = None
          projection_path = None


          # -----------------------------------------
          # Required columns for the frozen projections
          # -----------------------------------------

          required_projection_columns = [
              "player_id",
              "player_name",
              "position",
              "projected_ppr",
              "projected_position_rank",
          ]

          # -----------------------------------------
          # Download actual 2026 NFL statistics
          # -----------------------------------------

          stats_url = (
              "https://github.com/"
              "nflverse/nflverse-data/"
              "releases/download/stats_player/"
              "stats_player_week_2026.csv"
          )

          print(
              "Downloading actual 2026 "
              "player statistics."
          )

          try:
              with urllib.request.urlopen(
                  stats_url,
                  timeout=120
              ) as response:
                  stats_content = (
                      response
                      .read()
                      .decode("utf-8")
                  )

          except Exception as error:
              raise SystemExit(
                  "Could not download 2026 "
                  "player stats: "
                  f"{error}"
              )

          weekly = pd.read_csv(
              io.StringIO(stats_content),
              low_memory=False
          )


          # -----------------------------------------
          # Verify target week is available
          # -----------------------------------------

          weekly["week"] = pd.to_numeric(
              weekly["week"],
              errors="coerce"
          )

          regular_mask = (
              weekly["season_type"]
              .fillna("REG")
              .astype(str)
              .isin(["REG", ""])
          )

          available_weeks = sorted(
              weekly.loc[
                  regular_mask,
                  "week"
              ]
              .dropna()
              .astype(int)
              .unique()
              .tolist()
          )

          print(
              "Available 2026 regular-season "
              f"weeks: {available_weeks}"
          )

          eligible_weeks = [
              (week, path)
              for week, path in week_files
              if week in available_weeks
          ]

          if not eligible_weeks:
              print(
                  "No completed week has a frozen "
                  "Model F projection file yet."
              )
              raise SystemExit(0)

          target_week, projection_path = max(
              eligible_weeks,
              key=lambda item: item[0]
          )

          print(f"Using projections: {projection_path}")
          print(f"Validating NFL Week {target_week}")

          # Load the chosen frozen projections after week selection.
          predictions = pd.read_csv(projection_path)
          missing = [
              col for col in required_projection_columns
              if col not in predictions.columns
          ]
          if missing:
              raise SystemExit(
                  "Projection file missing columns: "
                  + ", ".join(missing)
              )
          predictions["player_id"] = (
              predictions["player_id"].astype(str)
              .str.replace(r"\.0$", "", regex=True).str.strip()
          )
          predictions["position"] = (
              predictions["position"].astype(str).str.upper().str.strip()
          )
          predictions = predictions[
              predictions["position"].isin(["QB", "RB", "WR", "TE"])
          ].copy()
          predictions["projected_ppr"] = pd.to_numeric(
              predictions["projected_ppr"], errors="coerce"
          )
          predictions["projected_position_rank"] = pd.to_numeric(
              predictions["projected_position_rank"], errors="coerce"
          )
          if predictions[[
              "projected_ppr", "projected_position_rank"
          ]].isna().any().any():
              raise SystemExit("Invalid projection values or ranks.")
          predictions["projected_position_rank"] = (
              predictions["projected_position_rank"].astype(int)
          )


          # -----------------------------------------
          # Build actual PPR
          # -----------------------------------------

          actual = weekly[
              weekly["week"].eq(
                  target_week
              )
          ].copy()

          actual = actual[
              actual["season_type"]
              .fillna("REG")
              .astype(str)
              .isin(["REG", ""])
          ].copy()

          actual["position"] = (
              actual["position"]
              .astype(str)
              .str.upper()
              .str.strip()
          )

          actual = actual[
              actual["position"].isin(
                  ["QB", "RB", "WR", "TE"]
              )
          ].copy()

          actual["player_id"] = (
              actual["player_id"]
              .astype(str)
              .str.replace(
                  r"\.0$",
                  "",
                  regex=True
              )
              .str.strip()
          )

          interception_candidates = [
              "interceptions",
              "passing_interceptions",
          ]

          interception_column = next(
              (
                  column
                  for column
                  in interception_candidates
                  if column in actual.columns
              ),
              None
          )

          if interception_column is None:
              raise SystemExit(
                  "Could not locate an "
                  "interception column."
              )

          actual["interceptions"] = (
              actual[interception_column]
          )

          stat_columns = [
              "passing_yards",
              "passing_tds",
              "interceptions",
              "rushing_yards",
              "rushing_tds",
              "receptions",
              "receiving_yards",
              "receiving_tds",
          ]

          missing_stats = [
              column
              for column in stat_columns
              if column not in actual.columns
          ]

          if missing_stats:
              raise SystemExit(
                  "Actual stats are missing: "
                  + ", ".join(missing_stats)
              )

          for column in stat_columns:
              actual[column] = (
                  pd.to_numeric(
                      actual[column],
                      errors="coerce"
                  )
                  .fillna(0.0)
              )

          actual["actual_ppr"] = (
              actual["passing_yards"] / 25.0
              + actual["passing_tds"] * 4.0
              - actual["interceptions"] * 2.0
              + actual["rushing_yards"] / 10.0
              + actual["rushing_tds"] * 6.0
              + actual["receptions"]
              + actual["receiving_yards"] / 10.0
              + actual["receiving_tds"] * 6.0
          )

          actual = (
              actual
              .sort_values(
                  "actual_ppr",
                  ascending=False
              )
              .drop_duplicates(
                  subset=["player_id"],
                  keep="first"
              )
          )


          # -----------------------------------------
          # Resolve player identity safely
          # -----------------------------------------
          # Data Daddy uses a different numeric player ID namespace
          # than nflverse (GSIS IDs). Match full display name +
          # position, only when unique on BOTH sides.
          import unicodedata

          def name_key(value):
              value = unicodedata.normalize("NFKD", str(value))
              value = "".join(
                  char for char in value
                  if not unicodedata.combining(char)
              )
              value = re.sub(r"[^a-z0-9 ]", " ", value.lower())
              value = re.sub(
                  r"\b(jr|sr|ii|iii|iv|v)\b", "", value
              )
              return " ".join(value.split())

          display_col = next(
              (col for col in [
                  "player_display_name", "player_name"
              ] if col in actual.columns),
              None
          )
          if display_col is None:
              raise SystemExit(
                  "Actual stats have no player name column."
              )

          predictions["match_name"] = (
              predictions["player_name"].map(name_key)
          )
          actual["match_name"] = (
              actual[display_col].map(name_key)
          )

          # Only allow unambiguous player/position matches.
          match_cols = ["match_name", "position"]
          pred_counts = predictions.groupby(
              match_cols
          )["player_id"].transform("size")
          actual_counts = actual.groupby(
              match_cols
          )["player_id"].transform("size")
          eligible_pred = predictions.loc[
              pred_counts.eq(1)
          ].copy()
          eligible_actual = actual.loc[
              actual_counts.eq(1),
              match_cols + ["actual_ppr"]
          ].copy()

          report = eligible_pred.merge(
              eligible_actual,
              on=match_cols,
              how="left",
              validate="one_to_one"
          )
          report["match_method"] = "unique_name_position"

          matched = int(
              report["actual_ppr"]
              .notna()
              .sum()
          )

          unmatched = int(
              report["actual_ppr"]
              .isna()
              .sum()
          )

          print(
              f"Matched projection players: "
              f"{matched}"
          )

          print(
              f"Players without Week "
              f"{target_week} stats: "
              f"{unmatched}"
          )

          ambiguous = len(predictions) - len(eligible_pred)
          print(f"Ambiguous projection identities: {ambiguous}")
          print(
              f"Matched coverage: {matched}/{len(predictions)} "
              "frozen projection players"
          )
          # An absent stats row is UNKNOWN, not proof of zero PPR.
          # Report accuracy only for verified, uniquely matched players.
          report = report.loc[
              report["actual_ppr"].notna()
          ].copy()
          if matched < 25:
              raise SystemExit(
                  "Validation blocked: fewer than 25 "
                  "verified player matches."
              )
          # -----------------------------------------
          # Independent AI Score vs PPR top-N audit
          # -----------------------------------------
          top_n_by_position = {
              "QB": 24,
              "RB": 36,
              "WR": 36,
              "TE": 24,
          }

          ranking_rows = []

          for position, top_n in top_n_by_position.items():
              eligible = eligible_pred.loc[
                  eligible_pred["position"].eq(position)
              ].copy()

              verified = report.loc[
                  report["position"].eq(position)
              ].copy()

              actual_top_ids = set(
                  verified.nlargest(
                      top_n, "actual_ppr"
                  )["player_id"].astype(str)
              )

              for method, score_column in [
                  ("AI Score", "model_score"),
                  ("Projected PPR", "projected_ppr"),
              ]:
                  selected = eligible.sort_values(
                      [score_column, "player_id"],
                      ascending=[False, True]
                  ).head(top_n).copy()

                  selected = selected.merge(
                      verified[["player_id", "actual_ppr"]],
                      on="player_id",
                      how="left",
                      validate="one_to_one"
                  )

                  verified_selected = selected.loc[
                      selected["actual_ppr"].notna()
                  ]

                  hits = len(
                      set(
                          verified_selected["player_id"].astype(str)
                      ) & actual_top_ids
                  )

                  ranking_rows.append({
                      "week": target_week,
                      "position": position,
                      "method": method,
                      "top_n": top_n,
                      "selected_players": len(selected),
                      "verified_players": len(verified_selected),
                      "unverified_players": int(
                          selected["actual_ppr"].isna().sum()
                      ),
                      "top_n_hits": hits,
                      "hit_rate_pct": round(
                          100 * hits / top_n, 1
                      ),
                      "verification_coverage_pct": round(
                          100 * len(verified_selected)
                          / len(selected), 1
                      ) if len(selected) else 0,
                  })

          ranking_comparison = pd.DataFrame(ranking_rows)

          print()
          print("AI SCORE VS PROJECTED PPR TOP-N AUDIT")
          print(
              ranking_comparison.to_string(index=False)
          )

          ranking_output_dir = Path(
              "projection-model/validation"
          )
          ranking_output_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          ranking_output_path = (
              ranking_output_dir
              / f"2026-week{target_week}-ranking-comparison.csv"
          )

          ranking_comparison.to_csv(
              ranking_output_path,
              index=False
          )

          print(
              f"Ranking comparison saved: {ranking_output_path}"
          )
          # -----------------------------------------
          # Public weekly ranking chart data
          # Aggregate results only; no player records
          # -----------------------------------------
          public_chart_dir = Path("data")
          public_chart_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          public_chart_path = (
              public_chart_dir / "weekly-ranking-accuracy.json"
          )

          public_chart = ranking_comparison[
              [
                  "week",
                  "position",
                  "method",
                  "top_n",
                  "top_n_hits",
                  "hit_rate_pct",
                  "verified_players",
                  "selected_players",
                  "verification_coverage_pct",
              ]
          ].copy()

          public_chart.insert(0, "season", 2026)

          public_chart.to_json(
              public_chart_path,
              orient="records",
              indent=2
          )

          print(
              f"Public ranking chart saved: {public_chart_path}"
          )


          # -----------------------------------------
          # Calculate errors and actual ranks
          # -----------------------------------------

          report["ppr_error"] = (
              report["projected_ppr"]
              - report["actual_ppr"]
          )

          report["absolute_ppr_error"] = (
              report["ppr_error"].abs()
          )

          report["squared_ppr_error"] = (
              report["ppr_error"] ** 2
          )

          report["actual_position_rank"] = (
              report
              .groupby("position")[
                  "actual_ppr"
              ]
              .rank(
                  method="min",
                  ascending=False
              )
              .astype(int)
          )

          report["rank_difference"] = (
              report[
                  "projected_position_rank"
              ]
              - report[
                  "actual_position_rank"
              ]
          )

          report["absolute_rank_error"] = (
              report[
                  "rank_difference"
              ].abs()
          )

          report["week"] = target_week


          # -----------------------------------------
          # Position-level metrics
          # -----------------------------------------

          summary_rows = []

          for position in [
              "QB",
              "RB",
              "WR",
              "TE",
          ]:
              group = report[
                  report["position"].eq(
                      position
                  )
              ].copy()

              if group.empty:
                  continue

              mae = float(
                  group[
                      "absolute_ppr_error"
                  ].mean()
              )

              rmse = float(
                  np.sqrt(
                      group[
                          "squared_ppr_error"
                      ].mean()
                  )
              )

              mean_error = float(
                  group["ppr_error"].mean()
              )

              rank_mae = float(
                  group[
                      "absolute_rank_error"
                  ].mean()
              )

              if (
                  len(group) >= 3
                  and group[
                      "projected_ppr"
                  ].nunique() >= 2
                  and group[
                      "actual_ppr"
                  ].nunique() >= 2
              ):
                  pearson = pearsonr(
                      group["projected_ppr"],
                      group["actual_ppr"]
                  ).statistic

                  spearman = spearmanr(
                      group["projected_ppr"],
                      group["actual_ppr"]
                  ).statistic
              else:
                  pearson = np.nan
                  spearman = np.nan

              summary_rows.append(
                  {
                      "week": target_week,
                      "position": position,
                      "players": len(group),
                      "mae": round(mae, 3),
                      "rmse": round(rmse, 3),
                      "mean_error": round(
                          mean_error,
                          3
                      ),
                      "pearson": (
                          round(
                              float(pearson),
                              3
                          )
                          if pd.notna(pearson)
                          else None
                      ),
                      "spearman": (
                          round(
                              float(spearman),
                              3
                          )
                          if pd.notna(spearman)
                          else None
                      ),
                      "mean_absolute_rank_error":
                          round(
                              rank_mae,
                              3
                          ),
                  }
              )

          summary = pd.DataFrame(
              summary_rows
          )


          # -----------------------------------------
          # Save weekly outputs
          # -----------------------------------------

          output_dir = Path(
              "projection-model/validation"
          )

          output_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          detail_path = (
              output_dir
              / (
                  f"2026-week{target_week}"
                  "-ppr-validation.csv"
              )
          )

          summary_path = (
              output_dir
              / (
                  f"2026-week{target_week}"
                  "-ppr-summary.csv"
              )
          )

          misses_path = (
              output_dir
              / (
                  f"2026-week{target_week}"
                  "-ppr-largest-misses.csv"
              )
          )

          report.to_csv(
              detail_path,
              index=False
          )

          summary.to_csv(
              summary_path,
              index=False
          )

          misses = (
              report
              .sort_values(
                  "absolute_ppr_error",
                  ascending=False
              )
              .head(50)
          )

          misses.to_csv(
              misses_path,
              index=False
          )

          # Preserve original pregame signals alongside actual results
          # for each position's biggest over- and underprojections.
          signal_columns = [
              "opportunity_score",
              "production_score",
              "usage_score",
              "redzone_score",
              "model_confidence_score",
              "matchup_score",
              "scoring_environment_score",
          ]
          available_signals = [
              col for col in signal_columns if col in report.columns
          ]
          review_columns = [
              "week", "position", "player_name", "team", "opponent",
              "projected_ppr", "actual_ppr", "ppr_error",
              "absolute_ppr_error", "projected_position_rank",
              "actual_position_rank",
          ] + available_signals

          review_frames = []
          for position in ["QB", "RB", "WR", "TE"]:
              position_rows = report.loc[
                  report["position"].eq(position)
              ]
              for direction, condition in [
                  ("underprojected", position_rows["ppr_error"] < 0),
                  ("overprojected", position_rows["ppr_error"] > 0),
              ]:
                  selected = (
                      position_rows.loc[condition]
                      .sort_values("absolute_ppr_error", ascending=False)
                      .head(10)
                      .copy()
                  )
                  selected["miss_direction"] = direction
                  review_frames.append(selected)

          miss_review = pd.concat(
              review_frames, ignore_index=True
          )
          miss_review = miss_review[
              ["miss_direction"] + review_columns
          ]
          miss_review_path = (
              output_dir
              / f"2026-week{target_week}-ppr-signal-miss-review.csv"
          )
          miss_review.to_csv(miss_review_path, index=False)
          print(f"Pregame signal miss review: {miss_review_path}")

          # -----------------------------------------
          # Weekly audit: coverage, bias, and misses
          # -----------------------------------------
          unmatched_path = (
              output_dir
              / f"2026-week{target_week}-ppr-unmatched.csv"
          )
          unmatched_rows = predictions.merge(
              report[["player_id"]].drop_duplicates(),
              on="player_id",
              how="left",
              indicator=True
          )
          unmatched_rows = unmatched_rows.loc[
              unmatched_rows["_merge"].eq("left_only")
          ].drop(columns=["_merge"])
          unmatched_rows["review_status"] = (
              "unresolved_no_verified_weekly_stat"
          )

          # Identify duplicate projection identities separately.
          unmatched_rows["identity_count"] = (
              unmatched_rows.groupby(
                  ["match_name", "position"]
              )["player_id"].transform("size")
          )

          unmatched_rows.loc[
              unmatched_rows["identity_count"].gt(1),
              "review_status"
          ] = "ambiguous_projection_identity"

          print(
              "Unmatched identity diagnostics:"
          )
          print(
              unmatched_rows["review_status"]
              .value_counts()
              .to_string()
          )
          # Investigate missing identities without assuming zero PPR.
          actual_name_counts = (
              actual.groupby("match_name")
              .size()
          )
          actual_identity_counts = (
              actual.groupby(["match_name", "position"])
              .size()
          )

          unmatched_rows["name_in_weekly_stats"] = (
              unmatched_rows["match_name"]
              .map(actual_name_counts)
              .fillna(0)
              .astype(int)
              .gt(0)
          )

          unmatched_rows["name_position_in_weekly_stats"] = [
              actual_identity_counts.get(
                  (name, position), 0
              ) > 0
              for name, position in zip(
                  unmatched_rows["match_name"],
                  unmatched_rows["position"]
              )
          ]

          unresolved_mask = unmatched_rows[
              "review_status"
          ].eq("unresolved_no_verified_weekly_stat")

          unmatched_rows.loc[
              unresolved_mask
              & unmatched_rows["name_in_weekly_stats"]
              & ~unmatched_rows["name_position_in_weekly_stats"],
              "review_status"
          ] = "name_found_different_position"

          unmatched_rows.loc[
              unresolved_mask
              & ~unmatched_rows["name_in_weekly_stats"],
              "review_status"
          ] = "absent_from_weekly_stats"

          print("Expanded unmatched diagnostics:")
          print(
              unmatched_rows["review_status"]
              .value_counts()
              .to_string()
          )

          # Absence from weekly stats does not prove inactivity
          # or zero fantasy points.
          unmatched_rows.to_csv(unmatched_path, index=False)

          audit_rows = []
          for position in ["QB", "RB", "WR", "TE"]:
              group = report.loc[
                  report["position"].eq(position)
              ].copy()
              projected_count = int(
                  predictions["position"].eq(position).sum()
              )
              if group.empty:
                  continue
              over = group.loc[group["ppr_error"] > 0]
              under = group.loc[group["ppr_error"] < 0]
              audit_rows.append({
                  "week": target_week,
                  "position": position,
                  "projected_players": projected_count,
                  "matched_players": len(group),
                  "unmatched_players": projected_count - len(group),
                  "match_coverage_pct": round(
                      100 * len(group) / projected_count, 1
                  ) if projected_count else 0,
                  "overprojected_players": len(over),
                  "underprojected_players": len(under),
                  "exact_projection_players": int(
                      group["ppr_error"].eq(0).sum()
                  ),
                  "mean_overprojection_ppr": round(
                      float(over["ppr_error"].mean()), 3
                  ) if len(over) else None,
                  "mean_underprojection_ppr": round(
                      float(under["ppr_error"].mean()), 3
                  ) if len(under) else None,
                  "mae": round(
                      float(group["absolute_ppr_error"].mean()), 3
                  ),
                  "largest_miss_player": (
                      group.sort_values(
                          "absolute_ppr_error", ascending=False
                      ).iloc[0]["player_name"]
                  ),
                  "largest_miss_ppr": round(
                      float(group["absolute_ppr_error"].max()), 3
                  ),
              })

          audit_path = (
              output_dir
              / f"2026-week{target_week}-ppr-audit.csv"
          )
          audit = pd.DataFrame(audit_rows)
          audit.to_csv(audit_path, index=False)
          print("Weekly Model F audit:")
          print(audit.to_string(index=False))
          print(f"Unmatched review: {unmatched_path}")
          print(f"Audit report: {audit_path}")


          # -----------------------------------------
          # Build season-to-date summary
          # -----------------------------------------

          completed_files = sorted(
              output_dir.glob(
                  "2026-week*-ppr-validation.csv"
              )
          )

          expected_weeks = {
              week
              for week, path in week_files
              if week in available_weeks
          }

          available_report_weeks = {
              int(match.group(1))
              for path in completed_files
              if (match := re.fullmatch(
                  r"2026-week(\d+)-ppr-validation\.csv",
                  path.name
              ))
          }

          if not expected_weeks.issubset(
              available_report_weeks
          ):
              missing_weeks = sorted(
                  expected_weeks - available_report_weeks
              )
              print(
                  "Season summary update skipped: "
                  f"missing validation reports for {missing_weeks}. "
                  "Preserving the existing season baseline."
              )
              completed_files = []

          season_frames = []

          for path in completed_files:
              frame = pd.read_csv(path)

              # Ignore legacy reports that assigned zero to missing
              # player IDs; they are not valid model evaluations.
              if "match_method" not in frame.columns:
                  continue

              if not frame.empty:
                  season_frames.append(
                      frame
                  )

          if season_frames:
              season = pd.concat(
                  season_frames,
                  ignore_index=True
              )

              season_summary_rows = []

              for position in [
                  "QB",
                  "RB",
                  "WR",
                  "TE",
              ]:
                  group = season[
                      season["position"].eq(
                          position
                      )
                  ].copy()

                  if group.empty:
                      continue

                  mae = float(
                      group[
                          "absolute_ppr_error"
                      ].mean()
                  )

                  rmse = float(
                      np.sqrt(
                          group[
                              "squared_ppr_error"
                          ].mean()
                      )
                  )

                  mean_error = float(
                      group[
                          "ppr_error"
                      ].mean()
                  )

                  rank_mae = float(
                      group[
                          "absolute_rank_error"
                      ].mean()
                  )

                  if (
                      len(group) >= 3
                      and group[
                          "projected_ppr"
                      ].nunique() >= 2
                      and group[
                          "actual_ppr"
                      ].nunique() >= 2
                  ):
                      pearson = pearsonr(
                          group[
                              "projected_ppr"
                          ],
                          group[
                              "actual_ppr"
                          ]
                      ).statistic

                      spearman = spearmanr(
                          group[
                              "projected_ppr"
                          ],
                          group[
                              "actual_ppr"
                          ]
                      ).statistic
                  else:
                      pearson = np.nan
                      spearman = np.nan

                  season_summary_rows.append(
                      {
                          "position": position,
                          "weeks": (
                              group["week"]
                              .nunique()
                          ),
                          "players": len(group),
                          "mae": round(
                              mae,
                              3
                          ),
                          "rmse": round(
                              rmse,
                              3
                          ),
                          "mean_error": round(
                              mean_error,
                              3
                          ),
                          "pearson": (
                              round(
                                  float(pearson),
                                  3
                              )
                              if pd.notna(
                                  pearson
                              )
                              else None
                          ),
                          "spearman": (
                              round(
                                  float(spearman),
                                  3
                              )
                              if pd.notna(
                                  spearman
                              )
                              else None
                          ),
                          "mean_absolute_rank_error":
                              round(
                                  rank_mae,
                                  3
                              ),
                      }
                  )

              season_summary = pd.DataFrame(
                  season_summary_rows
              )

              season_summary_path = (
                  output_dir
                  / "2026-ppr-season-summary.csv"
              )

              season_summary.to_csv(
                  season_summary_path,
                  index=False
              )

              print()
              print(
                  "Season-to-date Model F results:"
              )

              print(
                  season_summary.to_string(
                      index=False
                  )
              )


          # -----------------------------------------
          # Console report
          # -----------------------------------------

          print()
          print(
              "================================"
          )
          print(
              f"WEEK {target_week} MODEL F RESULTS"
          )
          print(
              "================================"
          )

          print(
              summary.to_string(
                  index=False
              )
          )

          print()
          print(
              f"Detailed report: {detail_path}"
          )

          print(
              f"Summary: {summary_path}"
          )

          print(
              f"Largest misses: {misses_path}"
          )
          PY

      - name: Validate weekly reports without publishing artifacts
        run: |
          test -d projection-model/validation
          echo "Validation reports generated successfully."
      - name: Publish public ranking accuracy
        run: |
          if [ ! -f "data/weekly-ranking-accuracy.json" ]; then
            echo "No public ranking accuracy generated."
            exit 1
          fi

          if [ -z "$(git status --porcelain -- data/weekly-ranking-accuracy.json)" ]; then
            echo "Public ranking accuracy is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly-ranking-accuracy.json
          git commit -m "Update public weekly ranking accuracy"
          git push

