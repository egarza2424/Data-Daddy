
name: Refresh Game-Day Availability

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * 0,1,4,5,6"

permissions:
  contents: write

concurrency:
  group: gameday-availability
  cancel-in-progress: false

jobs:
  refresh-availability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate availability builder
        run: python -m py_compile scripts/build_gameday_availability.py

      - name: Build availability snapshot
        run: python scripts/build_gameday_availability.py

      - name: Validate generated snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/gameday_availability.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          assert data["player_count"] >= 500
          assert data["official_inactives_verified"] is False
          assert data["generated_at_utc"]
          assert data["players"]

          print(
              "Availability snapshot validated:",
              data["player_count"],
              "players"
          )
          PY

      - name: Collect NFL.com inactive observations
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          def run(*args):
              subprocess.run(["python", *args], check=True)

          run("scripts/fetch_nfl_schedule.py")

          schedule = json.loads(
              Path("data/nfl_schedule_2026.json").read_text()
          )
          now = datetime.now(timezone.utc)
          eastern = ZoneInfo("America/New_York")

          windows = set()
          for game in schedule["games"]:
              kickoff = datetime.strptime(
                  game["gameday"] + " " + game["gametime"],
                  "%Y-%m-%d %H:%M",
              ).replace(tzinfo=eastern).astimezone(timezone.utc)

              
              time_until_kickoff = kickoff - now

              if timedelta(0) < time_until_kickoff <= timedelta(hours=3):
                  windows.add((int(game["season"]), int(game["week"])))


          if not windows:
              print("No games near kickoff; skipping NFL.com collection.")
          else:
              for season, week in sorted(windows):
                  try:
                      run(
                          "scripts/discover_nfl_inactives.py",
                          "--season", str(season),
                          "--week", str(week),
                      )
                      candidates = json.loads(
                          Path("data/nfl_inactive_report_candidates.json")
                          .read_text()
                      )["candidates"]

                      if len(candidates) != 1:
                          print(
                              f"Week {week}: {len(candidates)} reports; "
                              "skipping ambiguous or missing report."
                          )
                          continue

                      run(
                          "scripts/extract_nfl_inactives.py",
                          "--url", candidates[0]["url"],
                      )
                      run(
                          "scripts/save_nfl_inactive_snapshot.py",
                          "--season", str(season),
                          "--week", str(week),
                      )
                  except Exception as exc:
                      print(
                          f"Week {week}: collection unavailable: {exc}"
                      )

          print("NFL.com observations remain unverified.")
          PY

      - name: Build game-specific NFL observations
        run: |
          python scripts/build_nfl_inactive_observations.py

      - name: Validate NFL observations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/nfl_inactive_observations.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          assert data["season"] == 2026
          assert data["official_inactives_verified"] is False
          assert isinstance(data["games"], list)

          for game in data["games"]:
              assert game["verification_status"] == "extracted_unverified"
              assert game["official_inactives_verified"] is False

          print("PASS: NFL observations validated")
          
          print("Games:", len(data["games"]))
          PY

      - name: Audit current game-week inactive coverage
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          schedule = json.loads(Path("data/nfl_schedule_2026.json").read_text())
          feed = json.loads(Path("data/nfl_inactive_observations.json").read_text())
          indexed = {str(g["game_id"]): g for g in feed["games"]}
          now = datetime.now(timezone.utc)
          eastern = ZoneInfo("America/New_York")
          counts = {"verified": 0, "unverified": 0, "missing_near_kickoff": 0, "pending": 0}
          checked = []
          for game in schedule["games"]:
              if int(game["season"]) != 2026:
                  continue
              kickoff = datetime.strptime(
                  game["gameday"] + " " + game["gametime"], "%Y-%m-%d %H:%M"
              ).replace(tzinfo=eastern).astimezone(timezone.utc)
              # Only inspect games within the upcoming eight-day window.
              if not -timedelta(hours=6) <= kickoff - now <= timedelta(days=8):
                  continue
              record = indexed.get(str(game["game_id"]))
              if record and record.get("official_inactives_verified") is True:
                  status = "verified"
              elif record:
                  status = "unverified"
              elif kickoff - now <= timedelta(hours=3):
                  status = "missing_near_kickoff"
              else:
                  status = "pending"
              counts[status] += 1
              checked.append({
                  "game_id": game["game_id"],
                  "week": int(game["week"]),
                  "kickoff_utc": kickoff.isoformat(),
                  "status": status,
                  "official_inactives_verified": status == "verified",
                  "source_url": record.get("source_url") if record else None,
              })
              print(game["game_id"], status)
          report = {
              "generated_at_utc": now.isoformat(),
              "window_days": 8,
              "summary": counts,
              "games": checked,
          }
          path = Path("data/nfl_inactive_coverage_audit.json")
          path.write_text(json.dumps(report, indent=2) + "\\n")
          print("Coverage summary:", counts)
          print("Saved:", path)
          PY

      - name: Commit availability snapshot
        run: |
          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          
          git add data/gameday_availability.json
          git add data/nfl_inactive_observations.json
          git add data/nfl_inactive_coverage_audit.json
          git add -f data/nfl_inactive_snapshots/inactives_*.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No availability changes."
          else
            git commit -m "Refresh game-day availability"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
