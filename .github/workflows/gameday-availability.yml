
name: Refresh Game-Day Availability

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * 0,1,4"

permissions:
  contents: write

concurrency:
  group: gameday-availability
  cancel-in-progress: false

jobs:
  refresh-availability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate availability builder
        run: python -m py_compile scripts/build_gameday_availability.py

      - name: Build availability snapshot
        run: python scripts/build_gameday_availability.py

      - name: Validate generated snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/gameday_availability.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          assert data["player_count"] >= 500
          assert data["official_inactives_verified"] is False
          assert data["generated_at_utc"]
          assert data["players"]

          print(
              "Availability snapshot validated:",
              data["player_count"],
              "players"
          )
          PY

      - name: Commit availability snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gameday_availability.json

          if git diff --cached --quiet; then
            echo "No availability changes."
          else
            git commit -m "Refresh game-day availability"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
