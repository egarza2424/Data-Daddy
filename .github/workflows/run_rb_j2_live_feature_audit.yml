name: RB J2 Live Feature Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install numpy pandas

      - name: Check Python syntax
        run: python -m py_compile scripts/build_live_rb_j2_features.py scripts/build_historical_ppr_dataset.py

      - name: Generate J2 RB feature audit
        run: python scripts/build_live_rb_j2_features.py

      - name: Upload audit CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rb-j2-live-feature-audit
          path: projection-model/validation/2026-live-rb-j2-features-audit.csv
          if-no-files-found: warn
