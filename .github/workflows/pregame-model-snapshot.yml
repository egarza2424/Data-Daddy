name: Pregame Model Snapshot

on:
  workflow_dispatch:

  schedule:
    - cron: "0 19 * * 2-6"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Create snapshot folders
        run: |
          mkdir -p model-snapshots
          mkdir -p projection-model
          
      - name: Capture website model snapshot
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("fs");
          const path = require("path");

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            try {
              const page = await browser.newPage({
                acceptDownloads: true
              });

              console.log("Opening Fantasy AI Player Lab...");


              await page.goto(
                "https://egarza2424.github.io/Data-Daddy/",
                {
                  waitUntil: "networkidle",
                  timeout: 120000
                }
              );

              console.log(
                "Website loaded. Waiting for Export Snapshot button..."
              );
              page.on("console", msg => {
                console.log("BROWSER:", msg.type(), msg.text());
              });

              page.on("pageerror", error => {
                console.log("PAGE ERROR:", error.message);
              });

              console.log(
                "Export button count:",
                await page.locator("#exportSnapshotBtn").count()
              );

              console.log(
                "Current URL:",
                page.url()
              );
              console.log(
                "Page title:",
                await page.title()
              );

              console.log(
                "HTML length:",
                (await page.content()).length
              );

              console.log(
                "Page text preview:",
                (await page.locator("body").innerText()).slice(0, 500)
              );



              await page.waitForSelector(
                "#exportSnapshotBtn",
                {
                  state: "visible",
                  timeout: 120000
                }
              );

              console.log(
                "Export Snapshot button is ready."
              );
              // ---------------------------------------------
              // Verify deployed projection week before freeze
              // ---------------------------------------------

              const deployedWeek =
                await page.evaluate(() => {
                  const rawWeek =
                    document.documentElement
                      .dataset
                      .targetWeek;

                  const parsedWeek =
                    Number(rawWeek);

                  return Number.isFinite(parsedWeek)
                    ? parsedWeek
                    : null;
                });

              console.log(
                "Website projection week:",
                deployedWeek
              );

              if (
                !Number.isInteger(deployedWeek) ||
                deployedWeek <= 0
              ) {
                throw new Error(
                  "Snapshot blocked: deployed website " +
                  "does not have a valid target week."
                );
              }

              const statsMetadata =
                await page.evaluate(async () => {
                  const response =
                    await fetch(
                      "./nfl-stats.json",
                      {
                        cache: "no-store"
                      }
                    );

                  if (!response.ok) {
                    throw new Error(
                      `Unable to load nfl-stats.json: ` +
                      `${response.status}`
                    );
                  }

                  const data =
                    await response.json();

                  return {
                    targetWeek:
                      Number(data.target_week),
                    updated:
                      data.updated || null
                  };
                });

              console.log(
                "Deployed nfl-stats.json target week:",
                statsMetadata.targetWeek
              );

              console.log(
                "Deployed nfl-stats.json updated:",
                statsMetadata.updated
              );

              if (
                !Number.isInteger(
                  statsMetadata.targetWeek
                ) ||
                statsMetadata.targetWeek <= 0
              ) {
                throw new Error(
                  "Snapshot blocked: deployed " +
                  "nfl-stats.json has no valid target_week."
                );
              }

              if (
                deployedWeek !==
                statsMetadata.targetWeek
              ) {
                throw new Error(
                  "Snapshot blocked: website week " +
                  `${deployedWeek} does not match ` +
                  "nfl-stats.json target_week " +
                  `${statsMetadata.targetWeek}.`
                );
              }

              console.log(
                `Snapshot freshness check passed: ` +
                `Week ${deployedWeek}.`
              );

              const snapshotDate =
                new Date()
                  .toISOString()
                  .slice(0, 10);

              const filename =
                `${snapshotDate}-pregame-model-snapshot.csv`;

              const destination =
                path.join(
                  "model-snapshots",
                  filename
                );

                           if (fs.existsSync(destination)) {
                console.log(
                  `Replacing existing pregame snapshot: ${destination}`
                );

                fs.unlinkSync(destination);
              }

                            const csv =
                await page.evaluate(() => {
                  const profile = "balanced";
                  const positions = [
                    "QB",
                    "RB",
                    "WR",
                    "TE"
                  ];

                  const snapshot = [];

                  positions.forEach((position) => {
                    const rankings =
                      getPositionRankings(
                        position,
                        profile
                      );

                    rankings.forEach(
                      (entry, index) => {
                        const player =
                          entry.player;

                        const positionRank =
                          index + 1;

                        const recommendation =
                          getRecommendation(
                            player,
                            positionRank
                          );

                        const playCallerDetails =
                          getPlayCallerMatchupDetails(
                            player
                          );

                        const playerVsCallerDetails =
                          getPlayerVsDefensiveCallerDetails(
                            player
                          );

                        const metrics =
                          getMetrics(player);

                        const trench =
                          getTrenchMatchup(player);

                        const scoringEnvironment =
                          getScoringEnvironment(
                            player
                          );

                        snapshot.push({
                          snapshot_week:
                            Number(
                              document
                                .documentElement
                                .dataset
                                .targetWeek
                            ) || null,

                          player_id:
                            player.id,

                          player_name:
                            player.name,

                          position:
                            player.position,

                          team:
                            player.team === "LAR"
                              ? "LA"
                              : player.team,

                          opponent:
                            playCallerDetails
                              ?.opponent ||
                            playerVsCallerDetails
                              ?.opponent ||
                            "Unknown",

                          offensive_play_caller:
                            playCallerDetails
                              ?.offensivePlayCaller ||
                            "Unknown",

                          defensive_play_caller:
                            playCallerDetails
                              ?.defensivePlayCaller ||
                            playerVsCallerDetails
                              ?.defensivePlayCaller ||
                            "Unknown",

                          play_caller_matchup_score:
                            metrics
                              .playCallerMatchup,

                          play_caller_historical_ppr:
                            playCallerDetails
                              ?.averagePpr ?? "",

                          play_caller_sample_size:
                            playCallerDetails
                              ?.sampleSize ?? 0,

                          player_vs_defensive_caller_score:
                            metrics
                              .playerVsDefensiveCaller,

                          player_vs_defensive_caller_ppr:
                            playerVsCallerDetails
                              ?.averagePpr ?? "",

                          player_vs_defensive_caller_sample_size:
                            playerVsCallerDetails
                              ?.sampleSize ?? 0,

                          opportunity_score:
                            metrics.opportunity,

                          production_score:
                            metrics.production,

                          usage_score:
                            metrics.usage,

                          matchup_score:
                            metrics.matchup,

                          redzone_score:
                            metrics.redzone,

                          expert_score:
                            metrics.expert,

                          risk_score:
                            metrics.risk,

                          trench_score:
                            trench
                              ? trench.score
                              : null,

                          scoring_environment_score:
                            scoringEnvironment
                              ?.score ?? null,

                          implied_team_total:
                            scoringEnvironment
                              ?.impliedTeamTotal ??
                            null,

                          game_total:
                            scoringEnvironment
                              ?.gameTotal ?? null,

                          spread_line:
                            scoringEnvironment
                              ?.spread ?? null,

                          model_score:
                            entry.score,

                          position_rank:
                            positionRank,

                          recommendation:
                            recommendation
                        });
                      }
                    );
                  });

                  const header = [
                    "snapshot_week",
                    "player_id",
                    "player_name",
                    "position",
                    "team",
                    "opponent",
                    "offensive_play_caller",
                    "defensive_play_caller",
                    "play_caller_matchup_score",
                    "play_caller_historical_ppr",
                    "play_caller_sample_size",
                    "player_vs_defensive_caller_score",
                    "player_vs_defensive_caller_ppr",
                    "player_vs_defensive_caller_sample_size",
                    "opportunity_score",
                    "production_score",
                    "usage_score",
                    "matchup_score",
                    "redzone_score",
                    "expert_score",
                    "risk_score",
                    "trench_score",
                    "scoring_environment_score",
                    "implied_team_total",
                    "game_total",
                    "spread_line",
                    "model_score",
                    "position_rank",
                    "recommendation"
                  ];

                  const escapeCsv =
                    (value) =>
                      `"${String(
                        value ?? ""
                      ).replace(
                        /"/g,
                        '""'
                      )}"`;

                  const rows =
                    snapshot.map(
                      (player) =>
                        [
                          player.snapshot_week,
                          player.player_id,
                          escapeCsv(
                            player.player_name
                          ),
                          player.position,
                          player.team,
                          player.opponent,
                          escapeCsv(
                            player
                              .offensive_play_caller
                          ),
                          escapeCsv(
                            player
                              .defensive_play_caller
                          ),
                          player
                            .play_caller_matchup_score,
                          player
                            .play_caller_historical_ppr,
                          player
                            .play_caller_sample_size,
                          player
                            .player_vs_defensive_caller_score,
                          player
                            .player_vs_defensive_caller_ppr,
                          player
                            .player_vs_defensive_caller_sample_size,
                          player
                            .opportunity_score,
                          player
                            .production_score,
                          player.usage_score,
                          player.matchup_score,
                          player.redzone_score,
                          player.expert_score,
                          player.risk_score,
                          player.trench_score,
                          player
                            .scoring_environment_score,
                          player
                            .implied_team_total,
                          player.game_total,
                          player.spread_line,
                          player.model_score,
                          player.position_rank,
                          player.recommendation
                        ].join(",")
                    );

                  return [
                    header.join(","),
                    ...rows
                  ].join("\n");
                });

              fs.writeFileSync(
                destination,
                csv,
                "utf8"
              );

              console.log(
                `Snapshot saved to ${destination}`
              );

              const productionDestination =
                path.join(
                  "projection-model",
                  "current-live-model-snapshot.csv"
                );

              fs.copyFileSync(
                destination,
                productionDestination
              );

              console.log(
                `Production snapshot saved to ${productionDestination}`
              );

              if (!fs.existsSync(destination)) {
                throw new Error(
                  "Snapshot CSV was not created."
                );
              }

              const savedCsv =
                fs.readFileSync(
                  destination,
                  "utf8"
                );

              const lines =
                savedCsv
                  .trim()
                  .split(/\r?\n/);

              console.log(
                "Snapshot player rows:",
                Math.max(
                  0,
                  lines.length - 1
                )
              );

              if (lines.length < 2) {
                throw new Error(
                  "Snapshot CSV contains no player rows."
                );
              }

              const requiredColumns = [
                "snapshot_week",
                "opportunity_score",
                "production_score",
                "usage_score",
                "play_caller_matchup_score",
                "player_vs_defensive_caller_score",
                "matchup_score",
                "redzone_score",
                "expert_score",
                "risk_score",
                "trench_score",
                "scoring_environment_score",
                "implied_team_total",
                "game_total",
                "spread_line",
                "model_score",
                "position_rank"
              ];
              const header = lines[0];

              for (
                const column of requiredColumns
              ) {
                if (!header.includes(column)) {
                  throw new Error(
                    `Missing required snapshot column: ${column}`
                  );
                }
              }
              const snapshotWeekIndex =
                header
                  .split(",")
                  .indexOf("snapshot_week");

              const snapshotWeeks =
                new Set(
                  lines
                    .slice(1)
                    .map((line) => {
                      const values =
                        line.split(",");

                      return Number(
                        values[snapshotWeekIndex]
                      );
                    })
                    .filter(
                      (week) =>
                        Number.isInteger(week) &&
                        week > 0
                    )
                );

              if (
                snapshotWeeks.size !== 1 ||
                !snapshotWeeks.has(deployedWeek)
              ) {
                throw new Error(
                  "Snapshot blocked: exported " +
                  "snapshot_week does not match " +
                  `deployed Week ${deployedWeek}.`
                );
              }

              console.log(
                `Exported snapshot confirmed as ` +
                `Week ${deployedWeek}.`
              );
              console.log(
                "Snapshot contains all required model columns."
              );
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Show generated snapshot
        run: |
          ls -lh model-snapshots/
          head -n 2 model-snapshots/*.csv

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add model-snapshots/
          git add projection-model/current-live-model-snapshot.csv

          if git diff --cached --quiet; then
            echo "No new snapshot changes to commit."
            exit 0
          fi

          git commit -m "Save pregame model snapshot"
          git push
