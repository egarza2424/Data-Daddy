name: Pregame Model Snapshot

on:
  workflow_dispatch:

  schedule:
    - cron: "0 19 * * 2-6"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Create snapshot folders
        run: |
          mkdir -p model-snapshots
          mkdir -p projection-model
          
      - name: Capture website model snapshot
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("fs");
          const path = require("path");

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            try {
              const page = await browser.newPage({
                acceptDownloads: true
              });

              console.log("Opening Fantasy AI Player Lab...");

              await page.goto(
                "https://egarza2424.github.io/Fantasy-AI-Player-Lab/",
                {
                  waitUntil: "networkidle",
                  timeout: 120000
                }
              );

              console.log(
                "Website loaded. Waiting for Export Snapshot button..."
              );

              await page.waitForSelector(
                "#exportSnapshotBtn",
                {
                  state: "visible",
                  timeout: 120000
                }
              );

              console.log(
                "Export Snapshot button is ready."
              );
              // ---------------------------------------------
              // Verify deployed projection week before freeze
              // ---------------------------------------------

              const deployedWeek =
                await page.evaluate(() => {
                  const rawWeek =
                    document.documentElement
                      .dataset
                      .targetWeek;

                  const parsedWeek =
                    Number(rawWeek);

                  return Number.isFinite(parsedWeek)
                    ? parsedWeek
                    : null;
                });

              console.log(
                "Website projection week:",
                deployedWeek
              );

              if (
                !Number.isInteger(deployedWeek) ||
                deployedWeek <= 0
              ) {
                throw new Error(
                  "Snapshot blocked: deployed website " +
                  "does not have a valid target week."
                );
              }

              const statsMetadata =
                await page.evaluate(async () => {
                  const response =
                    await fetch(
                      "./nfl-stats.json",
                      {
                        cache: "no-store"
                      }
                    );

                  if (!response.ok) {
                    throw new Error(
                      `Unable to load nfl-stats.json: ` +
                      `${response.status}`
                    );
                  }

                  const data =
                    await response.json();

                  return {
                    targetWeek:
                      Number(data.target_week),
                    updated:
                      data.updated || null
                  };
                });

              console.log(
                "Deployed nfl-stats.json target week:",
                statsMetadata.targetWeek
              );

              console.log(
                "Deployed nfl-stats.json updated:",
                statsMetadata.updated
              );

              if (
                !Number.isInteger(
                  statsMetadata.targetWeek
                ) ||
                statsMetadata.targetWeek <= 0
              ) {
                throw new Error(
                  "Snapshot blocked: deployed " +
                  "nfl-stats.json has no valid target_week."
                );
              }

              if (
                deployedWeek !==
                statsMetadata.targetWeek
              ) {
                throw new Error(
                  "Snapshot blocked: website week " +
                  `${deployedWeek} does not match ` +
                  "nfl-stats.json target_week " +
                  `${statsMetadata.targetWeek}.`
                );
              }

              console.log(
                `Snapshot freshness check passed: ` +
                `Week ${deployedWeek}.`
              );
              const downloadPromise =
                page.waitForEvent("download", {
                  timeout: 120000
                });

              await page.click("#exportSnapshotBtn");

              const download =
                await downloadPromise;

              const snapshotDate =
                new Date()
                  .toISOString()
                  .slice(0, 10);

              const filename =
                `${snapshotDate}-pregame-model-snapshot.csv`;

              const destination =
                path.join(
                  "model-snapshots",
                  filename
                );

                           if (fs.existsSync(destination)) {
                console.log(
                  `Replacing existing pregame snapshot: ${destination}`
                );

                fs.unlinkSync(destination);
              }

              await download.saveAs(destination);

              console.log(
                `Snapshot saved to ${destination}`
              );

              const productionDestination =
                path.join(
                  "projection-model",
                  "current-live-model-snapshot.csv"
                );

              fs.copyFileSync(
                destination,
                productionDestination
              );

              console.log(
                `Production snapshot saved to ${productionDestination}`
              );

              if (!fs.existsSync(destination)) {
                throw new Error(
                  "Snapshot CSV was not created."
                );
              }

              const csv =
                fs.readFileSync(
                  destination,
                  "utf8"
                );

              const lines =
                csv
                  .trim()
                  .split(/\r?\n/);

              console.log(
                "Snapshot player rows:",
                Math.max(
                  0,
                  lines.length - 1
                )
              );

              if (lines.length < 2) {
                throw new Error(
                  "Snapshot CSV contains no player rows."
                );
              }

              const requiredColumns = [
                "snapshot_week",
                "opportunity_score",
                "production_score",
                "usage_score",
                "play_caller_matchup_score",
                "player_vs_defensive_caller_score",
                "matchup_score",
                "redzone_score",
                "expert_score",
                "risk_score",
                "trench_score",
                "scoring_environment_score",
                "implied_team_total",
                "game_total",
                "spread_line",
                "model_score",
                "position_rank"
              ];
              const header = lines[0];

              for (
                const column of requiredColumns
              ) {
                if (!header.includes(column)) {
                  throw new Error(
                    `Missing required snapshot column: ${column}`
                  );
                }
              }
              const snapshotWeekIndex =
                header
                  .split(",")
                  .indexOf("snapshot_week");

              const snapshotWeeks =
                new Set(
                  lines
                    .slice(1)
                    .map((line) => {
                      const values =
                        line.split(",");

                      return Number(
                        values[snapshotWeekIndex]
                      );
                    })
                    .filter(
                      (week) =>
                        Number.isInteger(week) &&
                        week > 0
                    )
                );

              if (
                snapshotWeeks.size !== 1 ||
                !snapshotWeeks.has(deployedWeek)
              ) {
                throw new Error(
                  "Snapshot blocked: exported " +
                  "snapshot_week does not match " +
                  `deployed Week ${deployedWeek}.`
                );
              }

              console.log(
                `Exported snapshot confirmed as ` +
                `Week ${deployedWeek}.`
              );
              console.log(
                "Snapshot contains all required model columns."
              );
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Show generated snapshot
        run: |
          ls -lh model-snapshots/
          head -n 2 model-snapshots/*.csv

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add model-snapshots/
          git add projection-model/current-live-model-snapshot.csv

          if git diff --cached --quiet; then
            echo "No new snapshot changes to commit."
            exit 0
          fi

          git commit -m "Save pregame model snapshot"
          git push
