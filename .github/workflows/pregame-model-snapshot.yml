name: Pregame Model Snapshot

on:
  workflow_dispatch:

  schedule:
    - cron: "0 19 * * 2-6"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Create snapshot folders
        run: |
          mkdir -p model-snapshots
          mkdir -p projection-model
          
      - name: Capture website model snapshot
        id: capture
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("fs");
          const path = require("path");

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            try {
              const page = await browser.newPage({
                acceptDownloads: true
              });

              console.log("Opening Fantasy AI Player Lab...");


              await page.goto(
                "https://egarza2424.github.io/Data-Daddy/",
                {
                  waitUntil: "networkidle",
                  timeout: 120000
                }
              );

              console.log(
                "Website loaded. Waiting for Export Snapshot button..."
              );
              page.on("console", msg => {
                console.log("BROWSER:", msg.type(), msg.text());
              });

              page.on("pageerror", error => {
                console.log("PAGE ERROR:", error.message);
              });

              console.log(
                "Export button count:",
                await page.locator("#exportSnapshotBtn").count()
              );

              console.log(
                "Current URL:",
                page.url()
              );
              console.log(
                "Page title:",
                await page.title()
              );

              console.log(
                "HTML length:",
                (await page.content()).length
              );

              console.log(
                "Page text preview:",
                (await page.locator("body").innerText()).slice(0, 500)
              );



              await page.waitForSelector(
                "#exportSnapshotBtn",
                {
                  state: "visible",
                  timeout: 120000
                }
              );

              console.log(
                "Export Snapshot button is ready."
              );
              // ---------------------------------------------
              // Verify deployed projection week before freeze
              // ---------------------------------------------

              const deployedWeek =
                await page.evaluate(() => {
                  const rawWeek =
                    document.documentElement
                      .dataset
                      .targetWeek;

                  const parsedWeek =
                    Number(rawWeek);

                  return Number.isFinite(parsedWeek)
                    ? parsedWeek
                    : null;
                });

              console.log(
                "Website projection week:",
                deployedWeek
              );

              if (
                !Number.isInteger(deployedWeek) ||
                deployedWeek <= 0
              ) {
                throw new Error(
                  "Snapshot blocked: deployed website " +
                  "does not have a valid target week."
                );
              }

              const statsMetadata =
                await page.evaluate(async () => {
                  const response =
                    await fetch(
                      "./nfl-stats.json",
                      {
                        cache: "no-store"
                      }
                    );

                  if (!response.ok) {
                    throw new Error(
                      `Unable to load nfl-stats.json: ` +
                      `${response.status}`
                    );
                  }

                  const data =
                    await response.json();

                  return {
                    targetWeek:
                      Number(data.target_week),
                    updated:
                      data.updated || null
                  };
                });

              console.log(
                "Deployed nfl-stats.json target week:",
                statsMetadata.targetWeek
              );

              console.log(
                "Deployed nfl-stats.json updated:",
                statsMetadata.updated
              );

              if (
                !Number.isInteger(
                  statsMetadata.targetWeek
                ) ||
                statsMetadata.targetWeek <= 0
              ) {
                throw new Error(
                  "Snapshot blocked: deployed " +
                  "nfl-stats.json has no valid target_week."
                );
              }

              if (
                deployedWeek !==
                statsMetadata.targetWeek
              ) {
                console.log(
                  "Snapshot deferred: website is displaying Week " +
                  deployedWeek +
                  " while nfl-stats.json has advanced to Week " +
                  statsMetadata.targetWeek +
                  ". Waiting for the Tuesday Eastern transition."
                );
                fs.appendFileSync(process.env.GITHUB_OUTPUT, "captured=false\n");
                return;
              }

              console.log(
                `Snapshot freshness check passed: ` +
                `Week ${deployedWeek}.`
              );

              const snapshotDate =
                new Date()
                  .toISOString()
                  .slice(0, 10);

              const filename =
                `${snapshotDate}-pregame-model-snapshot.csv`;

              const destination =
                path.join(
                  "model-snapshots",
                  filename
                );

                           if (fs.existsSync(destination)) {
                console.log(
                  `Replacing existing pregame snapshot: ${destination}`
                );

                fs.unlinkSync(destination);
              }

                            const csv =
                await page.evaluate(() => {
                  const profile = "balanced";
                  const positions = [
                    "QB",
                    "RB",
                    "WR",
                    "TE"
                  ];

                  const snapshot = [];

                  positions.forEach((position) => {
                    const rankings =
                      getPositionRankings(
                        position,
                        profile
                      );

                    rankings.forEach(
                      (entry, index) => {
                        const player =
                          entry.player;

                        const positionRank =
                          index + 1;

                        const recommendation =
                          getRecommendation(
                            player,
                            positionRank
                          );

                        const playCallerDetails =
                          getPlayCallerMatchupDetails(
                            player
                          );

                        const playerVsCallerDetails =
                          getPlayerVsDefensiveCallerDetails(
                            player
                          );

                        const metrics =
                          getMetrics(player);

                        const trench =
                          getTrenchMatchup(player);

                        const scoringEnvironment =
                          getScoringEnvironment(
                            player
                          );

                        snapshot.push({
                          snapshot_week:
                            Number(
                              document
                                .documentElement
                                .dataset
                                .targetWeek
                            ) || null,

                          player_id:
                            player.id,

                          player_name:
                            player.name,

                          position:
                            player.position,

                          team:
                            player.team === "LAR"
                              ? "LA"
                              : player.team,

                          roster_status:
                            player.status || "UNKNOWN",

                          injury_status:
                            player.injuryStatus || "",

                         
                          opponent:
                            (
                              teamNextOpponent[
                                player.team === "LA"
                                  ? "LAR"
                                  : player.team
                              ]?.opponent
                            ) ||
                            playCallerDetails
                              ?.opponent ||
                            playerVsCallerDetails
                              ?.opponent ||
                            "Unknown",


                          offensive_play_caller:
                            playCallerDetails
                              ?.offensivePlayCaller ||
                            "Unknown",

                          defensive_play_caller:
                            playCallerDetails
                              ?.defensivePlayCaller ||
                            playerVsCallerDetails
                              ?.defensivePlayCaller ||
                            "Unknown",

                          play_caller_matchup_score:
                            metrics
                              .playCallerMatchup,

                          play_caller_historical_ppr:
                            playCallerDetails
                              ?.averagePpr ?? "",

                          play_caller_sample_size:
                            playCallerDetails
                              ?.sampleSize ?? 0,

                          player_vs_defensive_caller_score:
                            metrics
                              .playerVsDefensiveCaller,

                          player_vs_defensive_caller_ppr:
                            playerVsCallerDetails
                              ?.averagePpr ?? "",

                          player_vs_defensive_caller_sample_size:
                            playerVsCallerDetails
                              ?.sampleSize ?? 0,

                          opportunity_score:
                            metrics.opportunity,

                          production_score:
                            metrics.production,

                          usage_score:
                            metrics.usage,

                          matchup_score:
                            metrics.matchup,

                          redzone_score:
                            metrics.redzone,

                          expert_score:
                            metrics.expert,

                          risk_score:
                            metrics.risk,

                          trench_score:
                            trench
                              ? trench.score
                              : null,

                          scoring_environment_score:
                            scoringEnvironment
                              ?.score ?? null,

                          implied_team_total:
                            scoringEnvironment
                              ?.impliedTeamTotal ??
                            null,

                          game_total:
                            scoringEnvironment
                              ?.gameTotal ?? null,

                          spread_line:
                            scoringEnvironment
                              ?.spread ?? null,

                          model_score:
                            entry.score,

                          position_rank:
                            positionRank,

                          recommendation:
                            recommendation
                        });
                      }
                    );
                  });

                  const header = [
                    "snapshot_week",
                    "player_id",
                    "player_name",
                    "position",
                    "team",
                    "roster_status",
                    "injury_status",
                    "opponent",
                    "offensive_play_caller",
                    "defensive_play_caller",
                    "play_caller_matchup_score",
                    "play_caller_historical_ppr",
                    "play_caller_sample_size",
                    "player_vs_defensive_caller_score",
                    "player_vs_defensive_caller_ppr",
                    "player_vs_defensive_caller_sample_size",
                    "opportunity_score",
                    "production_score",
                    "usage_score",
                    "matchup_score",
                    "redzone_score",
                    "expert_score",
                    "risk_score",
                    "trench_score",
                    "scoring_environment_score",
                    "implied_team_total",
                    "game_total",
                    "spread_line",
                    "model_score",
                    "position_rank",
                    "recommendation"
                  ];

                  const escapeCsv =
                    (value) =>
                      `"${String(
                        value ?? ""
                      ).replace(
                        /"/g,
                        '""'
                      )}"`;

                  const rows =
                    snapshot.map(
                      (player) =>
                        [
                          player.snapshot_week,
                          player.player_id,
                          escapeCsv(
                            player.player_name
                          ),
                          player.position,
                          player.team,
                          escapeCsv(player.roster_status),
                          escapeCsv(player.injury_status),
                          player.opponent,
                          escapeCsv(
                            player
                              .offensive_play_caller
                          ),
                          escapeCsv(
                            player
                              .defensive_play_caller
                          ),
                          player
                            .play_caller_matchup_score,
                          player
                            .play_caller_historical_ppr,
                          player
                            .play_caller_sample_size,
                          player
                            .player_vs_defensive_caller_score,
                          player
                            .player_vs_defensive_caller_ppr,
                          player
                            .player_vs_defensive_caller_sample_size,
                          player
                            .opportunity_score,
                          player
                            .production_score,
                          player.usage_score,
                          player.matchup_score,
                          player.redzone_score,
                          player.expert_score,
                          player.risk_score,
                          player.trench_score,
                          player
                            .scoring_environment_score,
                          player
                            .implied_team_total,
                          player.game_total,
                          player.spread_line,
                          player.model_score,
                          player.position_rank,
                          player.recommendation
                        ].join(",")
                    );

                  return [
                    header.join(","),
                    ...rows
                  ].join("\n");
                });

              fs.writeFileSync(
                destination,
                csv,
                "utf8"
              );

              console.log(
                `Snapshot saved to ${destination}`
              );

              const productionDestination =
                path.join(
                  "projection-model",
                  "current-live-model-snapshot.csv"
                );

              fs.copyFileSync(
                destination,
                productionDestination
              );

              console.log(
                `Production snapshot saved to ${productionDestination}`
              );

              if (!fs.existsSync(destination)) {
                throw new Error(
                  "Snapshot CSV was not created."
                );
              }

              const savedCsv =
                fs.readFileSync(
                  destination,
                  "utf8"
                );

              const lines =
                savedCsv
                  .trim()
                  .split(/\r?\n/);

              console.log(
                "Snapshot player rows:",
                Math.max(
                  0,
                  lines.length - 1
                )
              );

              if (lines.length < 2) {
                throw new Error(
                  "Snapshot CSV contains no player rows."
                );
              }

              const requiredColumns = [
                "snapshot_week",
                "roster_status",
                "injury_status",
                "opportunity_score",
                "production_score",
                "usage_score",
                "play_caller_matchup_score",
                "player_vs_defensive_caller_score",
                "matchup_score",
                "redzone_score",
                "expert_score",
                "risk_score",
                "trench_score",
                "scoring_environment_score",
                "implied_team_total",
                "game_total",
                "spread_line",
                "model_score",
                "position_rank"
              ];
              const header = lines[0];
              const columns = header.split(",");
              const rosterStatusIndex =
                columns.indexOf("roster_status");
              const injuryStatusIndex =
                columns.indexOf("injury_status");

              if (
                rosterStatusIndex === -1 ||
                injuryStatusIndex === -1
              ) {
                throw new Error(
                  "Snapshot missing player availability columns."
                );
              }

              const statusCounts = {};
              const injuryCounts = {};

              for (const line of lines.slice(1)) {
                const values = line.split(",");

                const rosterStatus =
                  values[rosterStatusIndex]
                    ?.replace(/^"|"$/g, "") || "UNKNOWN";

                const injuryStatus =
                  values[injuryStatusIndex]
                    ?.replace(/^"|"$/g, "") || "NOT_REPORTED";

                statusCounts[rosterStatus] =
                  (statusCounts[rosterStatus] || 0) + 1;

                injuryCounts[injuryStatus] =
                  (injuryCounts[injuryStatus] || 0) + 1;
              }

              console.log(
                "Snapshot roster status counts:",
                statusCounts
              );

              console.log(
                "Snapshot injury status counts:",
                injuryCounts
              );              

              for (
                const column of requiredColumns
              ) {
                if (!header.includes(column)) {
                  throw new Error(
                    `Missing required snapshot column: ${column}`
                  );
                }
              }
              const snapshotWeekIndex =
                header
                  .split(",")
                  .indexOf("snapshot_week");

              const snapshotWeeks =
                new Set(
                  lines
                    .slice(1)
                    .map((line) => {
                      const values =
                        line.split(",");

                      return Number(
                        values[snapshotWeekIndex]
                      );
                    })
                    .filter(
                      (week) =>
                        Number.isInteger(week) &&
                        week > 0
                    )
                );

              if (
                snapshotWeeks.size !== 1 ||
                !snapshotWeeks.has(deployedWeek)
              ) {
                throw new Error(
                  "Snapshot blocked: exported " +
                  "snapshot_week does not match " +
                  `deployed Week ${deployedWeek}.`
                );
              }

              fs.appendFileSync(process.env.GITHUB_OUTPUT, "captured=true\n");

              console.log(
                `Exported snapshot confirmed as ` +
                `Week ${deployedWeek}.`
              );
              console.log(
                "Snapshot contains all required model columns."
              );
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify roster availability with nflverse
        if: steps.capture.outputs.captured == 'true'
        run: |
          python <<'PY'
          import csv
          import io
          import shutil
          import urllib.request
          from collections import Counter
          from pathlib import Path

          url = (
              "https://github.com/nflverse/nflverse-data/"
              "releases/download/rosters/roster_2026.csv"
          )

          with urllib.request.urlopen(url, timeout=60) as response:
              roster_text = response.read().decode("utf-8-sig")

          roster_rows = list(csv.DictReader(io.StringIO(roster_text)))

          def key(name, position, team):
              normalized_name = "".join(
                  char for char in str(name).lower()
                  if char.isalnum()
              )
              normalized_team = str(team).strip().upper()
              if normalized_team == "LAR":
                  normalized_team = "LA"
              return (
                  normalized_name,
                  str(position).strip().upper(),
                  normalized_team
              )

          roster_lookup = {}
          for player in roster_rows:
              player_key = key(
                  player.get("full_name") or player.get("player_name"),
                  player.get("position"),
                  player.get("team")
              )
              roster_lookup.setdefault(player_key, []).append(player)

          snapshot_path = Path(
              "projection-model/current-live-model-snapshot.csv"
          )

          with snapshot_path.open(newline="", encoding="utf-8") as file:
              reader = csv.DictReader(file)
              columns = reader.fieldnames
              snapshot_rows = list(reader)

          if not columns or "roster_status" not in columns:
              raise RuntimeError("Snapshot roster_status column missing")

          blocked_statuses = {
              "EXE": "EXEMPT",
              "EXEMPT": "EXEMPT",
              "RES": "INACTIVE",
              "IR": "IR",
              "PUP": "PUP",
              "SUS": "SUSPENDED"
          }

          corrections = []
          ambiguous = []
          for row in snapshot_rows:
              player_key = key(
                  row.get("player_name"),
                  row.get("position"),
                  row.get("team")
              )
              matches = roster_lookup.get(player_key, [])

              if len(matches) > 1:
                  ambiguous.append(row.get("player_name"))
                  continue

              if len(matches) != 1:
                  continue

              raw_status = str(
                  matches[0].get("status") or ""
              ).strip().upper()

              new_status = blocked_statuses.get(raw_status)
              if not new_status:
                  continue

              # Week 7 only: prevent a stale exempt-list
              # feed from reversing Jacobs' roster correction.
              if (
                  str(row.get("snapshot_week")) == "7"
                  and row.get("player_name") == "Josh Jacobs"
                  and row.get("team") == "GB"
                  and new_status == "EXEMPT"
                  and str(row.get("roster_status", "")).upper() == "ACTIVE"
              ):
                  print(
                      "Preserving Week 7 Jacobs status; "
                      "verify game-day availability separately."
                  )
                  continue

              previous_status = row.get("roster_status", "")
              if previous_status.upper() == new_status:
                  continue

              row["roster_status"] = new_status
              corrections.append((
                  row.get("player_name"),
                  previous_status,
                  new_status,
                  raw_status
              ))

          if ambiguous:
              print("Ambiguous roster matches:", ambiguous[:20])

          print("Roster availability corrections:", len(corrections))
          for correction in corrections:
              print("STATUS CORRECTION:", correction)

          print(
              "Corrected roster status counts:",
              dict(Counter(
                  row["roster_status"] for row in snapshot_rows
              ))
          )

          with snapshot_path.open(
              "w", newline="", encoding="utf-8"
          ) as file:
              writer = csv.DictWriter(file, fieldnames=columns)
              writer.writeheader()
              writer.writerows(snapshot_rows)

          snapshots = sorted(
              Path("model-snapshots").glob(
                  "*-pregame-model-snapshot.csv"
              )
          )
          if not snapshots:
              raise RuntimeError("Dated snapshot not found")

          shutil.copyfile(snapshot_path, snapshots[-1])
          PY



      - name: Audit scheduled team coverage
        if: steps.capture.outputs.captured == 'true'
        run: |
          python scripts/fetch_nfl_schedule.py
          python <<'PY'
          import csv
          import json
          from pathlib import Path

          snapshot_path = Path("projection-model/current-live-model-snapshot.csv")
          with snapshot_path.open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          if not rows:
              raise RuntimeError("Snapshot has no players")

          weeks = {str(r["snapshot_week"]).strip() for r in rows}
          if len(weeks) != 1:
              raise RuntimeError(f"Mixed snapshot weeks: {sorted(weeks)}")
          week = next(iter(weeks))

          schedule = json.loads(Path("data/nfl_schedule_2026.json").read_text())
          games = [g for g in schedule["games"] if str(g.get("week", "")).strip() == week]
          if not games:
              raise RuntimeError(f"No scheduled games found for Week {week}")

          normalize = lambda t: "LA" if str(t).strip().upper() == "LAR" else str(t).strip().upper()
          scheduled = {normalize(g[k]) for g in games for k in ("home_team", "away_team")}
          observed = {normalize(r["team"]) for r in rows if r.get("team")}
          missing = sorted(scheduled - observed)
          unexpected = sorted(observed - scheduled)
          # Preserve the complete captured source for audit purposes,
          # but publish only players on teams scheduled to play.
          if missing:
              raise RuntimeError(
                  f"Scheduled teams missing from captured snapshot: {missing}"
              )
          if unexpected:
              print("Excluding bye-week team rows:", unexpected)
              filtered = [
                  row for row in rows
                  if normalize(row.get("team", "")) in scheduled
              ]
              if not filtered:
                  raise RuntimeError("No scheduled-team players remain")
              with snapshot_path.open("w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(f, fieldnames=rows[0].keys())
                  writer.writeheader()
                  writer.writerows(filtered)
              print(f"Published snapshot: {len(filtered)} scheduled-team players; excluded {len(rows)-len(filtered)} bye-week rows")
              rows = filtered
              observed = {normalize(r["team"]) for r in rows if r.get("team")}
              unexpected = sorted(observed - scheduled)
          all_teams = {
              "ARI","ATL","BAL","BUF","CAR","CHI","CIN","CLE",
              "DAL","DEN","DET","GB","HOU","IND","JAX","KC",
              "LA","LAC","LV","MIA","MIN","NE","NO","NYG",
              "NYJ","PHI","PIT","SEA","SF","TB","TEN","WAS"
          }
          byes = sorted(all_teams - scheduled)
          print(f"Week {week}: {len(games)} games, {len(scheduled)} scheduled teams")
          print("Teams on bye:", ", ".join(byes) or "none")
          print("Snapshot teams:", ", ".join(sorted(observed)))
          print("Scheduled teams missing from snapshot:", missing)
          print("Snapshot teams without scheduled games:", unexpected)
          print("Seattle status:", "BYE" if "SEA" in byes else ("PRESENT" if "SEA" in observed else "MISSING"))
          if missing or unexpected:
              raise RuntimeError("Snapshot team coverage does not match the target-week schedule")
          PY

      - name: Show generated snapshot
        if: steps.capture.outputs.captured == 'true'
        run: |
          ls -lh model-snapshots/
          head -n 2 model-snapshots/*.csv

      - name: Commit snapshot
        if: steps.capture.outputs.captured == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add model-snapshots/
          git add projection-model/current-live-model-snapshot.csv

          if git diff --cached --quiet; then
            echo "No new snapshot changes to commit."
            exit 0
          fi

          git commit -m "Save pregame model snapshot"
          git push
