name: Freeze Weekly Sleeper Picks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 4-6"

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Retrieve 2026 NFL schedule
        run: python scripts/fetch_nfl_schedule.py
      - name: Capture live pregame sleeper recommendations
        id: capture
        run: |
          mkdir -p data/sleeper_snapshots
          node <<'NODE'
          const {chromium}=require("playwright");
          const fs=require("fs");
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage();
              await page.goto("https://egarza2424.github.io/Data-Daddy/",{waitUntil:"networkidle",timeout:120000});
              const payload=await page.evaluate(()=>{
                const week=Number(document.documentElement.dataset.targetWeek);
                const statsWeek=Number(window.nflStats?.target_week);
                if(!Number.isInteger(week)||week<1)throw Error("Invalid displayed week");
                if(typeof getWeeklySleeperCandidates!=="function")throw Error("Sleeper model unavailable");
                if(!Array.isArray(weeklyPprProjections)||!weeklyPprProjections.length)throw Error("PPR projections unavailable");
                const picks=getWeeklySleeperCandidates().slice(0,10).map((p,index)=>({
                  rank:index+1,player_name:p.player?.name||p.projection?.player_name,
                  position:p.position,team:p.player?.team||p.projection?.team,
                  sleeper_score:Number(p.sleeperScore.toFixed(3)),
                  projected_ppr:p.projectedPpr,model_rank:p.aiRank,ppr_rank:p.pprRank
                }));
                if(!picks.length||picks.some(p=>!p.player_name))throw Error("Sleeper picks unavailable");
                return {season:2026,target_week:week,displayed_week:week,picks};
              });
              const schedule=JSON.parse(fs.readFileSync("data/nfl_schedule_2026.json","utf8"));
              const games=schedule.games.filter(g=>Number(g.week)===payload.target_week);
              if(!games.length)throw Error("No schedule for target week");
              // Only store an auditable capture; kickoff timing verification is handled downstream.
              payload.captured_utc=new Date().toISOString();
              payload.timing_status="kickoff_verification_pending";
              const file="data/sleeper_snapshots/2026-week"+String(payload.target_week).padStart(2,"0")+".json";
              if(fs.existsSync(file)){console.log("Existing sleeper snapshot preserved: "+file);return;}
              fs.writeFileSync(file,JSON.stringify(payload,null,2)+"\n");
              fs.appendFileSync(process.env.GITHUB_OUTPUT,"snapshot="+file+"\\n");
              console.log("Saved "+file+" with "+payload.picks.length+" sleeper recommendations");
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify each sleeper pick preceded kickoff
        if: steps.capture.outputs.snapshot != ''
        env:
          SNAPSHOT_PATH: ${{ steps.capture.outputs.snapshot }}
        run: python scripts/verify_sleeper_snapshot_kickoffs.py "$SNAPSHOT_PATH"
      - name: Commit immutable sleeper snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sleeper_snapshots/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Freeze weekly sleeper picks before validation"
          git push
