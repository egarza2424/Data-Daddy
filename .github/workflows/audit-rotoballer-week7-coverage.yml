name: Audit RotoBaller Week 7 Coverage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test public PPR rankings coverage (read-only)
        run: python scripts/audit_rotoballer_week7_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: week7-rotoballer-coverage-review
          path: projection-model/validation/week7-rotoballer-coverage-review.csv
          if-no-files-found: warn
