name: Historical Injury Opportunity Foundation (Review Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas
      - name: Download historical player stats (2025)
        run: |
          mkdir -p historical-data
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          url = "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2025.csv"
          target = Path("historical-data/player_stats_2025.csv")
          urllib.request.urlretrieve(url, target)
          if target.stat().st_size < 10000:
              raise RuntimeError("Downloaded historical stats file is unexpectedly small")
          print(f"Downloaded {target}: {target.stat().st_size} bytes")
          PY
      - name: Build historical injury opportunity foundation
        run: python scripts/build_historical_injury_opportunity_foundation.py
      - name: Evaluate historical absence proxy (descriptive only)
        run: python scripts/evaluate_historical_injury_opportunity_foundation.py
      - name: Validate WR lagged-absence signal (walk-forward)
        run: python scripts/validate_wr_absence_walkforward.py
      - name: Build historical injury-report candidate events (review only)
        run: python scripts/build_historical_pregame_injury_events.py
      - name: Evaluate injury replacement target opportunities (descriptive only)
        run: python scripts/evaluate_2025_injury_replacement_opportunity.py
      - name: Upload review-only historical dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-injury-opportunity-foundation-review
          path: |
            projection-model/validation/historical-injury-opportunity-foundation.csv
            projection-model/validation/historical-injury-opportunity-summary.csv
            projection-model/validation/wr-lagged-absence-walkforward-summary.csv
            projection-model/validation/wr-lagged-absence-walkforward-detail.csv
            projection-model/validation/2025-pregame-injury-event-candidates.csv
            projection-model/validation/2025-injury-replacement-opportunity-summary.csv
            projection-model/validation/2025-injury-replacement-opportunity-detail.csv
          if-no-files-found: warn
