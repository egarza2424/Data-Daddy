name: Audit Week 8 WR Usage (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-wr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas
        run: python -m pip install pandas
      - name: Audit low-usage WR candidates
        run: python scripts/audit_week8_wr_low_usage.py
