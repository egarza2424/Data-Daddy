name: Audit Weekly WR Usage (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-wr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas
        run: python -m pip install pandas
      - name: Download 2026 weekly player stats
        run: |
          mkdir -p historical-data
          curl --fail --location --retry 3 --max-time 120 https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2026.csv -o historical-data/player_stats_2026.csv
      - name: Audit all ranked WR roles
        run: python scripts/audit_weekly_wr_role_eligibility.py
      - name: Audit low-usage WR candidates
        run: python scripts/audit_week8_wr_low_usage.py
