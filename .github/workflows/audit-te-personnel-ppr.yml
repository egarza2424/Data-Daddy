name: Audit TE Personnel vs PPR Errors

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pandas
      - name: Run descriptive TE personnel audit
        run: |
          python scripts/audit_te_personnel_descriptive.py | tee te-personnel-audit.txt
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: te-personnel-ppr-descriptive-audit
          path: |
            te-personnel-audit.txt
            projection-model/validation/2025-te-personnel-descriptive-audit.csv
          if-no-files-found: warn
