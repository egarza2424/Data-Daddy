name: AI vs PPR Ranking Accuracy Audit

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Weekly Model Validation"]
    types: [completed]

permissions:
  contents: write

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Validate audit script
        run: python -m py_compile scripts/audit_ai_vs_ppr_rankings.py
      - name: Compare completed weeks
        run: python scripts/audit_ai_vs_ppr_rankings.py
      - uses: actions/upload-artifact@v4
        with:
          name: ai-vs-ppr-ranking-audit
          path: model-validation/ai-vs-ppr-ranking-audit.csv
      - name: Publish comparison report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model-validation/ai-vs-ppr-ranking-audit.csv
          if ! git diff --cached --quiet; then
            git commit -m "Publish completed-week AI vs PPR ranking comparison"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
